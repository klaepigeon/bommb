<title>Rhapsody</title>
<meta name="theme-color" content="#140c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --ink: #2a1a12; --paper: #f6ecd0; --paper2: #e8d8b0; --frame: #7a3a18; --red: #c83a2a; --gold: #f0b838; --green: #6a9a30;
  --text: #3a2418; --muted: #7a5e44; --night: #140c0a; --shell: #4a3024; --orange: #d9621e; --teal: #2a7d7a; --plum: #5c2a4a; --good: #5a8a2a; --mustard: #d89a28; --brown: #7a5e44;
  --pix: "Silkscreen", "Courier New", monospace;
  --read: "Pixelify Sans", "Trebuchet MS", sans-serif;
  --safeT: env(safe-area-inset-top, 0px); --safeB: env(safe-area-inset-bottom, 0px);
  --safeL: env(safe-area-inset-left, 0px); --safeR: env(safe-area-inset-right, 0px);
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--night); color: var(--paper); font-family: var(--read); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
  background-image: radial-gradient(rgba(122,58,24,0.18) 1px, transparent 1.2px); background-size: 6px 6px; }
button { font-family: var(--pix); color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- console layout ---------- */
#app { position: fixed; inset: 0; display: grid; gap: 10px; align-items: center; justify-items: center; padding: calc(8px + var(--safeT)) calc(8px + var(--safeR)) calc(8px + var(--safeB)) calc(8px + var(--safeL)); box-sizing: border-box; }
#app.landscape { grid-template-columns: 1fr auto 1fr; grid-template-areas: "L S R"; }
#app.portrait { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr; grid-template-areas: "S S" "C C" "L R"; align-items: start; row-gap: 12px; }
.stage { grid-area: S; position: relative; aspect-ratio: 3 / 2; container-type: inline-size; overflow: hidden; background: var(--night);
  box-shadow: 0 0 0 4px var(--ink), 0 0 0 10px var(--frame), 0 0 0 13px var(--shell), 0 0 0 16px var(--ink), 0 12px 30px rgba(0,0,0,0.6); border-radius: 2px; }
#app.landscape { --sh: min(calc(100vh - 44px - var(--safeT) - var(--safeB)), calc((100vw - 330px) / 1.5)); }
#app.landscape .stage { height: var(--sh); width: calc(var(--sh) * 1.5); }
#app.portrait { --sw: min(calc(100vw - 36px), calc(52vh * 1.5)); }
#app.portrait .stage { width: var(--sw); height: calc(var(--sw) / 1.5); margin-top: 8px; }
#view { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }

/* ---------- HUD inside the screen (sizes follow the screen width) ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; font-size: max(9px, 2.6cqw); }
.box { position: absolute; background: var(--paper); color: var(--text); border: 0.35em solid var(--ink); border-radius: 0.5em; padding: 0.35em 0.7em 0.4em;
  box-shadow: inset 0 0.35em 0 var(--orange), inset 0 0.6em 0 var(--gold), 0 0.3em 0 rgba(20,12,10,0.55); line-height: 1.1; }
.box.plain { box-shadow: 0 0.3em 0 rgba(20,12,10,0.55); }
#hudL { left: 2.2%; top: 3%; padding-top: 0.75em; pointer-events: auto; cursor: pointer; }
#hearts { display: flex; gap: 0.15em; height: 1.2em; }
.heart { width: 1.15em; height: 1.05em; }
#money { font-family: var(--pix); font-size: 1em; margin-top: 0.25em; white-space: nowrap; }
#money b { color: #3a7a20; font-weight: 400; }
#hudR { right: 2.2%; top: 3%; padding-top: 0.75em; text-align: right; font-family: var(--pix); white-space: nowrap; }
#wpnName { font-size: 1em; }
#wpnAmmo { font-size: 0.75em; color: var(--muted); }
#coolBox { right: 2.2%; top: 20%; font-family: var(--pix); font-size: 0.8em; display: flex; align-items: center; gap: 0.4em; white-space: nowrap; }
.meter { width: 4.6em; height: 0.75em; border: 0.18em solid var(--ink); background: #d8c8a0; }
.meter i { display: block; height: 100%; width: 50%; background: linear-gradient(180deg, #6ac0e0, var(--teal)); }
#obj { left: 2.2%; top: 23%; max-width: 46%; font-family: var(--read); font-size: 0.85em; padding: 0.25em 0.55em; }
#obj:empty, #obj[hidden] { display: none; }
#obj .d { color: var(--red); font-family: var(--pix); font-size: 0.85em; }
#banner { left: 50%; top: 3%; transform: translateX(-50%); font-family: var(--read); font-weight: 600; font-size: 1.05em; padding: 0.3em 0.9em; opacity: 0; transition: opacity 0.4s; white-space: nowrap; }
#banner.on { opacity: 1; }
#banner small { display: block; font-family: var(--pix); font-weight: 400; font-size: 0.65em; color: var(--muted); text-align: center; }
#wanted { left: 50%; top: 3%; transform: translateX(-50%); background: var(--red); color: var(--paper); font-family: var(--pix); text-align: center; padding: 0.3em 0.8em; display: none; white-space: nowrap; box-shadow: 0 0.3em 0 rgba(20,12,10,0.55); }
#wanted b { display: block; font-weight: 400; font-size: 0.95em; }
#wanted span { font-size: 0.7em; }
#wanted.search { background: var(--gold); color: var(--ink); }
#wanted.pulse { animation: pulse 0.8s steps(2) infinite; }
@keyframes pulse { 50% { background: #7a1a10; } }
#toasts { position: absolute; left: 50%; transform: translateX(-50%); bottom: 18%; width: 70%; justify-content: flex-end; display: flex; flex-direction: column; gap: 0.35em; align-items: center; }
.toast { position: relative; background: rgba(20,12,10,0.88); color: var(--paper); border: 0.2em solid var(--ink); border-left: 0.5em solid var(--gold); padding: 0.2em 0.55em; font-size: 0.74em; line-height: 1.2; border-radius: 0.3em; animation: tin 0.2s steps(3); }
.toast.bad { border-left-color: var(--red); } .toast.good { border-left-color: var(--green); } .toast.warn { border-left-color: var(--orange); }
@keyframes tin { from { transform: translateY(-0.4em); opacity: 0; } }
#subs { left: 50%; bottom: 3%; transform: translateX(-50%); max-width: 86%; min-width: 40%; font-size: 1em; padding: 0.35em 0.8em 0.4em; padding-top: 0.75em; display: none; }
#subs .tag { display: inline-block; background: var(--red); color: var(--paper); font-family: var(--pix); font-size: 0.7em; padding: 0.1em 0.4em; margin-right: 0.5em; vertical-align: 0.15em; border: 0.15em solid var(--ink); }
#hurt { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 6cqw 2cqw rgba(200,20,10,0); transition: box-shadow 0.25s; }

/* ---------- pads ---------- */
.pad { position: relative; touch-action: none; display: flex; align-items: center; justify-content: center; }
.pad.left { grid-area: L; width: 100%; height: 100%; }
.pad.right { grid-area: R; width: 100%; height: 100%; }
#app.landscape .pad { min-width: 150px; }
#stickzone { position: absolute; inset: 0; touch-action: none; }
.ring { position: relative; width: 132px; height: 132px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #3a2418 0 44%, #5a3424 45% 62%, #3a2418 63%); box-shadow: 0 0 0 5px var(--ink), 0 0 0 11px #6a3a20, 0 0 0 14px var(--ink), inset 0 0 0 3px rgba(240,184,56,0.18); }
.ring::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; border: 2px dashed rgba(240,184,56,0.3); }
#stickknob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fffaf0, var(--paper) 45%, #cdb88a);
  box-shadow: 0 0 0 4px var(--ink), 0 5px 0 4px rgba(0,0,0,0.4); pointer-events: none; }
.btns { position: relative; width: 190px; height: 200px; }
.pbtn { position: absolute; border-radius: 50%; border: 4px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 5px 0 var(--ink); touch-action: none; padding: 0; color: var(--paper); }
.pbtn.on { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); filter: brightness(1.15); }
.pbtn b { font-family: var(--read); font-size: 26px; font-weight: 600; line-height: 1; }
.pbtn small { font-family: var(--pix); font-size: 10px; line-height: 1; margin-top: 2px; }
#bA { right: 0; top: 70px; width: 70px; height: 70px; background: var(--red); }
#bB { right: 66px; top: 112px; width: 68px; height: 68px; background: var(--gold); color: var(--ink); }
#bRun, #bBrake { right: 76px; top: 38px; width: 54px; height: 54px; background: var(--shell); }
#bWpn { right: 8px; top: 0; width: 54px; height: 54px; background: var(--shell); }
.mini { position: absolute; border: 3px solid var(--ink); border-radius: 12px; background: var(--paper2); color: var(--ink); font-size: 9px; padding: 0; width: 46px; height: 26px; box-shadow: 0 3px 0 var(--ink); touch-action: none; }
.mini.on { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.mini.lit { background: var(--gold); }
#mCool { left: 0; top: 4px; } #mMask { left: 0; top: 38px; } #mSneak { left: 0; top: 72px; } #mItem { left: 0; top: 106px; }
#mPhone { left: 0; top: 150px; width: 62px; height: 34px; border-radius: 10px; background: var(--orange); color: var(--paper); font-size: 11px; }
#bRing { right: 0; top: 148px; width: 50px; height: 50px; background: #e0b020; color: var(--ink); box-shadow: 0 5px 0 var(--ink), 0 0 14px rgba(255,226,60,0.6); }
#mLib { display: none !important; }
.ringOnly { display: none !important; } #app.hasRing .ringOnly { display: flex !important; } #app.hasRing.incar .ringOnly { display: none !important; }
.libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin-top: 8px; }
.libi { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border: 3px solid var(--ink); border-radius: 8px; background: #2a1e10; color: #fff27a; font-size: 10px; }
.libi.sel { background: #5a4200; box-shadow: 0 0 0 2px #fff27a inset; }
.libi canvas { width: 36px; height: 36px; image-rendering: pixelated; }
.libi small { color: #c8a860; font-size: 8px; }
.tabs.lib { flex-wrap: wrap; }
canvas.mg { display: block; width: min(100%, 560px, calc(50vh * var(--ar, 1.8))); height: auto; margin: 0 auto; image-rendering: pixelated; border: 3px solid var(--ink); border-radius: 6px; touch-action: none; background: #1b1410; }
.mgmsg { min-height: 1.4em; margin: 6px 2px; font-size: 12px; color: var(--ink); text-align: center; }
.mgbtns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.mgb { border: 3px solid var(--ink); border-radius: 8px; background: var(--paper2); color: var(--ink); font-size: 11px; padding: 8px 10px; box-shadow: 0 3px 0 var(--ink); touch-action: none; min-width: 64px; }
.mgb.big { background: var(--gold); font-size: 13px; min-width: 90px; }
.mgb:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
#sheet .wardrobe .wtop { display: flex; gap: 10px; align-items: flex-start; }
.wport { width: 96px; height: 120px; image-rendering: pixelated; border: 3px solid var(--ink); border-radius: 6px; flex: none; }
.wcats { display: flex; flex-wrap: wrap; gap: 5px; }
.wcats button { border: 3px solid var(--ink); border-radius: 8px; background: var(--paper2); color: var(--ink); font-size: 10px; padding: 6px 8px; }
.wcats button.sel { background: var(--gold); }
.wlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 5px; margin: 10px 0; }
.wi { display: flex; align-items: center; gap: 6px; border: 3px solid var(--ink); border-radius: 8px; background: var(--paper); color: var(--ink); font-family: var(--read); font-size: 13px; padding: 6px 8px; text-align: left; }
.wi.sel { background: #f6dc9a; box-shadow: 0 0 0 2px var(--gold) inset; }
.wi span { flex: 1; } .wi em { font-style: normal; font-family: var(--pix); font-size: 10px; color: var(--brown); }
.wi .sw { width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 3px; flex: none; }
.wfoot { display: flex; gap: 8px; } .wfoot .opt { flex: 1; }
.dbgstat { font-family: var(--pix); font-size: 10px; color: var(--brown); background: var(--paper2); border: 2px solid var(--ink); border-radius: 6px; padding: 6px; line-height: 1.5; }
.dbgrow { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.dbg { border: 2px solid var(--ink); border-radius: 6px; background: var(--paper); color: var(--ink); font-size: 10px; padding: 6px 8px; text-transform: capitalize; }
.dbg.on { background: #bfe0a0; }
.invtop { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--pix); font-size: 10px; color: var(--brown); }
.invtop span { background: var(--paper2); border: 2px solid var(--ink); border-radius: 6px; padding: 3px 6px; }
.invtop .high { background: #d8c0f0; }
.invgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }
.inv { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 3px solid var(--ink); border-radius: 8px; background: #3a2a1c; color: var(--paper); padding: 6px 3px 4px; font-size: 9px; }
.inv canvas { width: 32px; height: 32px; image-rendering: pixelated; }
.inv b { position: absolute; top: 2px; right: 4px; font-family: var(--pix); font-size: 10px; color: var(--gold); }
.inv span { font-family: var(--read); font-size: 11px; line-height: 1.1; text-align: center; }
.invdetail { margin-top: 10px; border: 3px solid var(--ink); border-radius: 8px; background: var(--paper2); padding: 8px; font-size: 13px; color: var(--ink); }
.invdetail p { margin: 4px 0 8px; font-family: var(--read); }
#mHorn { left: 0; top: 4px; } #mRadio { left: 0; top: 38px; }
.carOnly { display: none !important; } #app.incar .carOnly { display: flex !important; } #app.incar .footOnly { display: none !important; }
#padL { flex-direction: column; justify-content: space-evenly; gap: 16px; }
.maprow { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; }
#mapwrap { cursor: pointer; }
#minimap { display: block; width: 88px; height: 88px; border-radius: 50%; box-shadow: 0 0 0 3px var(--ink), 0 0 0 7px var(--frame), 0 0 0 9px var(--ink); background: #1f5566; image-rendering: pixelated; }
#menubtn { border: 3px solid var(--ink); background: var(--paper2); color: var(--ink); border-radius: 10px; font-size: 10px; padding: 6px 8px; box-shadow: 0 3px 0 var(--ink); }
#app.landscape .maprow { flex-direction: column; gap: 10px; }
#app.landscape #minimap { width: 76px; height: 76px; }
#app.landscape .ring { width: 112px; height: 112px; }
#app.landscape .btns { transform: scale(0.76); }
#app.portrait .pad { align-self: center; height: auto; min-height: 300px; }
.btns { flex: none; }
#app.portrait { grid-template-rows: auto auto 1fr; }
/* context strip: Greet / Antagonize / Talk */
#ctx { grid-area: C; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 64px; width: 100%; pointer-events: auto; }
#app.landscape #ctx { position: absolute; left: 50%; bottom: calc(6% + 16px + var(--safeB)); transform: translateX(-50%); min-height: 0; width: auto; }
#ctx .who { font-family: var(--read); font-weight: 600; font-size: 15px; background: var(--paper); color: var(--text); border: 3px solid var(--ink); border-radius: 8px; padding: 2px 10px; }
#ctx .who em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
#ctx .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
#ctx.off > .who, #ctx.off > .chips { visibility: hidden; }
.chip { border: 3px solid var(--ink); border-radius: 16px; padding: 7px 12px; font-size: 12px; box-shadow: 0 3px 0 var(--ink); }
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.c-greet { background: var(--green); color: var(--paper); } .c-antag { background: var(--red); color: var(--paper); } .c-talk { background: var(--paper); color: var(--ink); } .c-flirt { background: #c0406a; color: var(--paper); }
.c-rob { background: var(--plum); color: var(--paper); } .c-defuse { background: var(--teal); color: var(--paper); }
#arrest { display: none; flex-direction: column; align-items: center; gap: 6px; }
#arrest .t { font-family: var(--read); background: var(--red); color: var(--paper); border: 3px solid var(--ink); border-radius: 8px; padding: 3px 10px; font-size: 14px; }

/* ---------- sheets (dialogue, shops, menu) ---------- */
#dim { position: fixed; inset: 0; background: rgba(20,12,10,0.6); display: none; z-index: 10; }
.sheet { position: fixed; left: 50%; bottom: calc(10px + var(--safeB)); transform: translateX(-50%); width: min(calc(100% - 20px), 540px); max-height: 80%; display: none; flex-direction: column; z-index: 11;
  background: var(--paper); color: var(--text); border: 4px solid var(--ink); border-radius: 10px; box-shadow: 0 0 0 5px var(--frame), 0 0 0 8px var(--ink), 0 10px 30px rgba(0,0,0,0.6); font-family: var(--read); }
.sheet.center { bottom: auto; top: 50%; transform: translate(-50%, -50%); max-height: 88%; }
.sheet header { display: flex; align-items: center; gap: 12px; padding: 12px 14px 8px; border-bottom: 3px solid var(--ink); background: linear-gradient(180deg, var(--orange) 0 5px, var(--gold) 5px 9px, var(--paper) 9px); padding-top: 18px; }
.sheet header h2 { font-family: var(--pix); font-weight: 400; font-size: 17px; margin: 0; line-height: 1.15; color: var(--red); text-wrap: balance; }
.sheet header p { margin: 3px 0 0; font-size: 14px; color: var(--muted); }
.sheet header .x { margin-left: auto; background: var(--ink); color: var(--paper); border: 0; border-radius: 6px; width: 34px; height: 34px; font-size: 14px; flex: none; }
.sheet .body { overflow-y: auto; padding: 10px 14px 14px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.portrait { width: 56px; height: 74px; flex: none; background: #d8c8a0; border: 3px solid var(--ink); border-radius: 6px; image-rendering: pixelated; }
.line { font-size: 18px; line-height: 1.35; margin: 4px 0 12px; min-height: 1.3em; }
.line b { color: var(--red); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 7px; }
.opt { text-align: left; background: #fffaf0; border: 3px solid var(--ink); border-radius: 8px; padding: 9px 12px; font-family: var(--read); font-size: 16px; font-weight: 600; box-shadow: 0 3px 0 var(--ink); color: var(--text); }
.opt::before { content: "▶ "; color: var(--red); font-size: 12px; }
.opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.opt.dim { opacity: 0.45; }
.opt .p { float: right; font-family: var(--pix); font-size: 13px; line-height: 1.5; color: #3a7a20; margin-left: 10px; font-weight: 400; }
.opt small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
.opt.go { background: var(--gold); } .opt.bad { background: #f2c0a8; }
.sect { font-family: var(--pix); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--frame); margin: 14px 0 6px; }
.people { display: flex; flex-direction: column; gap: 6px; }
.person { display: flex; align-items: center; gap: 10px; background: #fffaf0; border: 2px solid rgba(42,26,18,0.4); border-radius: 8px; padding: 5px 8px; }
.person .n { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.15; }
.person .n small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.pmeter { height: 7px; background: rgba(42,26,18,0.18); border: 2px solid var(--ink); width: 56px; }
.pmeter i { display: block; height: 100%; }
.tabs { flex: none; display: flex; gap: 4px; padding: 10px 10px 0; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; border-bottom: 3px solid var(--ink); background: var(--paper2); }
.tabs button { flex: none; border: 3px solid var(--ink); border-bottom: none; border-radius: 8px 8px 0 0; padding: 7px 10px; background: var(--paper); font-size: 11px; color: var(--ink); }
.tabs button.sel { background: var(--red); color: var(--paper); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
.kv span:nth-child(even) { font-family: var(--pix); font-size: 13px; text-align: right; color: var(--red); }
.news h3 { font-family: var(--pix); font-weight: 400; font-size: 20px; text-align: center; margin: 4px 0 0; color: var(--ink); border-bottom: 4px double var(--ink); padding-bottom: 4px; }
.news .dateline { text-align: center; font-family: var(--pix); font-size: 10px; text-transform: uppercase; margin: 4px 0 10px; color: var(--muted); }
.news p { margin: 0 0 8px; font-size: 15px; line-height: 1.35; border-bottom: 1px dashed rgba(42,26,18,0.35); padding-bottom: 6px; }
.news p b { font-family: var(--pix); font-weight: 400; font-size: 10px; color: var(--red); text-transform: uppercase; display: block; }
.progress { height: 14px; border: 3px solid var(--ink); background: #fffaf0; margin: 8px 0; }
.progress i { display: block; height: 100%; background: var(--orange); width: 0; }
.set { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; font-size: 15px; margin-bottom: 10px; }
.set select, .set input { font-family: var(--read); font-size: 15px; }
#fullmap { width: 100%; aspect-ratio: 1 / 1; display: block; border: 4px solid var(--ink); touch-action: none; background: #1f5566; image-rendering: pixelated; }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6%; box-sizing: border-box; z-index: 5; font-size: max(10px, 2.6cqw); }
#title { background: transparent; justify-content: flex-end; padding-bottom: 7%; cursor: pointer; }
#title .menu { display: flex; flex-direction: column; gap: 0.5em; width: 42%; }
#title .menu button { font-size: 1em; padding: 0.55em; border: 0.25em solid var(--ink); border-radius: 0.4em; background: var(--paper); color: var(--ink); box-shadow: 0 0.25em 0 var(--ink); }
#title .menu button#btnNew, #title .menu button#btnContinue { background: var(--gold); }
#loading { font-family: var(--pix); color: var(--gold); font-size: 1em; }
#death, #story { background: rgba(20,12,10,0.86); }
#death h1, #story h1 { font-family: var(--pix); font-weight: 400; font-size: 2.2em; margin: 0 0 0.3em; color: var(--gold); text-shadow: 0.12em 0.12em 0 var(--red); }
#death p, #story p { font-size: 1.05em; max-width: 36ch; line-height: 1.4; white-space: pre-line; color: var(--paper); margin: 0; }
.bigbtn { font-size: 0.95em; padding: 0.55em 1.4em; border: 0.25em solid var(--ink); border-radius: 0.4em; background: var(--gold); color: var(--ink); box-shadow: 0 0.25em 0 var(--ink); margin-top: 1em; }
@media (prefers-reduced-motion: reduce) { .toast, #wanted.pulse { animation: none; } }
</style>
<div id="app" class="portrait">
  <div class="stage" id="stage">
    <canvas id="view" width="480" height="320" aria-label="Rhapsody game view"></canvas>
    <div class="screen" id="title">
      <div id="loading">BUILDING THE COAST…</div>
      <div class="menu" hidden>
        <button id="btnContinue" hidden>CONTINUE</button>
        <button id="btnNew">NEW GAME</button>
        <button id="btnHelp">HOW TO PLAY</button>
      </div>
    </div>
    <div class="screen" id="story"><h1></h1><p></p><button class="bigbtn">CONTINUE</button></div>
    <div class="screen" id="death"><h1>LIGHTS OUT</h1><p>Somebody put you down. The hospital will patch you up, for a price.</p><button class="bigbtn">WAKE UP</button></div>
  </div>
  <div id="ctx" class="off"><div class="who"></div><div class="chips"></div>
    <div id="arrest"><div class="t">"Hands where I can see them!"</div><div class="chips"><button class="chip c-talk" id="surrender">SURRENDER</button><button class="chip c-antag" id="resist">RESIST</button></div></div>
  </div>
  <div class="pad left" id="padL">
    <div id="stickzone"></div>
    <div class="maprow"><div id="mapwrap" role="button" aria-label="Open map"><canvas id="minimap" width="184" height="184"></canvas></div><button id="menubtn" aria-label="Menu">MENU</button></div>
    <div class="ring" id="stickbase"><div id="stickknob"></div></div>
  </div>
  <div class="pad right" id="padR">
    <div class="btns">
      <button class="pbtn" id="bA" data-k="use" aria-label="Use"><b>A</b><small id="aLabel">USE</small></button>
      <button class="pbtn" id="bB" data-k="attack" aria-label="Attack"><b>B</b><small>HIT</small></button>
      <button class="pbtn footOnly" id="bRun" data-k="run" aria-label="Run"><small>RUN</small></button>
      <button class="pbtn carOnly" id="bBrake" data-k="brake" aria-label="Brake"><small>BRAKE</small></button>
      <button class="pbtn" id="bWpn" data-k="weapon" aria-label="Switch weapon"><small>SWAP</small></button>
      <button class="pbtn ringOnly footOnly" id="bRing" data-k="ring" aria-label="Ring"><small>RING</small></button>
      <button class="mini ringOnly footOnly" id="mLib" data-k="lib">LIB</button>
      <button class="mini footOnly" id="mCool" data-k="cool">COOL</button>
      <button class="mini footOnly" id="mMask" data-k="mask">MASK</button>
      <button class="mini footOnly" id="mSneak" data-k="sneak">SNEAK</button>
      <button class="mini" id="mItem" data-k="heal">ITEM</button>
      <button class="mini carOnly" id="mHorn" data-k="horn">HORN</button>
      <button class="mini carOnly" id="mRadio" data-k="radio">RADIO</button>
      <button class="mini" id="mPhone" data-k="phone">☎ PHONE</button>
    </div>
  </div>
  <div id="dim"></div>
  <div class="sheet" id="sheet"></div>
</div>
