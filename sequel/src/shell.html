<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Brass Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --shell: #2a2a3a; --shell2: #3a3a52; --hinge: #1c1c28; --screen: #0c0a24; --paper: #f4f0fa; --ink: #241c3a; --muted: #6a6488;
  --accent: #e8742a; --good: #3aa860; --bad: #d84848; --btnA: #d84848; --btnB: #e8b020;
  --safeT: env(safe-area-inset-top, 0px); --safeB: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --shell: #d8d4e4; --shell2: #e8e4f2; --hinge: #b8b4c8; } }
:root[data-theme="light"] { --shell: #d8d4e4; --shell2: #e8e4f2; --hinge: #b8b4c8; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--shell); color: var(--paper); font-family: 'Pixelify Sans', ui-monospace, monospace; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; cursor: pointer; }
[hidden] { display: none !important; }

/* the clamshell: top screen, hinge, touch screen, controls (portrait); controls at the sides (landscape) */
#ds { position: fixed; inset: 0; display: grid; justify-items: center; align-items: center; padding: calc(8px + var(--safeT)) 8px calc(8px + var(--safeB));
  --sw: min(calc(100vw - 20px), calc((100vh - 250px - var(--safeT) - var(--safeB)) / 1.5 * 4 / 3 * 0.75 * 1.3333));
  grid-template-rows: auto auto auto 1fr; grid-template-areas: "top" "hinge" "bot" "ctl"; }
#ds { --sw: min(calc(100vw - 20px), calc((100vh - 240px - var(--safeT) - var(--safeB)) * 2 / 3)); }
.screen { position: relative; width: var(--sw); height: calc(var(--sw) * 0.75); background: var(--screen); border-radius: 4px; overflow: hidden;
  box-shadow: 0 0 0 3px #0a0a14, 0 0 0 8px var(--shell2), 0 0 0 10px #0a0a14; }
#top { grid-area: top; }
#hinge { grid-area: hinge; width: calc(var(--sw) * 0.6); height: 10px; margin: 8px 0; border-radius: 5px; background: var(--hinge); box-shadow: inset 0 2px 3px rgba(0,0,0,0.4); }
#bot { grid-area: bot; display: flex; flex-direction: column; font-size: calc(var(--sw) / 30); background: #e8e4f4; color: var(--ink); }
#view { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#controls { grid-area: ctl; width: min(100%, calc(var(--sw) + 20px)); display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 0; }
#stickzone { width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle, #1c1c28 0 42%, var(--shell2) 43% 100%); display: grid; place-items: center; touch-action: none; box-shadow: inset 0 3px 6px rgba(0,0,0,0.4); }
#knob { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #6a6a88, #3a3a52); box-shadow: 0 3px 0 #101018; pointer-events: none; }
.btns { position: relative; width: 150px; height: 132px; }
.btn { position: absolute; border: none; border-radius: 50%; color: #fff; font-weight: 600; box-shadow: 0 4px 0 rgba(0,0,0,0.45); touch-action: none; display: grid; place-items: center; line-height: 1; }
.btn.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.45); }
#btnA { right: 4px; top: 18px; width: 72px; height: 72px; background: var(--btnA); font-size: 26px; }
#btnA span { position: absolute; bottom: -17px; font-size: 11px; color: var(--paper); white-space: nowrap; letter-spacing: 0.05em; }
#btnB { left: 6px; top: 58px; width: 58px; height: 58px; background: var(--btnB); font-size: 22px; color: #2a1c08; }
#btnB small { position: absolute; bottom: -16px; font-size: 10px; color: var(--paper); }
#btnStart { position: absolute; left: 50%; transform: translateX(-50%); top: -4px; width: 64px; height: 22px; border-radius: 11px; background: #4a4a62; font-size: 10px; color: #d8d4e8; border: none; box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
#controls .mid { position: relative; width: 70px; height: 132px; }
@media (orientation: landscape) and (max-height: 600px) {
  #ds { --sw: min(calc((100vh - 36px - var(--safeT) - var(--safeB)) * 2 / 3), calc(100vw - 340px)); grid-template-columns: 1fr auto 1fr; grid-template-rows: auto auto auto; grid-template-areas: "l top r" "l hinge r" "l bot r"; align-content: center; }
  #hinge { margin: 4px 0; height: 6px; }
  #controls { display: contents; }
  #stickzone { grid-area: l; } .btns { grid-area: r; } #controls .mid { display: none; }
}

/* top-screen overlays */
#dialog { position: absolute; left: 3%; right: 3%; bottom: 4%; min-height: 30%; background: var(--paper); color: var(--ink); border-radius: 6px; padding: 5% 4% 3%;
  font-size: calc(var(--sw) / 24); line-height: 1.25; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #5a78c8, 0 4px 0 4px rgba(0,0,0,0.35); }
#dialog .who { position: absolute; top: -0.9em; left: 0.8em; background: #5a78c8; color: #fff; padding: 0.15em 0.6em; border-radius: 4px; font-size: 0.85em; }
#dialog .who:empty { display: none; }
#dialog p { margin: 0; min-height: 2.5em; }
#dialog .more { position: absolute; right: 0.8em; bottom: 0.4em; color: #d84848; opacity: 0; animation: bob 0.8s infinite; }
#dialog.done:not([data-choices="1"]) .more { opacity: 1; }
@keyframes bob { 50% { transform: translateY(2px); } }
#dialog .choices { display: flex; flex-wrap: wrap; gap: 0.4em; margin-top: 0.5em; }
#dialog .choices:empty { display: none; }
#dialog .choices button { font-size: 0.9em; padding: 0.3em 0.7em; border-radius: 4px; border: 2px solid #5a78c8; background: #fff; color: var(--ink); }
#dialog .choices button:first-child { background: #5a78c8; color: #fff; }
#toasts { position: absolute; top: 4%; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
.toast { background: rgba(20,16,40,0.9); color: var(--paper); font-size: calc(var(--sw) / 30); padding: 0.3em 0.8em; border-radius: 4px; transition: opacity 0.5s; max-width: 90%; text-align: center; }
.toast.good { box-shadow: inset 3px 0 0 var(--good); } .toast.bad { box-shadow: inset 3px 0 0 var(--bad); } .toast.out { opacity: 0; }
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4%; pointer-events: none; }
#title h1 { margin: 0; font-size: calc(var(--sw) / 9); color: #ffd060; text-shadow: 0 3px 0 #c83a2a, 0 6px 0 #2a1c3a; letter-spacing: 0.04em; text-align: center; line-height: 0.95; }
#title h1 small { display: block; font-size: 0.42em; color: #a8c8ff; text-shadow: 0 2px 0 #2a1c3a; letter-spacing: 0.2em; margin-top: 0.3em; }
#title .menu { display: flex; gap: 8px; pointer-events: auto; }
#title button { font-size: calc(var(--sw) / 22); padding: 0.4em 1em; border-radius: 6px; border: none; background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 #5a78c8; }
#title p { margin: 0; font-size: calc(var(--sw) / 32); color: #b8b0d8; }

/* the Ship Watch (bottom screen) */
#status { display: flex; justify-content: space-between; padding: 0.35em 0.6em; background: #5a78c8; color: #fff; font-size: 0.9em; }
#status .hot { color: #ffd060; }
#apps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 3px; background: #c8c4dc; }
#apps button { border: none; border-radius: 4px; background: #f4f0fa; color: var(--ink); font-size: 0.72em; padding: 0.25em 0 0.2em; display: flex; flex-direction: column; align-items: center; }
#apps button i { font-style: normal; font-size: 1.3em; line-height: 1.1; }
#apps button.on { background: #e8742a; color: #fff; }
#appbody { flex: 1; overflow-y: auto; padding: 0.4em 0.6em; touch-action: pan-y; }
#appbody h4 { margin: 0.1em 0 0.3em; font-size: 0.9em; color: #5a78c8; }
#appbody .list p { margin: 0.2em 0; font-size: 0.85em; }
#appbody .list p.done { color: var(--good); }
#appbody .list small { color: var(--muted); }
#appbody .list em { color: var(--bad); font-style: normal; font-size: 0.85em; }
#appbody .hint { color: var(--muted); font-size: 0.75em !important; }
#appbody canvas#mapcv { width: 100%; image-rendering: pixelated; border-radius: 4px; display: block; }
#appbody .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
#appbody .row button, .trade button { font-size: 0.75em; padding: 0.3em 0.5em; border: none; border-radius: 4px; background: #5a78c8; color: #fff; }
#appbody button:disabled { opacity: 0.35; }
.shiptop { font-size: 0.9em; margin-bottom: 3px; } .shiptop small { color: var(--muted); }
.grid { display: grid; gap: 2px; background: #3c4654; padding: 3px; border-radius: 4px; max-width: 100%; margin: 0 auto; }
.grid .cell { aspect-ratio: 1; border: none; border-radius: 2px; background: #2c3440; padding: 0; display: grid; place-items: center; }
.grid .cell canvas, .pal .mod canvas { width: 80%; image-rendering: pixelated; }
.pal { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; margin-top: 4px; }
.pal .mod { aspect-ratio: 1; border: 2px solid transparent; border-radius: 3px; background: #d8d4e8; padding: 0; display: grid; place-items: center; }
.pal .mod.on { border-color: #e8742a; background: #fff; }
.stats { font-size: 0.72em; color: var(--ink); margin-top: 3px; }
.warn { font-size: 0.72em; color: var(--bad); margin-top: 2px; }
.info { font-size: 0.72em; color: var(--muted); margin-top: 3px; min-height: 2.4em; }
.trade { display: grid; grid-template-columns: 1fr auto 3.2em auto auto; gap: 4px; align-items: center; font-size: 0.82em; margin: 2px 0; }
.trade small { color: var(--muted); font-size: 0.8em; }
</style>
</head>
<body>
<div id="ds">
  <div class="screen" id="top">
    <canvas id="view"></canvas>
    <div id="title" hidden><h1>RHAPSODY II<small>BRASS STARS</small></h1><div class="menu"><button id="tContinue" hidden>CONTINUE</button><button id="tNew">NEW GAME</button></div><p>prototype v0.1 · year XX7X</p></div>
    <div id="toasts"></div>
    <div id="dialog" hidden></div>
  </div>
  <div id="hinge"></div>
  <div class="screen" id="bot">
    <div id="status"></div>
    <div id="apps"></div>
    <div id="appbody"></div>
  </div>
  <div id="controls">
    <div id="stickzone"><div id="knob"></div></div>
    <div class="mid"><button id="btnStart">START</button></div>
    <div class="btns"><button class="btn" id="btnB">B<small>RUN/FIRE</small></button><button class="btn" id="btnA">A<span></span></button></div>
  </div>
</div>
<!--APP-->
</body>
</html>
