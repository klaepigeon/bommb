<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eight-Ball Derby</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: full-screen app. Slim control bar on top, the track fills everything else,
     a timing rail on the right (it drops to a compact strip under the track on phones). */
  :root {
    --bg: #0e1119;
    --board: #161a26;
    --panel: #12151f;
    --line: #262c3f;
    --fg: #e9ecf5;
    --muted: #8a92ab;
    --ink: #0e1119;
    --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { font-family: var(--body); font-size: 14px; }
  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
  .pick { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 240px; }
  select {
    font: 500 14px var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; min-width: 0; max-width: 100%; flex: 0 1 auto;
  }
  .blurb { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .clock { display: flex; align-items: baseline; gap: 10px; margin-left: auto; }
  #timer { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 6.2ch; text-align: right; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button {
    font: 600 14px/1 var(--body); color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  #go { background: var(--fg); color: var(--ink); border-color: var(--fg); min-width: 104px;
        font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .speed { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .speed button { border: 0; border-radius: 0; padding: 10px 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .speed button[aria-pressed="true"] { background: var(--line); color: var(--fg); }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 236px; min-height: 0; }
  .board { position: relative; min-height: 0; min-width: 0; background: var(--board); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .tower {
    background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
    padding: 14px 14px 14px; padding-right: max(14px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 12px; min-width: 0;
  }
  .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  #state { font-size: 13px; color: var(--muted); }
  .ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  .row {
    display: grid; grid-template-columns: 20px 12px minmax(0, 1fr) auto; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 7px; background: var(--bg); border: 1px solid var(--line);
  }
  .row.done { border-color: color-mix(in srgb, var(--c) 50%, var(--line)); }
  .pos { font-family: var(--display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .chip { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .who { display: grid; gap: 4px; min-width: 0; }
  .name { font-weight: 600; font-size: 13px; }
  .bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; background: var(--c); }
  .stat { text-align: right; display: grid; gap: 1px; font-variant-numeric: tabular-nums; }
  .t { font-family: var(--display); font-weight: 700; font-size: 14px; }
  .gap { font-size: 11px; color: var(--muted); }
  .wins { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .tally span { display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
  .tally i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

  @media (max-width: 760px) {
    header { gap: 8px 10px; }
    h1 { font-size: 16px; }
    .blurb { display: none; }
    #timer { font-size: 24px; }
    .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .tower { border-left: 0; border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); gap: 6px; overflow: visible; }
    .tower > .label, .wins, #state { display: none; }
    .ranks { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    .row { grid-template-columns: auto 10px minmax(0, 1fr); gap: 5px; padding: 5px 6px; }
    .row .who { display: none; }
    .pos { font-size: 13px; }
    .chip { width: 10px; height: 10px; }
    .t { font-size: 12px; }
    .gap { display: none; }
  }
</style>

<div class="app">
  <header>
    <h1>Eight-Ball Derby</h1>
    <div class="pick">
      <label class="label" for="pick">Course</label>
      <select id="pick" aria-label="Course"></select>
      <span class="blurb" id="blurb"></span>
    </div>
    <div class="clock"><span id="timer">0:00.00</span></div>
    <div class="controls">
      <button id="go" type="button">Start</button>
      <button id="shuffle" type="button">Random</button>
      <div class="speed" role="group" aria-label="Simulation speed">
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="2" aria-pressed="false">2×</button>
        <button type="button" data-speed="4" aria-pressed="false">4×</button>
      </div>
    </div>
  </header>

  <div class="stage">
    <div class="board" id="board"><canvas id="cv" aria-label="Race track"></canvas></div>
    <aside class="tower">
      <span id="state">On the grid. Press Start.</span>
      <span class="label">Standings</span>
      <ol class="ranks" id="ranks"></ol>
      <div class="wins">
        <span class="label">Wins this session</span>
        <div class="tally" id="tally"></div>
      </div>
    </aside>
  </div>
</div>

<script>
// ---------- constants ----------
const R = 10, M = 20;
const SHORT = 600;           // the world's short side; the long side follows the screen
let SPEED = 330;             // px per second, same for every ball (set per course from its length)
let DRIFT = 650;             // gentle pull along the course so races end
const JITTER = 0.75;         // max random deflection on a bounce (radians, ~43°)
const COURSE_COUNT = 100;
const RACERS = [
  { id: 'red',    name: 'Red',    color: '#ff4d4d', dark: '#a8262b' },
  { id: 'blue',   name: 'Blue',   color: '#3d8bff', dark: '#1d4fa8' },
  { id: 'yellow', name: 'Yellow', color: '#ffd23f', dark: '#b08a12' },
  { id: 'green',  name: 'Green',  color: '#34d27b', dark: '#16834a' },
  { id: 'orange', name: 'Orange', color: '#ff8a2b', dark: '#a8500f' },
  { id: 'purple', name: 'Purple', color: '#a66bff', dark: '#5d32a8' },
  { id: 'pink',   name: 'Pink',   color: '#ff6fc8', dark: '#a8337c' },
  { id: 'cyan',   name: 'Cyan',   color: '#2fd6d6', dark: '#13807f' },
];
const N = RACERS.length;
let W = 1067, H = 600;

// Course layouts use a seeded generator so course #37 is always course #37.
let rnd = Math.random;
const rand = (a, b) => a + rnd() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const jr = (a, b) => a + Math.random() * (b - a);   // race-time randomness (bounces, launch)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ---------- geometry ----------
const seg = (x1, y1, x2, y2) => ({ x1, y1, x2, y2 });
function poly(pts) { const o = []; for (let i = 0; i < pts.length - 1; i++) o.push(seg(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1])); return o; }
function closest(px, py, s) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - s.x1) * dx + (py - s.y1) * dy) / l2, 0, 1) : 0;
  return { x: s.x1 + dx * t, y: s.y1 + dy * t };
}
function distSeg(px, py, s) { const c = closest(px, py, s); return Math.hypot(px - c.x, py - c.y); }

// ---------- course building blocks ----------
// Every generator works in a landscape-style frame {w, h}; the result is mirrored and/or
// transposed afterwards to fit the screen.
function frameOf(w, h) { return { w, h, x0: M, y0: M, x1: w - M, y1: h - M }; }
function baseCourse(f) {
  return { walls: poly([[f.x0, f.y0], [f.x1, f.y0], [f.x1, f.y1], [f.x0, f.y1], [f.x0, f.y0]]), bumpers: [], deflectors: [], spinners: [], path: [], start: null, finish: null, used: [] };
}
function canPlace(c, x, y, r, clear) {
  for (const w of c.walls) if (distSeg(x, y, w) < r + clear) return false;
  for (const it of c.used) if (Math.hypot(x - it.x, y - it.y) < r + it.r + clear) return false;
  for (const z of [c.start, c.finish]) {
    if (x > z.x - r - clear && x < z.x + z.w + r + clear && y > z.y - r - clear && y < z.y + z.h + r + clear) return false;
  }
  return true;
}
const THEMES = [
  { name: 'mixed', kinds: ['bumper', 'bumper', 'deflector', 'deflector', 'spinner'] },
  { name: 'bumpers', kinds: ['bumper'] },
  { name: 'spinners', kinds: ['spinner', 'spinner', 'bumper'] },
  { name: 'deflectors', kinds: ['deflector', 'deflector', 'bumper'] },
];
function scatter(c, reg, count, kinds, opt = {}) {
  const clear = opt.clear ?? 34, rMin = opt.rMin ?? 12, rMax = opt.rMax ?? 22;
  let placed = 0, tries = 0;
  while (placed < count && tries++ < 500) {
    const kind = kinds[Math.floor(rnd() * kinds.length)];
    const x = rand(reg.x, reg.x + reg.w), y = rand(reg.y, reg.y + reg.h);
    if (kind === 'bumper') {
      const r = rand(rMin, rMax);
      if (!canPlace(c, x, y, r, clear)) continue;
      c.bumpers.push({ x, y, r, flash: 0 }); c.used.push({ x, y, r });
    } else if (kind === 'deflector') {
      const len = rand(44, 72), a = rand(0, Math.PI), r = len / 2 + 4;
      if (!canPlace(c, x, y, r, clear)) continue;
      const dx = Math.cos(a) * len / 2, dy = Math.sin(a) * len / 2;
      c.deflectors.push(seg(x - dx, y - dy, x + dx, y + dy)); c.used.push({ x, y, r });
    } else {
      const len = rand(70, 104), r = len / 2 + 4;
      if (!canPlace(c, x, y, r, clear)) continue;
      c.spinners.push({ x, y, len, a: rand(0, Math.PI), w: rand(1.3, 2.6) * (rnd() < .5 ? -1 : 1) }); c.used.push({ x, y, r });
    }
    placed++;
  }
}
// Lanes stacked across the frame, joined by hairpins at alternating ends.
function laneLayout(f, minH, maxH) {
  const span = f.y1 - f.y0;
  const n = clamp(irand(2, 6), Math.ceil(span / maxH), Math.max(2, Math.floor(span / minH)));
  const lh = span / n, gap = rand(88, 118);
  const walls = [], tops = [];
  for (let i = 0; i <= n; i++) tops.push(f.y0 + lh * i);
  for (let i = 1; i < n; i++) walls.push(i % 2 ? seg(f.x0, tops[i], f.x1 - gap, tops[i]) : seg(f.x0 + gap, tops[i], f.x1, tops[i]));
  const cy = i => f.y0 + lh * (i + .5);
  const path = [[f.x0 + 50, cy(0)]];
  for (let i = 0; i < n; i++) {
    const right = i % 2 === 0;
    if (i < n - 1) { const x = right ? f.x1 - gap / 2 : f.x0 + gap / 2; path.push([x, cy(i)], [x, cy(i + 1)]); }
    else path.push([right ? f.x1 - 35 : f.x0 + 35, cy(i)]);
  }
  const lastRight = (n - 1) % 2 === 0;
  return {
    n, lh, gap, tops, walls, path,
    start: { x: f.x0, y: f.y0, w: 120, h: lh },
    finish: { x: lastRight ? f.x1 - 64 : f.x0, y: tops[n - 1], w: 64, h: lh },
  };
}

// ---------- course families ----------
function famSwitchback(f) {
  const c = baseCourse(f), L = laneLayout(f, 112, 230), theme = THEMES[irand(0, 3)];
  c.walls.push(...L.walls); c.path = L.path; c.start = L.start; c.finish = L.finish;
  const per = Math.max(2, Math.round((f.x1 - f.x0 - 2 * L.gap) / 165 * rand(.8, 1.2)));
  for (let i = 0; i < L.n; i++) scatter(c, { x: f.x0 + L.gap + 20, y: L.tops[i], w: f.x1 - f.x0 - 2 * L.gap - 40, h: L.lh }, per, theme.kinds);
  c.blurb = `${L.n} lanes, ${L.n - 1} hairpins, ${theme.name}`;
  return c;
}
function famChicanes(f) {
  const c = baseCourse(f), L = laneLayout(f, 112, 190);
  c.walls.push(...L.walls); c.path = L.path; c.start = L.start; c.finish = L.finish;
  const spacing = rand(140, 200), depth = rand(.32, .48);
  for (let i = 0; i < L.n; i++) {
    let fromTop = rnd() < .5;
    for (let x = f.x0 + L.gap + 70 + rand(0, 40); x < f.x1 - L.gap - 50; x += spacing * rand(.85, 1.15)) {
      const len = L.lh * depth * rand(.9, 1.1), y = fromTop ? L.tops[i] : L.tops[i] + L.lh;
      c.walls.push(seg(x, y, x, fromTop ? y + len : y - len));
      fromTop = !fromTop;
    }
  }
  c.blurb = `${L.n} lanes of staggered baffles`;
  return c;
}
function famSnail(f) {
  const c = baseCourse(f), g = rand(84, 108), h = f.y1 - f.y0;
  const pts = [[f.x0, f.y0 + g]];
  let k = 1;
  for (;;) {
    pts.push([f.x1 - k * g, f.y0 + k * g], [f.x1 - k * g, f.y1 - k * g], [f.x0 + k * g, f.y1 - k * g], [f.x0 + k * g, f.y0 + (k + 1) * g]);
    if (h - (2 * k + 3) * g >= g * .95) k++; else break;
  }
  pts.push([f.x1 - (k + 1) * g, f.y0 + (k + 1) * g]);
  c.walls.push(...poly(pts));
  const p = [[f.x0 + 45, f.y0 + g / 2]];
  for (let j = 0; j < k; j++) {
    const o = (j + .5) * g;
    p.push([f.x1 - o, f.y0 + o], [f.x1 - o, f.y1 - o], [f.x0 + o, f.y1 - o], [f.x0 + o, f.y0 + o + g]);
  }
  const pocketTop = f.y0 + (k + 1) * g, pocketBot = f.y1 - k * g, pcy = (pocketTop + pocketBot) / 2;
  p.push([f.x1 - (k + .5) * g, f.y0 + (k + .5) * g], [f.x1 - (k + .5) * g, pcy], [f.x0 + k * g + 45, pcy]);
  c.path = p;
  c.start = { x: f.x0, y: f.y0, w: 130, h: g };
  c.finish = { x: f.x0 + k * g, y: pocketTop, w: 80, h: pocketBot - pocketTop };
  const o = { rMin: 7, rMax: 11, clear: 28 };
  const count = irand(6, 16);
  for (let j = 0; j <= k; j++) {
    scatter(c, { x: f.x0 + j * g + 60, y: f.y0 + j * g, w: f.x1 - f.x0 - 2 * j * g - 120, h: g }, Math.ceil(count / (k + 1) / 2), ['bumper'], o);
    scatter(c, { x: f.x0 + j * g + 60, y: f.y1 - (j + 1) * g, w: f.x1 - f.x0 - 2 * j * g - 120, h: g }, Math.ceil(count / (k + 1) / 2), ['bumper'], o);
  }
  c.blurb = `a ${k + 1}-ring spiral into a centre pocket`;
  return c;
}
function famPinfield(f) {
  const c = baseCourse(f), gh = rand(100, 130), gcy = rand(f.y0 + 90 + gh / 2, f.y1 - 90 - gh / 2);
  const gy0 = gcy - gh / 2, gy1 = gcy + gh / 2, fx = f.x1 - 64, fun = rand(90, 200);
  c.walls.push(seg(fx - fun, f.y0, fx, gy0), seg(fx - fun, f.y1, fx, gy1), seg(fx, gy0, f.x1, gy0), seg(fx, gy1, f.x1, gy1));
  const mid = (f.y0 + f.y1) / 2;
  c.path = [[f.x0 + 45, mid], [f.x1 - 30, gcy]];
  c.start = { x: f.x0, y: mid - 85, w: 90, h: 170 };
  c.finish = { x: fx, y: gy0, w: f.x1 - fx, h: gh };
  const field = { x: f.x0 + 140, y: f.y0 + 40, w: fx - fun - f.x0 - 180, h: f.y1 - f.y0 - 80 };
  scatter(c, field, irand(0, 5), ['spinner']);
  scatter(c, field, irand(0, 6), ['deflector']);
  const step = rand(56, 76), skip = rand(.1, .35), hex = rnd() < .7;
  for (let row = 0, y = f.y0 + 36; y < f.y1 - 20; row++, y += step * (hex ? .87 : 1)) {
    for (let x = f.x0 + 110 + (hex && row % 2 ? step / 2 : 0); x < fx - 40; x += step) {
      if (rnd() < skip) continue;
      const px = x + rand(-9, 9), py = y + rand(-9, 9), r = rand(6, 10);
      if (!canPlace(c, px, py, r, 26)) continue;
      c.bumpers.push({ x: px, y: py, r, flash: 0 }); c.used.push({ x: px, y: py, r });
    }
  }
  c.blurb = `a ${hex ? 'staggered' : 'square'} peg field into a narrow gate`;
  return c;
}
function famIslands(f) {
  const c = baseCourse(f), gh = rand(110, 150), gcy = rand(f.y0 + 80 + gh / 2, f.y1 - 80 - gh / 2);
  const fx = f.x1 - 60;
  c.walls.push(seg(fx, f.y0, fx, gcy - gh / 2), seg(fx, gcy + gh / 2, fx, f.y1));
  const mid = (f.y0 + f.y1) / 2;
  c.path = [[f.x0 + 45, mid], [f.x1 - 30, gcy]];
  c.start = { x: f.x0, y: mid - 85, w: 100, h: 170 };
  c.finish = { x: fx, y: gcy - gh / 2, w: f.x1 - fx, h: gh };
  const area = (fx - f.x0) * (f.y1 - f.y0), want = Math.round(area / 30000 * rand(.7, 1.2));
  let made = 0, tries = 0;
  while (made < want && tries++ < 700) {
    const bw = rand(40, 140), bh = rand(30, 120), x = rand(f.x0 + 140, fx - 60 - bw), y = rand(f.y0 + 10, f.y1 - 10 - bh);
    const cx = x + bw / 2, cy = y + bh / 2, r = Math.hypot(bw, bh) / 2;
    if (!canPlace(c, cx, cy, r, 36)) continue;
    c.walls.push(...poly([[x, y], [x + bw, y], [x + bw, y + bh], [x, y + bh], [x, y]]));
    c.used.push({ x: cx, y: cy, r }); made++;
  }
  scatter(c, { x: f.x0 + 140, y: f.y0, w: fx - f.x0 - 200, h: f.y1 - f.y0 }, irand(2, 8), ['bumper', 'spinner']);
  c.blurb = `${made} islands to weave between`;
  return c;
}
const FAMILIES = [
  { noun: 'Switchback', gen: famSwitchback, cross: false },
  { noun: 'Columns',    gen: famSwitchback, cross: true, blurb: b => b.replace('lanes', 'columns') },
  { noun: 'Snail',      gen: famSnail,      cross: false },
  { noun: 'Pinfield',   gen: famPinfield,   cross: false },
  { noun: 'Chicanes',   gen: famChicanes,   cross: false },
  { noun: 'Islands',    gen: famIslands,    cross: false },
  { noun: 'Ladder',     gen: famChicanes,   cross: true, blurb: b => b.replace('lanes', 'columns') },
];
const ADJ = ['Copper', 'Velvet', 'Granite', 'Harbor', 'Midnight', 'Cobalt', 'Saffron', 'Juniper', 'Ember', 'Glacier', 'Thistle', 'Basalt', 'Marigold', 'Lantern', 'Orchid', 'Quarry', 'Sable', 'Tundra'];
const courseName = i => `${ADJ[Math.floor(i / FAMILIES.length)]} ${FAMILIES[i % FAMILIES.length].noun}`;

// Course i for a world of size W×H. Generated in a landscape frame, then mirrored and
// transposed so it fills the screen whatever its shape.
function makeCourse(i) {
  rnd = mulberry(i * 7919 + 17);
  const fam = FAMILIES[i % FAMILIES.length];
  const long = Math.max(W, H), short = Math.min(W, H), landscape = W >= H;
  const transpose = fam.cross ? landscape : !landscape;
  const fw = fam.cross ? short : long, fh = fam.cross ? long : short;
  const c = fam.gen(frameOf(fw, fh));
  const mx = rnd() < .5, my = rnd() < .5;
  rnd = Math.random;
  const T = (x, y) => { if (mx) x = fw - x; if (my) y = fh - y; return transpose ? [y, x] : [x, y]; };
  const TS = s => { const [a, b] = T(s.x1, s.y1), [d, e] = T(s.x2, s.y2); return seg(a, b, d, e); };
  const TR = z => { const [a, b] = T(z.x, z.y), [d, e] = T(z.x + z.w, z.y + z.h); return { x: Math.min(a, d), y: Math.min(b, e), w: Math.abs(d - a), h: Math.abs(e - b) }; };
  c.walls = c.walls.map(TS); c.deflectors = c.deflectors.map(TS);
  c.bumpers = c.bumpers.map(p => { const [x, y] = T(p.x, p.y); return { ...p, x, y }; });
  c.spinners = c.spinners.map(p => { const [x, y] = T(p.x, p.y); return { ...p, x, y }; });
  c.path = c.path.map(p => T(p[0], p[1]));
  c.start = TR(c.start); c.finish = TR(c.finish);
  c.name = courseName(i); c.index = i;
  if (fam.blurb) c.blurb = fam.blurb(c.blurb);
  buildPath(c);
  return c;
}

function buildPath(c) {
  const pts = c.path.map(p => ({ x: p[0], y: p[1] }));
  c.segs = []; let acc = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    c.segs.push({ a, b, len, start: acc, dx: (b.x - a.x) / len, dy: (b.y - a.y) / len });
    acc += len;
  }
  c.total = acc;
  c.speed = clamp(acc / 10, 300, 480);
  c.cap = Math.max(240, Math.round(acc / c.speed * 20));
}
function pointAt(c, s) {
  s = clamp(s, 0, c.total);
  for (const g of c.segs) if (s <= g.start + g.len) { const t = s - g.start; return { x: g.a.x + g.dx * t, y: g.a.y + g.dy * t }; }
  const g = c.segs[c.segs.length - 1]; return { x: g.b.x, y: g.b.y };
}
function track(c, b) {
  let best = null;
  for (let i = Math.max(0, b.si - 1); i <= Math.min(c.segs.length - 1, b.si + 1); i++) {
    const g = c.segs[i];
    const t = clamp((b.x - g.a.x) * g.dx + (b.y - g.a.y) * g.dy, 0, g.len);
    const d = Math.hypot(b.x - (g.a.x + g.dx * t), b.y - (g.a.y + g.dy * t));
    if (!best || d < best.d - .01) best = { i, t, d };
  }
  b.si = best.i; b.prog = c.segs[best.i].start + best.t;
}

// ---------- race state ----------
let course = null, courseIdx = 0, balls = [], state = 'ready', elapsed = 0, countdown = 0, finishedCount = 0, speedMult = 1;
const wins = Object.fromEntries(RACERS.map(r => [r.id, 0]));

function worldFromBoard() {
  const r = document.getElementById('board').getBoundingClientRect();
  const aspect = clamp((r.width || 16) / (r.height || 9), 1 / 2.6, 2.6);
  if (aspect >= 1) { W = Math.round(SHORT * aspect); H = SHORT; } else { W = SHORT; H = Math.round(SHORT / aspect); }
}
function loadCourse(i) {
  courseIdx = i; worldFromBoard(); course = makeCourse(i); resetRace();
}
function randomCourse() {
  let i; do { i = Math.floor(Math.random() * COURSE_COUNT); } while (i === courseIdx);
  loadCourse(i);
}
function resetRace() {
  SPEED = course.speed; DRIFT = SPEED * 2.8;
  const z = course.start, sp = 24;
  let cols = clamp(Math.floor((z.w - 8) / sp), 1, N), rows = Math.ceil(N / cols);
  while (rows * sp > z.h - 8 && cols < N) { cols++; rows = Math.ceil(N / cols); }
  const slots = [];
  for (let k = 0; k < N; k++) {
    const cx = k % cols, cy = Math.floor(k / cols), inRow = Math.min(cols, N - cy * cols);
    slots.push({ x: z.x + z.w / 2 + (cx - (inRow - 1) / 2) * sp, y: z.y + z.h / 2 + (cy - (rows - 1) / 2) * sp });
  }
  slots.sort(() => Math.random() - .5);
  balls = RACERS.map((r, k) => ({ ...r, x: slots[k].x, y: slots[k].y, vx: 0, vy: 0, si: 0, prog: 0, done: false, time: 0, place: 0, trail: [], tag: 0 }));
  balls.forEach(b => track(course, b));
  elapsed = 0; finishedCount = 0; state = 'ready';
}
function launch() {
  for (const b of balls) { const a = jr(0, Math.PI * 2); b.vx = Math.cos(a) * SPEED; b.vy = Math.sin(a) * SPEED; }
  state = 'running';
}

// ---------- physics ----------
function renorm(b) {
  const s = Math.hypot(b.vx, b.vy);
  if (s < 1) { const a = jr(0, Math.PI * 2); b.vx = Math.cos(a) * SPEED; b.vy = Math.sin(a) * SPEED; }
  else { b.vx *= SPEED / s; b.vy *= SPEED / s; }
}
// Mirror off the surface, then kick the new heading by a random angle (kept pointing away from the surface).
function bounce(b, nx, ny) {
  const d = b.vx * nx + b.vy * ny;
  if (d >= 0) return;
  let rx = b.vx - 2 * d * nx, ry = b.vy - 2 * d * ny;
  for (let k = 0; k < 8; k++) {
    const th = jr(-JITTER, JITTER), co = Math.cos(th), si = Math.sin(th);
    const vx = rx * co - ry * si, vy = rx * si + ry * co;
    if ((vx * nx + vy * ny) / SPEED > .22) { rx = vx; ry = vy; break; }
  }
  b.vx = rx; b.vy = ry; renorm(b);
}
function hitSegment(b, s, thick) {
  const c = closest(b.x, b.y, s), dx = b.x - c.x, dy = b.y - c.y, d = Math.hypot(dx, dy);
  if (d >= R + thick) return;
  let nx, ny;
  if (d > 1e-6) { nx = dx / d; ny = dy / d; }
  else { const sx = s.x2 - s.x1, sy = s.y2 - s.y1, l = Math.hypot(sx, sy) || 1; nx = -sy / l; ny = sx / l; }
  b.x = c.x + nx * (R + thick); b.y = c.y + ny * (R + thick);
  bounce(b, nx, ny);
}
function spinnerSeg(s) { const dx = Math.cos(s.a) * s.len / 2, dy = Math.sin(s.a) * s.len / 2; return seg(s.x - dx, s.y - dy, s.x + dx, s.y + dy); }
function inside(b, z) { return b.x > z.x && b.x < z.x + z.w && b.y > z.y && b.y < z.y + z.h; }

function step(dt) {
  for (const s of course.spinners) s.a += s.w * dt;
  for (const p of course.bumpers) if (p.flash > 0) p.flash = Math.max(0, p.flash - dt * 3);
  const spinSegs = course.spinners.map(spinnerSeg);
  for (const b of balls) {
    if (b.done) continue;
    const la = pointAt(course, b.prog + 70);
    const fx = la.x - b.x, fy = la.y - b.y, fl = Math.hypot(fx, fy) || 1;
    b.vx += fx / fl * DRIFT * dt; b.vy += fy / fl * DRIFT * dt; renorm(b);
    b.x += b.vx * dt; b.y += b.vy * dt;
    for (const w of course.walls) hitSegment(b, w, 3);
    for (const w of course.deflectors) hitSegment(b, w, 3);
    for (const w of spinSegs) hitSegment(b, w, 4);
    for (const p of course.bumpers) {
      const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
      if (d < p.r + R && d > 1e-6) {
        const nx = dx / d, ny = dy / d;
        b.x = p.x + nx * (p.r + R); b.y = p.y + ny * (p.r + R);
        bounce(b, nx, ny); p.flash = 1;
      }
    }
  }
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    const a = balls[i], b = balls[j];
    if (a.done || b.done) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d >= 2 * R || d < 1e-6) continue;
    const nx = dx / d, ny = dy / d, push = (2 * R - d) / 2;
    a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
    const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (rel > 0) {
      a.vx -= rel * nx; a.vy -= rel * ny; b.vx += rel * nx; b.vy += rel * ny;
      for (const o of [a, b]) { const th = jr(-.35, .35), co = Math.cos(th), si = Math.sin(th); const vx = o.vx * co - o.vy * si; o.vy = o.vx * si + o.vy * co; o.vx = vx; renorm(o); }
    }
  }
  elapsed += dt;
  for (const b of balls) {
    if (b.done) continue;
    track(course, b);
    if (inside(b, course.finish)) {
      b.done = true; b.time = elapsed; b.place = ++finishedCount; b.prog = course.total; b.tag = 2.2;
      if (b.place === 1) wins[b.id]++;
    }
  }
  if (finishedCount === N || elapsed >= course.cap) state = 'finished';
}

// ---------- drawing ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let dpr = 1;
function resizeCanvas() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
}
let resizeTimer = 0;
new ResizeObserver(() => {
  resizeCanvas();
  clearTimeout(resizeTimer);
  // Rebuild the course for the new screen shape, but never in the middle of a race.
  resizeTimer = setTimeout(() => { if (state === 'ready' && course) { loadCourse(courseIdx); updateUI(); } }, 150);
}).observe(cv);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const ordinal = n => n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n] || 'th');

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#161a26'; ctx.fillRect(0, 0, cv.width, cv.height);
  const s = Math.min(cv.width / W, cv.height / H);
  ctx.setTransform(s, 0, 0, s, (cv.width - W * s) / 2, (cv.height - H * s) / 2);

  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  for (let x = 15; x < W; x += 30) for (let y = 15; y < H; y += 30) ctx.fillRect(x - 1, y - 1, 2, 2);

  // racing line + chevrons
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
  ctx.beginPath(); course.path.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
  ctx.setLineDash([]); ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  for (let d = 90; d < course.total - 60; d += 130) {
    const p = pointAt(course, d), q = pointAt(course, d + 1), a = Math.atan2(q.y - p.y, q.x - p.x);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(-5, -7); ctx.lineTo(3, 0); ctx.lineTo(-5, 7); ctx.stroke(); ctx.restore();
  }
  ctx.restore();

  const z = course.start;
  ctx.save(); ctx.beginPath(); ctx.rect(z.x, z.y, z.w, z.h); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 6;
  for (let k = -z.h; k < z.w + z.h; k += 16) { ctx.beginPath(); ctx.moveTo(z.x + k, z.y); ctx.lineTo(z.x + k + z.h, z.y + z.h); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = 'rgba(233,236,245,0.45)'; ctx.font = '700 11px "Chakra Petch", sans-serif'; ctx.textBaseline = 'top';
  ctx.fillText('START', z.x + 8, z.y + 6);

  const f = course.finish, sq = 10;
  for (let x = 0; x < f.w; x += sq) for (let y = 0; y < f.h; y += sq) {
    ctx.fillStyle = ((x + y) / sq) % 2 ? 'rgba(14,17,25,0.9)' : 'rgba(240,242,248,0.85)';
    ctx.fillRect(f.x + x, f.y + y, Math.min(sq, f.w - x), Math.min(sq, f.h - y));
  }

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 8;
  ctx.beginPath(); for (const w of course.walls) { ctx.moveTo(w.x1 + 2, w.y1 + 3); ctx.lineTo(w.x2 + 2, w.y2 + 3); } ctx.stroke();
  ctx.strokeStyle = '#d6dbe8'; ctx.lineWidth = 6;
  ctx.beginPath(); for (const w of course.walls) { ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); } ctx.stroke();

  ctx.strokeStyle = '#9aa5cc'; ctx.lineWidth = 6;
  ctx.beginPath(); for (const w of course.deflectors) { ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); } ctx.stroke();

  for (const p of course.bumpers) {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = '#262c42'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#7f89b0'; ctx.stroke();
    if (p.flash > 0) {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 4 * p.flash, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${0.8 * p.flash})`; ctx.lineWidth = 3; ctx.stroke();
    }
  }
  for (const sp of course.spinners) {
    const g = spinnerSeg(sp);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.len / 2, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#eef0f7'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2); ctx.stroke();
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 6, 0, Math.PI * 2); ctx.fillStyle = '#161a26'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#eef0f7'; ctx.stroke();
  }

  if (!reduceMotion) for (const b of balls) {
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i], a = (i + 1) / b.trail.length;
      ctx.globalAlpha = a * 0.28; ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(t.x, t.y, R * (0.4 + 0.5 * a), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  for (const b of balls) {
    ctx.beginPath(); ctx.arc(b.x + 2, b.y + 3, R, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
    const gr = ctx.createRadialGradient(b.x - 4, b.y - 4, 1, b.x, b.y, R);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, b.color); gr.addColorStop(1, b.dark);
    ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.fillStyle = gr; ctx.fill();
    if (b.done) {
      ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      if (b.tag > 0) {
        ctx.globalAlpha = Math.min(1, b.tag);
        const label = ordinal(b.place), ty = b.y - R - 22 - (2.2 - b.tag) * 6;
        ctx.font = '700 13px "Chakra Petch", sans-serif'; const tw = ctx.measureText(label).width + 12;
        ctx.fillStyle = b.color; ctx.fillRect(b.x - tw / 2, ty, tw, 18);
        ctx.fillStyle = '#0e1119'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText(label, b.x, ty + 9.5);
        ctx.textAlign = 'left'; ctx.globalAlpha = 1;
      }
    }
  }

  if (state === 'countdown') {
    ctx.fillStyle = 'rgba(14,17,25,0.45)'; ctx.fillRect(0, 0, W, H);
    const frac = countdown - Math.floor(countdown);
    ctx.font = `700 ${Math.round(110 + 30 * frac)}px "Chakra Petch", sans-serif`;
    ctx.fillStyle = '#f2f4fa'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(Math.ceil(countdown)), W / 2, H / 2); ctx.textAlign = 'left';
  }
  if (state === 'finished') {
    const win = balls.find(b => b.place === 1);
    ctx.fillStyle = 'rgba(14,17,25,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (win) {
      ctx.beginPath(); ctx.arc(W / 2, H / 2 - 70, 26, 0, Math.PI * 2); ctx.fillStyle = win.color; ctx.fill();
      ctx.fillStyle = '#f2f4fa'; ctx.font = `700 ${Math.min(56, W / 10)}px "Chakra Petch", sans-serif`;
      ctx.fillText(`${win.name.toUpperCase()} WINS`, W / 2, H / 2 + 4);
      ctx.font = '500 20px "Chakra Petch", sans-serif'; ctx.fillStyle = 'rgba(233,236,245,0.75)';
      ctx.fillText(`${fmt(win.time)} on ${course.name}`, W / 2, H / 2 + 50);
    } else {
      ctx.fillStyle = '#f2f4fa'; ctx.font = '700 40px "Chakra Petch", sans-serif';
      ctx.fillText('TIME CAP, NO FINISHERS', W / 2, H / 2);
    }
    ctx.textAlign = 'left';
  }
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const goBtn = $('go'), shuffleBtn = $('shuffle'), pick = $('pick'), timerEl = $('timer'), stateEl = $('state'), ranksEl = $('ranks');
function fmt(t) { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(2).padStart(5, '0')}`; }

for (let i = 0; i < COURSE_COUNT; i++) {
  const o = document.createElement('option'); o.value = i; o.textContent = `${i + 1}. ${courseName(i)}`; pick.appendChild(o);
}
const rows = {};
for (const r of RACERS) {
  const li = document.createElement('li'); li.className = 'row'; li.style.setProperty('--c', r.color);
  li.innerHTML = `<span class="pos"></span><span class="chip" title="${r.name}"></span><div class="who"><span class="name">${r.name}</span><div class="bar"><i></i></div></div><div class="stat"><span class="t"></span><span class="gap"></span></div>`;
  ranksEl.appendChild(li);
  rows[r.id] = { li, pos: li.querySelector('.pos'), bar: li.querySelector('.bar i'), t: li.querySelector('.t'), gap: li.querySelector('.gap') };
}
$('tally').innerHTML = RACERS.map(r => `<span style="--c:${r.color}" title="${r.name}"><i></i><b id="w-${r.id}">0</b></span>`).join('');

function standings() {
  return [...balls].sort((a, b) => (a.done && b.done) ? a.place - b.place : a.done ? -1 : b.done ? 1 : b.prog - a.prog);
}
function updateUI() {
  timerEl.textContent = fmt(elapsed);
  const list = standings(), winner = balls.find(b => b.place === 1);
  list.forEach((b, i) => {
    const row = rows[b.id], pct = Math.floor(b.prog / course.total * 100);
    row.li.style.order = i;
    row.li.classList.toggle('done', b.done);
    row.pos.textContent = i + 1;
    row.bar.style.width = `${(b.prog / course.total * 100).toFixed(1)}%`;
    if (b.done) {
      row.t.textContent = fmt(b.time);
      row.gap.textContent = b.place === 1 ? 'Winner' : `+${(b.time - winner.time).toFixed(2)}s`;
    } else if (state === 'ready' || state === 'countdown') {
      row.t.textContent = '—'; row.gap.textContent = 'on the grid';
    } else if (state === 'finished') {
      row.t.textContent = 'DNF'; row.gap.textContent = `${pct}% done`;
    } else {
      row.t.textContent = `${pct}%`; row.gap.textContent = 'racing';
    }
  });
  for (const r of RACERS) $('w-' + r.id).textContent = wins[r.id];
}
function setControls() {
  goBtn.textContent = { ready: 'Start', countdown: 'Stop', running: 'Stop', finished: 'New race' }[state];
  const busy = state === 'countdown' || state === 'running';
  shuffleBtn.disabled = busy; pick.disabled = busy;
  pick.value = String(courseIdx);
  $('blurb').textContent = course.blurb;
  stateEl.textContent = {
    ready: 'On the grid. Press Start.',
    countdown: 'Lights…',
    running: `${finishedCount} of ${N} across the line`,
    finished: finishedCount === N ? 'Race complete.' : `Time cap reached. ${finishedCount} of ${N} finished.`,
  }[state];
}

goBtn.addEventListener('click', () => {
  if (state === 'ready') { state = 'countdown'; countdown = 3; }
  else if (state === 'countdown' || state === 'running') resetRace();
  else randomCourse();
  setControls(); updateUI();
});
shuffleBtn.addEventListener('click', () => { if (state === 'ready' || state === 'finished') { randomCourse(); setControls(); updateUI(); } });
pick.addEventListener('change', () => { if (state === 'ready' || state === 'finished') { loadCourse(+pick.value); setControls(); updateUI(); } });
document.querySelectorAll('.speed button').forEach(btn => btn.addEventListener('click', () => {
  speedMult = +btn.dataset.speed;
  document.querySelectorAll('.speed button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
}));
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLSelectElement)) { e.preventDefault(); goBtn.click(); }
});

// ---------- loop ----------
let last = performance.now(), uiTimer = 0;
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'countdown') {
    countdown -= real;
    if (countdown <= 0) { launch(); setControls(); }
  }
  if (state === 'running') {
    const dt = real * speedMult, n = Math.max(1, Math.ceil(SPEED * dt / 3));
    const before = finishedCount;
    for (let i = 0; i < n && state === 'running'; i++) step(dt / n);
    for (const b of balls) {
      if (!b.done) { b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 14) b.trail.shift(); }
      else if (b.trail.length) b.trail.shift();
    }
    if (finishedCount !== before || state !== 'running') setControls();
  } else {
    for (const p of course.bumpers) if (p.flash > 0) p.flash = Math.max(0, p.flash - real * 3);
  }
  for (const b of balls) if (b.tag > 0) b.tag = Math.max(0, b.tag - real);
  uiTimer -= real;
  if (uiTimer <= 0 || state !== 'running') { updateUI(); uiTimer = 0.08; }
  if (cv.width) draw();
  requestAnimationFrame(frame);
}

resizeCanvas();
loadCourse(Math.floor(Math.random() * COURSE_COUNT));
setControls(); updateUI();
requestAnimationFrame(frame);
</script>
