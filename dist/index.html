  const D2 = (R.dialog = {});
  D2.line = function (kind, h) {
    const arr = L[kind] || ['...'];
    let s = pick(arr);
    const fam = G() && G().player && G().player.family;
    if (kind === 'rivalSpot') s = s.replace('Vane', fam || 'Vane');
    return s;
  };

  // ---------------------------------------------------------------- ambient chatter
  const CHAT = {
    any: ['You catch the game last night?', "Rent's up again.", 'This heat, huh?', 'Have you seen my cat?', 'They say the bank never sleeps.', 'Lotta new faces in town.', 'Gas is 60 cents a gallon now. Criminal.', 'My cousin knows a guy.', 'You still dating that drummer?', 'Heard the Castellanos and the Vanes are feuding again.'],
    rain: ['Raining cats and dogs.', 'Forgot my umbrella, as usual.', 'Good for the crops, bad for my hair.'],
    night: ['Streets ain\'t safe after dark.', "Club Neon's jumping tonight.", 'Walk me home?'],
    reply: ['Tell me about it.', 'You don\'t say.', 'Mm-hmm.', 'No kidding.', 'Ain\'t that the truth.', 'Get outta here!', 'Same old, same old.', 'Far out.'],
  };
  D2.chatter = function (h, o) {
    const g = G();
    if (h.person && o.person && h.person.spouse === o.person.id) return pick(['Honey, did you lock the door?', 'Love you, baby.', 'We\'re late for dinner at your mother\'s.']);
    if (h.person && o.person && R.rng() < 0.4) return `${o.person.first}! ${pick(['How\'s the family?', 'Long time no see.', 'You owe me five bucks.', 'Looking sharp.'])}`;
    if (h.person && R.rng() < 0.35) return g.pop.lifeFact(h.person);
    if (g.env.weather.rain > 0.4 && R.rng() < 0.5) return pick(CHAT.rain);
    if (g.clock.isNight() && R.rng() < 0.4) return pick(CHAT.night);
    const news = g.pop.news.find((n) => n.city === (h.person ? h.person.city : '') && g.pop.day - n.day < 2);
    if (news && R.rng() < 0.4) return `Did you hear? ${news.text}`;
    if (g.player.rep.infamy > 30 && R.rng() < 0.2) return pick(['That mook in the fedora? Word is he\'s trouble.', 'Folks say there\'s a new heavy in town.']);
    return pick(CHAT.any);
  };
  D2.chatterReply = function () { return pick(CHAT.reply); };

  // things people say as the player walks by
  D2.passing = function (h, pl) {
    const g = G();
    if (h.cop) return pick(g.law.totalBounty() > 0 ? ['Keep moving.', "I'm watching you."] : ['Evening.', 'Stay out of trouble.', 'Move along.']);
    if (pl.masked) return pick(['Nice mask. Real subtle.', 'What\'s with the ski mask?', "I'm not looking at you."]);
    if (pl.bloody > 0.3) return pick(['Is that... blood?', 'Rough night, mister?', "You're bleeding on my sidewalk."]);
    if (pl.drunk > 0.4) return pick(['Somebody\'s had a few.', 'Walk it off, pal.', 'Smells like a distillery.']);
    if (h.person && h.person.met) {
      const op = h.person.opinion;
      if (op > 40) return pick([`Hey, ${pl.nick}!`, 'Look who it is!', `Lookin' sharp, ${pl.nick}.`]);
      if (op < -30) return pick(['Oh. You.', 'Keep walking.', "Don't talk to me."]);
    }
    if (pl.rep.infamy > 60) return pick(["That's him. Don't make eye contact.", 'Sir.', 'Good evening, sir. Sir.']);
    if (pl.outfit === 'tux') return pick(['Wedding or funeral?', 'Nice tux, Travolta.']);
    if (pl.outfit === 'leisure') return pick(['Groovy threads.', 'Is that polyester?']);
    return pick(['Nice suit.', 'Hey.', 'Watch it.', 'Scuse me.', 'Evening.', 'Nice hat.', 'You lost?', 'Afternoon.']);
  };

  // ---------------------------------------------------------------- greet / antagonize
  const PGREET = ['How ya doin\'?', 'Evenin\'.', 'Nice day, huh?', 'Hey there.', 'How\'s it going, friend?', 'Looking good.'];
  const PANTAG = ['What are you lookin\' at?', 'Nice shoes. Your mother pick \'em?', 'You got a problem?', 'Get outta my way.', 'You smell like a fish market.', 'Hey, stupid.', 'You got some nerve standing there.'];
  const PDEFUSE = ['Relax, I\'m just messin\' with ya.', 'Hey, no hard feelings.', 'Easy, easy. We\'re good.'];

  const RESP = {
    warm: ['Well if it ain\'t my favorite fella!', 'Hey you! Good to see ya.', 'Always a pleasure.', 'There he is!'],
    nice: ['Doing alright, thanks.', 'Can\'t complain.', 'Evening to you too.', 'Hey yourself.', 'Nice hat, by the way.'],
    shy: ['Oh! Uh, hi.', 'H-hello.', '...hi.'],
    cold: ['Do I know you?', 'Mm.', 'Sure, whatever.', 'Not interested.', 'Keep walking.'],
    scared: ['P-please, I don\'t want trouble.', 'Yes sir. Hello sir.', 'Whatever you say, mister.'],
    flirt: ['Well hello, handsome.', 'Nice suit. Buy a girl a drink sometime?', 'Aren\'t you a tall glass of trouble.'],
    grumpy: ['What do you want?', 'Yeah, yeah.', 'Don\'t block the sidewalk.'],
    cop: ['Citizen.', 'Keep your nose clean.', 'Evening. Everything alright?'],
    kid: ['Hi mister!', 'Is that a real fedora?', 'My dad says don\'t talk to strangers.'],
    family: ['Hey, it\'s the new guy. Don Vane says hello.', 'Look sharp, kid.', 'You working today?'],
  };
  const ANTRESP = {
    cower: ['I-I\'m sorry! I\'ll move!', 'Please, I don\'t want no trouble!', 'Here, take my wallet, just leave me alone!'],
    retort: ['Nice suit. Did the circus let you keep it?', 'At least my face ain\'t a crime.', 'Go bother somebody your own size.', 'Wow. Did you think of that yourself?', 'Take a hike, fedora.'],
    laugh: ['Ha! You\'re a riot.', 'Whatever you say, sunshine.', 'Aww, somebody needs a hug.'],
    squareUp: ['You wanna go? Let\'s go!', 'Say that again. I dare you.', 'Put \'em up!', 'Big mistake, pal.'],
    cop: ['Keep walking, wise guy.', 'You want a night in the tank?', 'Say that again. Slower.'],
    copArrest: ['That\'s it. Hands behind your back.', 'Disorderly conduct. You\'re coming with me.'],
    kid: ['I\'m telling my mom!', 'Meanie!', 'Waaah!'],
    walkOff: ['Unbelievable.', 'I don\'t have time for this.', 'Ugh. Men.'],
  };

  D2.mood = function (h) {
    const g = G(), pl = g.player;
    const p = h.person;
    let m = (p ? p.opinion : 0) + h.tr.warm * 30 - 10;
    const city = g.world.cityAt((h.x / TS) | 0, (h.y / TS) | 0);
    if (city) m += (pl.standing[city.id] || 0) * 0.3;
    if (pl.masked) m -= 40;
    if (pl.weaponOut) m -= 45;
    if (pl.bloody > 0.3) m -= 25;
    if (h.anger) m -= h.anger;
    m += pl.outfitScore();
    return m;
  };
  D2.fear = function (h) {
    const g = G(), pl = g.player;
    let f = (h.person ? h.person.fear : 0) + pl.rep.infamy * 0.4 + (pl.weaponOut ? 50 : 0) + (pl.masked ? 20 : 0) - h.tr.brave * 60;
    if (h.cop) f -= 80;
    return f;
  };

  // player greets h. Returns true if handled
  D2.greet = function (h) {
    const g = G(), pl = g.player, p = h.person;
    g.actors.say(pl, pick(PGREET));
    h.state = 'talk';
    h.timer = 5;
    const mood = this.mood(h), fear = this.fear(h);
    const spam = h.greeted > 1;
    h.greeted++;
    let resp;
    if (h.look.kid) resp = pick(RESP.kid);
    else if (h.cop) resp = pick(RESP.cop);
    else if (fear > 40) resp = pick(RESP.scared);
    else if (h.faction && h.faction === pl.family) resp = pick(RESP.family).replace('Vane', g.jobs.donName(pl.family));
    else if (spam) resp = pick(['Yeah, you said that already.', 'Hello again...', 'You\'re a friendly one, huh?']);
    else if (mood > 35) resp = h.arch === 'flirt' && h.look.fem !== pl.look.fem ? pick(RESP.flirt) : pick(RESP.warm);
    else if (mood > 5) resp = h.arch === 'timid' ? pick(RESP.shy) : h.arch === 'flirt' ? pick(RESP.flirt) : pick(RESP.nice);
    else if (h.arch === 'grumpy') resp = pick(RESP.grumpy);
    else resp = pick(RESP.cold);
    setTimeout(() => {
      if (h.dead || h.removed) return;
      g.actors.say(h, resp);
      // chatty people add something
      if (p && !spam && mood > 0 && R.rng() < h.tr.chatty * 0.7) setTimeout(() => !h.dead && g.actors.say(h, R.rng() < 0.5 ? g.pop.lifeFact(p) : D2.rumor(h)), 1800);
      else if (!p && !spam && mood > 10 && R.rng() < 0.25) setTimeout(() => !h.dead && g.actors.say(h, D2.rumor(h)), 1800);
    }, 700);
    if (p && !spam) {
      if (p.lastGreet !== g.pop.day) { p.opinion = Math.min(100, p.opinion + (mood > 0 ? 4 : 1)); p.lastGreet = g.pop.day; }
      p.fam = Math.min(10, p.fam + 1);
      if (p.fam >= 2 && !p.met) {
        p.met = true;
        setTimeout(() => g.ui.toast(`You know ${g.pop.name(p)} now: ${g.pop.title(p)}${p.work ? ' at ' + g.world.buildings[p.work].name : ''}.`, 'good'), 1500);
      }
    } else if (!p && !h.strangerName && mood > 15 && R.rng() < 0.5) {
      h.strangerName = `${pick(h.look.fem ? D.firstF : D.firstM)} (stranger)`;
    }
    if (!spam) pl.rep.honor = Math.min(100, pl.rep.honor + 0.2);
    h.greetMood = mood;
    return true;
  };

  D2.antagonize = function (h) {
    const g = G(), pl = g.player, p = h.person;
    g.actors.say(pl, pick(PANTAG));
    h.anger = (h.anger || 0) + 25;
    h.antag = (h.antag || 0) + 1;
    const fear = this.fear(h);
    let resp, after = null;
    if (h.look.kid) { resp = pick(ANTRESP.kid); after = () => g.actors.setFlee(h, pl, 6); }
    else if (h.cop) {
      if (h.antag >= 2) { resp = pick(ANTRESP.copArrest); after = () => g.law.startIncident({ type: 'harass', def: { name: 'Disorderly Conduct' }, x: pl.x, y: pl.y, jur: g.law.jurAt(pl.x, pl.y), identified: !pl.masked, lvl: 1, bounty: 5 }, h); }
      else resp = pick(ANTRESP.cop);
    } else if (fear > 35 || h.tr.brave < 0.25) {
      resp = pick(ANTRESP.cower);
      h.intimidated = true;
      if (h.antag >= 2) after = () => g.actors.setFlee(h, pl, 8);
      else { h.state = 'cower'; h.timer = 6; }
    } else if (h.tr.brave > 0.65 || (h.antag >= 2 && h.tr.brave > 0.4) || h.anger > 60) {
      resp = pick(ANTRESP.squareUp);
      after = () => {
        h.brawl = true; // mutual fight: not a crime while fists stay fists
        h.hostile = true;
        g.actors.setFight(h, pl);
        if (h.armed && h.tr.brave > 0.85 && h.weapon !== 'rifle') { h.drawn = true; g.ui.toast(`${g.actors.displayName(h)} pulled a ${D.weapons[h.weapon].name}! Self-defence is fair game.`, 'warn'); }
        else if (h.armed) { h.drawn = false; h.brawlFists = true; h.armedBackup = h.weapon; h.weapon = 'fists'; }
        g.actors.noise(h.x, h.y, TS * 8, 'fight', h);
      };
    } else if (h.arch === 'flirt' || h.arch === 'eccentric') resp = pick(ANTRESP.laugh);
    else if (h.antag >= 2) { resp = pick(ANTRESP.walkOff); after = () => g.actors.setFlee(h, pl, 4); }
    else resp = pick(ANTRESP.retort);
    h.state = h.state === 'cower' ? 'cower' : 'talk';
    h.timer = h.timer || 5;
    setTimeout(() => {
      if (h.dead || h.removed) return;
      g.actors.say(h, resp);
      if (after) after();
    }, 700);
    if (p) {
      p.opinion = Math.max(-100, p.opinion - 8);
      p.fear = Math.min(100, p.fear + 10);
      if (h.antag === 1) g.pop.remember(p, 'antag', `Some wise guy in a fedora mouthed off at me.`, g.pop.day);
    }
    pl.rep.infamy = Math.min(100, pl.rep.infamy + 0.3);
    return true;
  };
  D2.defuse = function (h) {
    const g = G(), pl = g.player;
    g.actors.say(pl, pick(PDEFUSE));
    const ok = R.rng() < 0.75 - (h.anger || 0) / 250 + h.tr.warm * 0.3;
    setTimeout(() => {
      if (h.dead || h.removed) return;
      if (ok) {
        h.anger = 0;
        h.hostile = false;
        h.brawl = false;
        if (h.brawlFists) { h.weapon = h.armedBackup; h.brawlFists = false; }
        h.state = 'idle';
        h.timer = 2;
        g.actors.say(h, pick(['Yeah, alright. Watch yourself.', 'Hmph. Fine.', 'You\'re lucky I\'m in a good mood.', 'Whatever, pal.']));
      } else g.actors.say(h, pick(['Too late for that!', 'Nah, you started this.']));
    }, 600);
  };

  // rumours and leads generated from world state
  D2.rumor = function (h) {
    const g = G();
    const leads = g.jobs.makeLead(h);
    if (leads) return leads;
    return pick(['Nothing new under the sun.', 'I keep my head down, mister.', 'Ask the bartender. They hear everything.']);
  };

  // ---------------------------------------------------------------- talk tree
  // Returns { title, sub, lines:[], options:[{label, fn, close}] }
  D2.tree = function (h) {
    const g = G(), pl = g.player, p = h.person;
    const name = g.actors.displayName(h);
    const opts = [];
    const lines = [];
    const mood = this.mood(h);
    const close = () => g.ui.closeTalk();
    const say = (s) => g.ui.talkLine(s);
    const role = h.role;
    // witnesses can be paid off
    if (h.witness && !h.witness.done && !h.witness.silenced) {
      const price = 15 + (h.witness.crime.bounty || 10);
      opts.push({ label: `"Here's ${R.fmtMoney(price)}. You didn't see nothin'."`, fn: () => {
        if (pl.cash < price) return say("That ain't enough to make me forget.");
        pl.cash -= price;
        const ok = R.rng() < 0.65 + h.tr.greed * 0.4 - h.tr.lawful * 0.35;
        if (ok) { h.witness.silenced = true; h.alert = null; h.state = 'idle'; say('...What crime? I was looking at pigeons.'); }
        else { say("Keep your blood money. I'm calling the cops."); h.state = 'report'; }
      } });
      opts.push({ label: '"Talk and you\'re next."', fn: () => {
        const ok = R.rng() < 0.35 + D2.fear(h) / 100;
        if (ok) { h.witness.silenced = true; h.alert = null; h.state = 'cower'; h.timer = 6; say('O-okay! I saw nothing! Nothing!'); if (p) p.fear = 90; }
        else { say('You don\'t scare me!'); close(); g.actors.startReport(h); }
      } });
    }
    const job = g.jobs.active;
    if (p && job && job.person === p.id && (job.kind === 'collect' || job.kind === 'scare')) {
      if (job.kind === 'collect' && p.debt > 0) opts.push({ label: `"Don ${g.jobs.donName(job.family)} wants his ${R.fmtMoney(p.debt)}."`, cls: 'go', fn: () => {
        const f = D2.fear(h) + (h.intimidated ? 30 : 0) + (p.fear || 0) * 0.5;
        if (f > 25 || R.rng() < 0.25) { const amt = p.debt; p.debt = 0; say(`Okay, okay! Here's the ${R.fmtMoney(amt)}. Tell him I'm sorry!`); p.fear = Math.min(100, p.fear + 20); }
        else if (h.tr.brave > 0.6) { say("I ain't paying nothing. Come and take it."); close(); h.hostile = true; h.brawl = true; g.actors.setFight(h, pl); }
        else { say("I don't have it! Give me a week!"); h.intimidated = false; p.fear += 10; }
      } });
      if (job.kind === 'scare') opts.push({ label: '"Keep talking to the cops and see what happens."', cls: 'go', fn: () => { p.fear = Math.min(100, p.fear + 35 + (pl.weaponOut ? 25 : 0)); say(p.fear >= 70 ? "I... I won't say another word. I swear on my mother." : 'You think I scare that easy?'); } });
    }
    if (p) {
      lines.push(`${g.pop.title(p)}, age ${p.age}${p.work ? ' · ' + g.world.buildings[p.work].name : ''}`);
      opts.push({ label: '"How\'s life treating you?"', fn: () => say(g.pop.lifeFact(p)) });
      if (p.fam >= 2 || h.tr.chatty > 0.7) opts.push({ label: '"Heard anything worth knowing?"', fn: () => say(D2.rumor(h)) });
      if (p.spouse >= 0 || p.kids.length) opts.push({ label: '"How\'s the family?"', fn: () => {
        const fam = g.pop.family(p).filter(([r]) => r !== 'parent');
        if (!fam.length) return say('It\'s just me these days.');
        const [rel, q] = pick(fam);
        say(q.alive ? `${q.first}? ${rel === 'kid' ? `${q.age} years old${q.age >= 18 ? ', works as a ' + (D.roleNames[q.role] || 'something').toLowerCase() : ''}.` : ''} ${pick(['Keeps me young.', 'Drives me crazy.', 'Best thing that ever happened to me.'])}` : `${q.first} passed. Don't want to talk about it.`);
      } });
    } else lines.push(h.cop ? 'Police officer' : h.look.kid ? 'A neighborhood kid' : 'A stranger');
    // role services
    if (role === 'bartender') {
      opts.push({ label: 'Order a whiskey ($3)', fn: () => { if (pl.pay(3)) { pl.drink(); say(pick(['Here ya go.', 'On the rocks.', 'Easy does it, champ.'])); } else say('Cash first.'); } });
      opts.push({ label: 'Buy the room a round ($25)', fn: () => { if (pl.pay(25)) { g.jobs.roundForHouse(h); say('Drinks are on the fella in the fedora!'); } else say('With what money?'); } });
    }
    if (role === 'fence') opts.push({ label: 'Move some merchandise', fn: () => { close(); g.ui.openShop('pawn', h); } });
    if (role === 'doctor' || role === 'nurse') opts.push({ label: 'Patch me up ($20)', fn: () => { if (pl.hp >= pl.maxHp) return say('You look fine to me.'); if (pl.pay(20)) { pl.hp = pl.maxHp; pl.bloody = 0; say('Good as new. Try ducking next time.'); } else say('Hospitals cost money, sweetie.'); } });
    if (role === 'priest') opts.push({ label: 'Confess your sins ($40 donation)', fn: () => { if (pl.pay(40)) { pl.rep.infamy = Math.max(0, pl.rep.infamy - 8); pl.rep.honor = Math.min(100, pl.rep.honor + 5); say('Say ten Hail Marys and stop hitting people.'); } else say('The Lord accepts IOUs. The church does not.'); } });
    if (role === 'mechanic') opts.push({ label: 'Fix my ride', fn: () => { close(); g.ui.openShop('garage', h); } });
    if (role === 'cop' || role === 'detective') {
      const jur = g.law.jurAt(h.x, h.y);
      const b = g.law.bounty[jur] || 0;
      if (b > 0) opts.push({ label: `Pay my bounty (${R.fmtMoney(b)})`, fn: () => { if (g.law.payBounty(jur)) say('Paid in full. Now scram.'); else say("You don't have that kind of cash."); } });
      opts.push({ label: '"Anything I should know, officer?"', fn: () => say(pick([`We're looking for somebody who ${g.law.log[0] ? 'did a ' + g.law.log[0].def.name.toLowerCase() : 'keeps making trouble'}. Seen anything?`, 'Quiet shift. Keep it that way.', `The ${g.jobs.cityFamily(h) || 'mob'} thinks they run this town. They don't.`])) });
      if (pl.cash >= 100 && D2.mood(h) > -20) opts.push({ label: 'Slip him $100 to look the other way', fn: () => {
        if (h.tr.lawful > 0.8) { say('Are you trying to bribe an officer? Beat it before I change my mind.'); if (p) p.opinion -= 20; return; }
        pl.cash -= 100; g.law.bounty[jur] = Math.max(0, (g.law.bounty[jur] || 0) - 80); say('Pleasure doing business. I never saw you.'); if (p) { p.opinion += 10; p.bribed = true; }
      } });
    }
    if (role === 'don' || role === 'capo') opts.push({ label: '"Got any work for me?"', fn: () => { close(); g.jobs.openBoard(h); } });
    if ((role === 'clerk' || role === 'cook' || role === 'barber' || role === 'tailor') && p && p.work) {
      const b = g.world.buildings[p.work];
      if (b && !b.racket && g.jobs.rank() >= 1) opts.push({ label: `"Nice place. Be a shame if something happened to it."`, fn: () => {
        const ok = R.rng() < 0.3 + D2.fear(h) / 100 + g.jobs.rank() * 0.1;
        if (ok) { b.racket = 1; b.racketFamily = pl.family; say(`A-alright. ${R.fmtMoney(20 + b.w * 5)} a week. Just... leave us be.`); g.ui.toast(`${b.name} now pays protection: collect weekly at the door.`, 'good'); if (p) { p.fear += 30; p.opinion -= 20; } g.jobs.progress('racket', b); }
        else { say('I pay the ' + (g.jobs.cityFamily(h) || 'cops') + ' already. Get lost before I call them.'); if (p) p.opinion -= 10; }
      } });
    }
    if (h.look.kid) opts.push({ label: 'Give the kid a buck', fn: () => { if (pl.pay(1)) { say(pick(['Gee, thanks mister!', 'Wow! I\'m gonna buy a comic!', 'My mom says you\'re a hoodlum. I like you.'])); pl.rep.honor += 1; if (p) p.opinion += 10; } } });
    // romance: the old game's sweetheart, now earned through greetings
    if (p && h.arch === 'flirt' && h.look.fem !== pl.look.fem && !h.look.kid && p.age >= 21) {
      if (pl.sweetheart === p.id) {
        opts.push({ label: 'Ask your sweetheart a favor', fn: () => {
          if (pl.favorDay === g.pop.day) return say('I already helped you today, sugar. Don\'t push it.');
          pl.favorDay = g.pop.day;
          if (g.law.active() && g.law.incident.state !== 'pursuit') { g.law.clearIncident(true); say('I told the cops you were with me all night. You owe me dinner.'); }
          else { const c = R.rng.int(20, 60); pl.addCash(c); say(`Here's ${R.fmtMoney(c)}. Pay me back in dancing.`); }
        } });
      } else if (p.opinion > 30 && p.fam >= 3) {
        opts.push({ label: '"Let me take you dancing sometime."', fn: () => {
          if (R.rng() < 0.4 + p.opinion / 150) { pl.sweetheart = p.id; p.opinion = Math.min(100, p.opinion + 20); say('Pick me up at eight. Don\'t be late, and wear the good suit.'); g.ui.toast(`${g.pop.name(p)} is your sweetheart now.`, 'good'); }
          else say('Ha! Maybe. Buy me a drink first, big shot.');
        } });
      }
    }
    // intimidated people can be robbed
    if (!h.cop && (h.intimidated || h.state === 'cower' || h.state === 'surrender' || (pl.weaponOut && D2.fear(h) > 20))) {
      opts.push({ label: 'Rob them', fn: () => { close(); pl.rob(h); } });
    }
    if (!h.cop && !h.look.kid && g.jobs.rank() >= 2 && h.tr.brave > 0.55 && p && p.opinion > 40 && !h.crew && pl.crew.length < 2 && p.role !== 'don') {
      opts.push({ label: '"Want to make some real money? Ride with me."', fn: () => {
        if (R.rng() < 0.5 + p.opinion / 200) { g.player.recruit(h); say(pick(['I\'m in. Just say the word.', 'About time somebody asked.'])); }
        else say('I got a family, pal. Can\'t risk it.');
      } });
    }
    if (h.crew) opts.push({ label: 'Part ways', fn: () => { pl.dismiss(h); say('Call me if you need me.'); } });
    opts.push({ label: 'Goodbye', fn: close, close: true });
    return { title: name, sub: lines.join(' '), options: opts, mood };
  };
})();

// ---- 12_jobs.js
// RHAPSODY — the families, your rank, procedural contracts, rackets and leads.
'use strict';
(function () {
  const D = R.data, T = D.T, TS = R.TILE;
  const RANKS = ['Associate', 'Soldier', 'Capo', 'Underboss', 'Consigliere', 'Boss'];
  const RANK_REP = [0, 80, 240, 520, 950, 1600];

  const Jobs = (R.Jobs = function (game) {
    this.game = game;
    this.standing = {}; // family -> -100..100
    this.rep = 0; // with own family
    this.offers = {}; // family -> [job]
    this.offerDay = {};
    this.active = null;
    this.leads = [];
    this.done = 0;
    for (const c of D.cities) this.standing[c.family] = 0;
    this.nid = 1;
  });
  const J = Jobs.prototype;
  J.RANKS = RANKS;

  J.rank = function () {
    let r = 0;
    for (let i = 0; i < RANK_REP.length; i++) if (this.rep >= RANK_REP[i]) r = i;
    return r;
  };
  J.rankName = function () { return RANKS[this.rank()]; };
  J.nextRankRep = function () { return RANK_REP[Math.min(RANK_REP.length - 1, this.rank() + 1)]; };
  J.familyStanding = function (f) { return f === this.game.player.family ? Math.max(40, this.standing[f] || 0) : this.standing[f] || 0; };
  J.donName = function (f) {
    const c = D.cities.find((c) => c.family === f);
    return c ? c.don.replace(/ ".*?"/, '').split(' ').pop() : f;
  };
  J.cityFamily = function (h) {
    const c = this.game.world.cityAt((h.x / TS) | 0, (h.y / TS) | 0);
    return c ? c.def.family : null;
  };
  J.cityOfFamily = function (f) {
    const d = D.cities.find((c) => c.family === f);
    return d ? this.game.world.cities.find((c) => c.id === d.id) : null;
  };
  J.addRep = function (n, family) {
    const pl = this.game.player;
    if (!family || family === pl.family) {
      const before = this.rank();
      this.rep += n;
      this.standing[pl.family] = R.clamp((this.standing[pl.family] || 0) + n / 10, -100, 100);
      const after = this.rank();
      if (after > before) this.promote(after);
    } else {
      this.standing[family] = R.clamp((this.standing[family] || 0) + n / 5, -100, 100);
      // freelancing for a rival costs a little at home
      this.standing[pl.family] = R.clamp((this.standing[pl.family] || 0) - n / 20, -100, 100);
    }
  };
  J.promote = function (r) {
    const g = this.game;
    const perks = [
      '',
      'Soldiers can shake down shops for protection money.',
      'Capos can recruit a crew of two from people who like them.',
      'Underbosses collect a weekly tribute from the family.',
      'The Consigliere\'s word clears bounties: the family pays half your fines.',
      'You run the family now. Every racket in town pays you.',
    ];
    g.ui.story('MADE', `Don ${this.donName(g.player.family)} kisses both your cheeks. You are now a ${RANKS[r]} of the ${g.player.family} family.\n\n${perks[r]}`);
    g.audio.sfx('promote');
  };

  // ---------------------------------------------------------------- contracts
  J.offersFor = function (family) {
    const g = this.game;
    if (this.offerDay[family] === g.pop.day && this.offers[family]) return this.offers[family];
    const rnd = R.mulberry(g.pop.day * 131 + R.strHash(family));
    const city = this.cityOfFamily(family);
    const list = [];
    const kinds = ['collect', 'collect', 'hit', 'deliver', 'steal', 'torch', 'rob', 'racket', 'scare'];
    rnd.shuffle(kinds);
    for (const k of kinds) {
      if (list.length >= 3) break;
      const j = this.makeJob(k, family, city, rnd);
      if (j) list.push(j);
    }
    this.offers[family] = list;
    this.offerDay[family] = g.pop.day;
    return list;
  };
  J.makeJob = function (kind, family, city, rnd) {
    const g = this.game, pop = g.pop, w = g.world;
    const scale = 1 + this.rank() * 0.35;
    const people = (pop.byCity[city.id] || []).filter((p) => p.alive && p.age >= 18 && !p.isDon && p.role !== 'cop' && !p.jailed);
    const rivals = D.cities.filter((c) => c.family !== family).map((c) => c.family);
    const j = { id: this.nid++, kind, family, city: city.id, stage: 0, reward: 0, rep: 0 };
    if (kind === 'collect' || kind === 'scare') {
      const p = rnd.pick(people.filter((q) => q.role !== 'capo' && q.role !== 'soldier'));
      if (!p) return null;
      j.person = p.id;
      j.amount = Math.round((kind === 'collect' ? rnd.int(60, 180) : 0) * scale);
      j.reward = kind === 'collect' ? Math.round(j.amount * 0.35) + 20 : Math.round(rnd.int(40, 80) * scale);
      j.rep = kind === 'collect' ? 30 : 25;
      j.title = kind === 'collect' ? `Collect from ${pop.name(p)}` : `Lean on ${pop.name(p)}`;
      j.desc = kind === 'collect'
        ? `${p.first} borrowed ${R.fmtMoney(j.amount)} and stopped returning calls. ${pop.title(p)}${p.work ? ' at ' + w.buildings[p.work].name : ''}. Get the money. Break something if you have to, but the dead don't pay.`
        : `${p.first} has been talking to the cops. Make them understand that talking is bad for their health. Antagonize them until they're scared stiff. Don't kill them.`;
      return j;
    }
    if (kind === 'hit') {
      const tg = rnd.pick(people.filter((q) => (q.faction && q.faction !== family) || q.role === 'hustler' || q.role === 'fence' || rnd() < 0.05));
      if (!tg) return null;
      j.person = tg.id;
      j.reward = Math.round(rnd.int(180, 320) * scale);
      j.rep = 70;
      j.title = `Whack ${pop.name(tg)}`;
      j.desc = `${tg.first} ${tg.last}, ${pop.title(tg).toLowerCase()}. ${rnd.pick(['A rat.', 'Skimming from the family.', 'Disrespected the Don at a wedding.', 'Knows too much.'])} Quietly, if you can. A mask helps.`;
      return j;
    }
    if (kind === 'deliver') {
      const dest = rnd.pick(w.cities.filter((c) => c.id !== city.id));
      const dclub = dest.buildings.find((b) => b.type === 'social') || dest.buildings[0];
      const src = rnd.pick(city.buildings.filter((b) => b.type === 'warehouse' || b.type === 'garage' || b.type === 'social'));
      if (!dclub || !src) return null;
      j.src = src.id;
      j.dest = dclub.id;
      j.reward = Math.round((80 + R.dist(src.x, src.y, dclub.x, dclub.y) * 0.5) * scale);
      j.rep = 35;
      j.minutes = Math.round(R.dist(src.x, src.y, dclub.x, dclub.y) * 0.18 + 12);
      j.title = `Run a van to ${dest.name}`;
      j.desc = `There's a Mystic Van behind ${src.name}. What's in the back is none of your business. Get it to ${dclub.name} in ${dest.name} within ${j.minutes} minutes, in one piece, without a tail.`;
      return j;
    }
    if (kind === 'steal') {
      const models = ['muscle', 'coupe', 'wagon', 'van'];
      j.model = rnd.pick(models);
      const garage = city.buildings.find((b) => b.type === 'garage');
      const tcity = rnd.pick(w.cities);
      const lotB = rnd.pick(tcity.buildings.filter((b) => !b.destroyed && b.type !== 'police'));
      if (!garage || !lotB) return null;
      j.dest = garage.id;
      j.at = lotB.id;
      j.reward = Math.round(D.vehicles[j.model].price * 0.25 * scale);
      j.rep = 30;
      j.title = `Boost a ${D.vehicles[j.model].name}`;
      j.desc = `A client wants a ${D.vehicles[j.model].name}. One's parked near ${lotB.name} in ${tcity.name}. Bring it to ${garage.name} with the paint unscratched. Break in when nobody's looking.`;
      return j;
    }
    if (kind === 'torch') {
      const rc = w.cities.filter((c) => c.def.family !== family);
      const tcity = rnd.pick(rc);
      const b = rnd.pick(tcity.buildings.filter((b) => !b.destroyed && ['bar', 'club', 'diner', 'laundry', 'general', 'liquor', 'warehouse'].includes(b.type)));
      if (!b) return null;
      j.building = b.id;
      j.reward = Math.round(rnd.int(200, 350) * scale);
      j.rep = 60;
      j.title = `Torch ${b.name}`;
      j.desc = `${b.name} in ${tcity.name} pays the ${tcity.def.family}s. Burn it. Gas cans are at any gas station; molotovs at the gun store. Arson draws a crowd, so leave fast.`;
      return j;
    }
    if (kind === 'rob') {
      const tcity = rnd.pick(w.cities.filter((c) => c.def.family !== family));
      const b = rnd.pick(tcity.buildings.filter((b) => !b.destroyed && D.btypes[b.type].rob));
      if (!b) return null;
      j.building = b.id;
      j.reward = Math.round(rnd.int(60, 120) * scale);
      j.rep = 40;
      j.title = `Knock over ${b.name}`;
      j.desc = `${b.name} in ${tcity.name}. The ${tcity.def.family}s call it theirs. Walk in, gun out, empty the register. Keep what's in the till plus our fee.`;
      return j;
    }
    if (kind === 'racket') {
      j.need = 2;
      j.count = 0;
      j.reward = Math.round(120 * scale);
      j.rep = 50;
      j.title = 'Sign up two new "clients"';
      j.desc = `Visit shopkeepers in ${city.name} and explain the benefits of protection. Talk to a clerk, cook, barber or tailor. Needs Soldier rank.`;
      if (this.rank() < 1) return null;
      return j;
    }
    return null;
  };

  J.accept = function (j) {
    const g = this.game, pop = g.pop, w = g.world;
    if (this.active) this.abandon(true);
    this.active = j;
    j.stage = 1;
    j.started = g.clock.t;
    if (j.person !== undefined) {
      const p = pop.people[j.person];
      // they'll be hanging around outside their workplace or home
      const b = w.buildings[p.work] || w.buildings[p.home];
      if (b) {
        const spot = { x: b.out.x, y: b.out.y, city: b.city, kind: 'job', i: w.spots.length };
        w.spots.push(spot);
        p.forceSpot = spot;
      }
      g.life.cache.delete(p.id);
      if (j.kind === 'collect') p.debt = j.amount;
    }
    if (j.kind === 'deliver') {
      const src = w.buildings[j.src];
      const v = this.spawnCarNear(src, 'van');
      if (v) { v.jobCar = j.id; v.keep = true; v.locked = false; j.car = v; }
    }
    if (j.kind === 'steal') {
      j.spawned = false;
    }
    g.ui.toast(`Job accepted: ${j.title}`, 'good');
    g.audio.sfx('accept');
  };
  J.spawnCarNear = function (b, model) {
    const g = this.game, w = g.world;
    const s = w.findNear(b.out.x, b.out.y, 1, 6, (x, y) => { const t = w.t(x, y); return (t === T.PARKING || t === T.LOT || t === T.WALK || D.roadTile[t]) && !w.solidCar(x, y) && !w.solidCar(x + 1, y) && !w.solidCar(x - 1, y); });
    if (!s) return null;
    return g.traffic.make(model, s.x * TS + 8, s.y * TS + 8, 0, { parked: true, keep: true, locked: false });
  };
  J.abandon = function (quiet) {
    const g = this.game;
    const j = this.active;
    if (!j) return;
    if (j.person !== undefined) { const p = g.pop.people[j.person]; p.forceSpot = null; g.life.cache.delete(p.id); }
    if (j.car && !j.car.removed) j.car.keep = false;
    this.active = null;
    if (!quiet) { g.ui.toast('Job abandoned. The family noticed.', 'warn'); this.standing[j.family] = (this.standing[j.family] || 0) - 3; }
  };
  J.complete = function (j, extra) {
    const g = this.game, pl = g.player;
    const pay = j.reward + (extra || 0);
    pl.addCash(pay);
    this.addRep(j.rep, j.family);
    this.done++;
    pl.stats.jobs++;
    if (j.person !== undefined) { const p = g.pop.people[j.person]; p.forceSpot = null; p.debt = 0; g.life.cache.delete(p.id); }
    if (j.car && !j.car.removed) { j.car.keep = false; }
    this.active = null;
    g.ui.story('JOB DONE', `${j.title}.\n\n+${R.fmtMoney(pay)}  ·  +${j.rep} respect with the ${j.family}s.`);
    g.audio.sfx('cash');
  };
  J.fail = function (j, why) {
    const g = this.game;
    if (j.person !== undefined) { const p = g.pop.people[j.person]; p.forceSpot = null; g.life.cache.delete(p.id); }
    this.active = null;
    this.standing[j.family] = (this.standing[j.family] || 0) - 5;
    g.ui.story('JOB FAILED', `${j.title}.\n\n${why}`);
  };
  J.progress = function (kind, data) {
    const j = this.active;
    if (!j) return;
    if (kind === 'racket' && j.kind === 'racket') {
      j.count++;
      if (j.count >= j.need) this.complete(j);
      else this.game.ui.toast(`Protection deals: ${j.count}/${j.need}`);
    }
    if (kind === 'robbed' && j.kind === 'rob' && data.id === j.building) this.complete(j);
  };

  // marker for the map / compass
  J.marker = function () {
    const g = this.game, j = this.active;
    if (!j) return null;
    const w = g.world;
    if (j.person !== undefined) {
      const p = g.pop.people[j.person];
      if (p.actor && !p.actor.dead) return { x: p.actor.x, y: p.actor.y, label: g.pop.short(p) };
      const k = g.life.desiredKey(p);
      const pos = g.life.posOf(k);
      if (pos) return { x: pos.x * TS + 8, y: pos.y * TS + 8, label: g.pop.short(p) };
    }
    if (j.kind === 'deliver') {
      if (j.stage === 1 && j.car) return { x: j.car.x, y: j.car.y, label: 'Van' };
      const b = w.buildings[j.dest];
      return { x: b.out.x * TS + 8, y: b.out.y * TS + 8, label: b.name };
    }
    if (j.kind === 'steal') {
      if (j.stage === 1) { const b = w.buildings[j.at]; if (j.car && !j.car.removed) return { x: j.car.x, y: j.car.y, label: 'Target car' }; return { x: b.out.x * TS + 8, y: b.out.y * TS + 8, label: b.name }; }
      const b = w.buildings[j.dest];
      return { x: b.out.x * TS + 8, y: b.out.y * TS + 8, label: b.name };
    }
    if (j.building) { const b = w.buildings[j.building]; return { x: b.out.x * TS + 8, y: b.out.y * TS + 8, label: b.name }; }
    return null;
  };

  J.update = function (dt) {
    const g = this.game, j = this.active, pl = g.player, w = g.world;
    if (!j) return;
    if (j.person !== undefined) {
      const p = g.pop.people[j.person];
      if (j.kind === 'hit' && !p.alive) return this.complete(j);
      if ((j.kind === 'collect' || j.kind === 'scare') && !p.alive) return this.fail(j, 'The target is dead. The dead don\'t pay, and they don\'t learn lessons.');
      if (j.kind === 'collect' && p.debt <= 0) return this.complete(j);
      if (j.kind === 'scare' && p.fear >= 70) return this.complete(j);
      if (j.kind === 'collect' && p.actor && (p.actor.down > 0 || p.actor.state === 'surrender') && !j.beaten) {
        j.beaten = true;
        g.ui.toast('They\'re down. Search them (USE) to take what they owe.');
      }
    }
    if (j.kind === 'deliver') {
      const v = j.car;
      if (!v || v.removed || v.wrecked) return this.fail(j, 'The van is gone. So is the merchandise.');
      if (j.stage === 1 && pl.inCar === v) { j.stage = 2; j.t0 = g.clock.t; g.ui.toast(`Drive to ${w.buildings[j.dest].name}. ${j.minutes} minutes.`, 'warn'); }
      if (j.stage === 2) {
        j.left = j.minutes - (g.clock.t - j.t0);
        const b = w.buildings[j.dest];
        if (pl.inCar === v && R.dist(v.x, v.y, b.out.x * TS, b.out.y * TS) < TS * 5 && Math.abs(v.speed) < 20) {
          if (g.law.active()) { if (!j.warnTail) { j.warnTail = true; g.ui.toast('Lose the cops before you pull in.', 'warn'); } }
          else { const bonus = Math.round(j.reward * (v.hp / v.maxHp - 0.5)); g.player.exitCar(); v.keep = false; v.locked = true; setTimeout(() => g.traffic.remove(v), 3000); return this.complete(j, Math.max(0, bonus)); }
        }
        if (j.left <= 0) return this.fail(j, 'Too slow. The buyer walked.');
      }
    }
    if (j.kind === 'steal') {
      if (j.stage === 1 && !j.car) {
        const b = w.buildings[j.at];
        if (R.dist(pl.x, pl.y, b.out.x * TS, b.out.y * TS) < TS * 30) {
          const v = this.spawnCarNear(b, j.model);
          if (v) { v.locked = true; v.jobCar = j.id; j.car = v; v.owned = 'npc'; }
        }
      }
      if (j.car && pl.inCar === j.car && j.stage === 1) { j.stage = 2; g.ui.toast(`Deliver the ${D.vehicles[j.model].name} to ${w.buildings[j.dest].name}.`); }
      if (j.car && (j.car.removed || j.car.wrecked)) return this.fail(j, 'The car is scrap. The client wanted it pristine.');
      if (j.stage === 2) {
        const b = w.buildings[j.dest];
        if (pl.inCar === j.car && R.dist(j.car.x, j.car.y, b.out.x * TS, b.out.y * TS) < TS * 5 && !g.law.active()) {
          g.player.exitCar();
          const v = j.car;
          setTimeout(() => g.traffic.remove(v), 2500);
          return this.complete(j, Math.round(j.reward * (v.hp / v.maxHp - 0.6)));
        }
      }
    }
    if (j.kind === 'torch') {
      const b = w.buildings[j.building];
      if (b.destroyed || b.burning) return this.complete(j);
    }
  };

  // weekly tribute + racket income accumulate daily
  J.daily = function () {
    const g = this.game;
    for (const b of g.world.buildings) {
      if (!b || !b.racket || b.destroyed) continue;
      b.racketDue = (b.racketDue || 0) + Math.round((20 + b.w * 5) / 7 * (b.city.prosperity / 60 + 0.4));
    }
    if (this.rank() >= 3) {
      const t = 40 * this.rank();
      g.player.addCash(t);
      g.ui.toast(`Family tribute: +${R.fmtMoney(t)}`, 'good');
    }
    // standings drift towards neutral
    for (const f in this.standing) this.standing[f] *= 0.98;
    this.leads = this.leads.filter((l) => g.pop.day - l.day < 2);
  };

  J.roundForHouse = function (h) {
    const g = this.game;
    const b = g.world.buildingAt(((h.x / TS) | 0), ((h.y / TS) | 0) - 1) || g.ui.insideB;
    const c = g.world.cityAt((g.player.x / TS) | 0, (g.player.y / TS) | 0) || (b && b.city);
    if (c && c.id) g.player.standing[c.id] = Math.min(100, (g.player.standing[c.id] || 0) + 4);
    const pats = b ? g.life.occupants(b) : [];
    for (const p of pats) p.opinion = Math.min(100, p.opinion + 6);
    g.player.rep.honor += 1;
    g.player.cool = Math.min(100, g.player.cool + 20);
  };

  // ---------------------------------------------------------------- leads (rumours that mark opportunities)
  J.makeLead = function (h) {
    const g = this.game, w = g.world, pop = g.pop;
    const city = w.cityAt((h.x / TS) | 0, (h.y / TS) | 0) || (h.person && pop.cityObj(h.person.city));
    if (!city || !city.buildings) return null;
    const rnd = R.rng;
    const kind = rnd.weighted([['stash', 2], ['rich', 1.3], ['poker', 1], ['hunt', 0.7], ['racketHint', 0.6]]);
    if (kind === 'stash') {
      const houses = city.buildings.filter((b) => (b.type === 'house' || b.type === 'cabin') && !b.destroyed && b.residents.length);
      if (!houses.length) return null;
      const b = rnd.pick(houses);
      const owner = pop.people[b.residents[0]];
      b.stash = rnd.int(80, 260);
      this.addLead({ kind, x: b.out.x, y: b.out.y, text: `Stash at ${owner ? owner.last : 'a'} house`, b: b.id });
      return `Word is old ${owner ? owner.first + ' ' + owner.last : 'somebody'} keeps a coffee can full of cash at home. Doesn't trust banks. Marked it on your map.`;
    }
    if (kind === 'rich') {
      const rich = (pop.byCity[city.id] || []).filter((p) => p.alive && p.age > 30 && (p.role === 'teller' || p.role === 'doctor' || p.role === 'dealer' || p.wealth > 60));
      if (!rich.length) return null;
      const p = rnd.pick(rich);
      p.wealth += 200;
      p.fat = true;

    h.loot = [];
    g.actors.say(h, R.rng.pick(['Take it! Just take it!', 'That\'s my rent money...', 'You\'ll get yours, mister.']));
    g.law.crime('mugging', h.x, h.y, { victim: h });
    h.robbed = true;
    this.stats.robbed++;
    if (h.person) {
      h.person.opinion = Math.max(-100, h.person.opinion - 30);
      h.person.fear = Math.min(100, h.person.fear + 25);
      g.pop.remember(h.person, 'robbed', 'I got robbed in broad daylight by a guy in a fedora.', g.pop.day);
      this.collectDebt(h.person, cash);
    }
    g.ui.toast(`Robbed ${R.fmtMoney(cash)}${lootNames.length ? ' + ' + lootNames.join(', ') : ''}.`);
    g.actors.setFlee(h, this, 8);
  };
  P.collectDebt = function (p, amount) {
    const g = this.game;
    const j = g.jobs.active;
    if (!j || j.kind !== 'collect' || j.person !== p.id || p.debt <= 0) return;
    const paid = Math.min(p.debt, Math.max(amount, p.debt)); // they cough up the rest to stop the beating
    p.debt = 0;
    g.ui.toast(`${p.first} paid the ${R.fmtMoney(paid)} they owed the family.`, 'good');
  };
  P.loot = function (h) {
    const g = this.game;
    h.looted = true;
    let cash = h.cash;
    if (h.stolen) cash += 0; // pickpocket's haul is already in cash
    this.addCash(cash);
    h.cash = 0;
    for (const l of h.loot) this.inv.loot[l] = (this.inv.loot[l] || 0) + 1;
    const n = h.loot.length;
    h.loot = [];
    // ammo off armed bodies
    if (h.armed && D.weapons[h.weapon] && D.weapons[h.weapon].gun) {
      const am = D.weapons[h.weapon].ammo;
      const got = R.rng.int(2, 6);
      this.inv.ammo[am] = (this.inv.ammo[am] || 0) + got;
      if (!this.inv.weapons[h.weapon] && R.rng() < 0.5) { this.giveWeapon(h.weapon); g.ui.toast(`Picked up a ${D.weapons[h.weapon].name}.`, 'good'); }
    }
    if (h.person) this.collectDebt(h.person, cash);
    g.ui.toast(`Found ${R.fmtMoney(cash)}${n ? ` and ${n} item${n > 1 ? 's' : ''}` : ''}.`);
    if (!h.dead && h.down > 0 && !h.hostile) g.law.crime('theft', h.x, h.y, { victim: null, minor: false });
    g.audio.sfx('loot');
  };
  P.skin = function (a) {
    const g = this.game;
    a.skinned = true;
    const pelt = a.def.pelt;
    this.inv.loot[pelt] = (this.inv.loot[pelt] || 0) + 1;
    if (pelt !== 'meat') this.inv.loot.meat = (this.inv.loot.meat || 0) + (a.def.size > 8 ? 2 : 1);
    g.fx.blood(a.x, a.y, 6);
    g.ui.toast(`Skinned: ${D.loot[pelt].name}. Sell it at a Butcher & Trapper.`, 'good');
    g.audio.sfx('loot');
  };

  // ---------------------------------------------------------------- vehicles
  P.enterCar = function (v) {
    const g = this.game;
    if (v.wrecked) return;
    this.inCar = v;
    v.driver = this;
    v.parked = false;
    v.mode = 'player';
    v.keep = true;
    this.weaponOut = false;
    g.audio.sfx('door');
    if (v.owner !== 'player' && !v.stolen) {
      v.stolen = true;
      this.stats.carsStolen = (this.stats.carsStolen || 0) + 1;
    }
    // crew hop in
    v.passengers = v.passengers || [];
    for (const c of this.crew) if (!c.dead && R.dist(c.x, c.y, v.x, v.y) < TS * 5) { c.inCar = v; v.passengers.push(c); }
    g.audio.radio(v.radio);
    R.bus.emit('player:car', v);
  };
  P.exitCar = function () {
    const g = this.game;
    const v = this.inCar;
    if (!v) return;
    if (Math.abs(v.speed) > 70) {
      // bail out at speed
      this.hurt(15, null, 'fall');
    }
    g.traffic.exitVehicle(v, this);
    v.driver = null;
    v.mode = 'chase';
    v.keep = v.owner === 'player';
    this.inCar = null;
    for (const c of v.passengers || []) { if (c.crew) { g.traffic.exitVehicle(v, c); c.state = 'follow'; } }
    v.passengers = (v.passengers || []).filter((p) => !p.crew);
    g.audio.radio(null);
    g.audio.sfx('door');
  };
  P.carjack = function (v) {
    const g = this.game;
    const d = v.driver;
    g.traffic.exitVehicle(v, d);
    d.hp -= 10;
    d.down = 1.5;
    g.actors.say(d, R.rng.pick(['Hey! That\'s my car!', 'Help! Carjacker!', 'Not again!']));
    for (const p of v.passengers || []) { g.traffic.exitVehicle(v, p); g.actors.setFlee(p, this, 8); }
    v.passengers = [];
    setTimeout(() => { if (!d.dead) { if (d.tr.brave > 0.75 || d.cop) g.actors.setFight(d, this); else g.actors.setFlee(d, this, 8); } }, 1500);
    g.law.crime(d.cop ? 'copAssault' : 'carjack', v.x, v.y, { victim: d });
    this.enterCar(v);
  };
  P.breakIn = function (v) {
    const g = this.game;
    g.audio.sfx('glass', v.x, v.y);
    g.fx.shatter(v.x, v.y);
    v.locked = false;
    g.actors.noise(v.x, v.y, TS * 6, 'scream', this);
    g.law.crime('cartheft', v.x, v.y, {});
    if (v.jobCar) {} // part of a job
    if (R.rng() < 0.3 && g.clock.isNight() === false) g.ui.toast('Car alarm!', 'warn'), g.audio.sfx('alarm');
    this.enterCar(v);
  };
  P.updateCar = function (dt) {
    const g = this.game, inp = g.input, v = this.inCar;
    this.x = v.x; this.y = v.y;
    this.focus = null;
    if (inp.pressed('use')) this.use();
    if (inp.pressed('radio')) g.audio.nextStation(v);
    if (inp.pressed('attack')) {
      // drive-by: fire sideways at nearest target
      const w = D.weapons[this.weapon];
      const best = g.actors.near(v.x, v.y, 150, (a) => !a.dead && !a.inCar && (a.kind === 'a' || a.hostile || a.cop))[0];
      if (w && w.gun && best) {
        const ang = Math.atan2(best.y - v.y, best.x - v.x);
        if ((this.clip[this.weapon] || 0) > 0 && this.atkT <= 0) { this.clip[this.weapon]--; this.atkT = w.rate; R.combat.shoot(this, w, ang, best); }
        else this.reload();
      }
    }
    this.atkT -= dt;
    if (inp.pressed('weapon')) this.cycleWeapon();
    // hitchhiker drop-off
    for (const p of v.passengers || []) {
      if (p.tag === 'hitch' && p.hitchDest) {
        const c = p.hitchDest;
        if (R.dist(v.x / TS, v.y / TS, c.cx, c.cy) < c.nbx * 7 && Math.abs(v.speed) < 20) {
          v.passengers = v.passengers.filter((q) => q !== p);
          g.traffic.exitVehicle(v, p);
          p.tag = 'ambient';
          p.keep = false;
          const tip = R.rng.int(25, 60);
          this.addCash(tip);
          g.actors.say(p, `Thanks for the lift! Here's ${R.fmtMoney(tip)}. Stay groovy.`);
          this.rep.honor += 2;
        }
      }
    }
  };
  P.pickUp = function (h) {
    const v = this.inCar;
    h.inCar = v;
    v.passengers = v.passengers || [];
    v.passengers.push(h);
    this.game.actors.say(h, `Bless you! ${h.hitchDest.name}, please.`);
  };

  // ---------------------------------------------------------------- health
  P.hurt = function (amt, src, kind) {
    const g = this.game;
    if (this.dead || (g.cheats && g.cheats.god)) return;
    if (this.inside) return;
    if (this.inCar && kind !== 'blast' && kind !== 'fire' && kind !== 'bullet' && kind !== 'fall') return;
    this.hp -= amt;
    this.bloody = Math.min(1, this.bloody + amt / 60);
    g.ui.hurtFlash(amt);
    g.fx.blood(this.x, this.y - 8, 3);
    if (src && src.kind === 'h' && src !== this) {
      // being attacked makes the attacker hostile: self-defence is legal
      src.hostile = true;
    }
    if (this.hp <= 0) this.die();
  };
  P.knock = function (ang, force) {
    this.knockV = { x: Math.cos(ang) * force, y: Math.sin(ang) * force };
  };
  P.die = function () {
    const g = this.game;
    this.dead = true;
    this.hp = 0;
    this.stats.deaths++;
    if (this.inCar) this.exitCar();
    if (this.coolOn) this.setCool(false);
    g.ui.death();
  };
  P.respawn = function () {
    const g = this.game, w = g.world;
    // nearest hospital
    let best = null, bd = 1e9;
    for (const b of w.buildings) {
      if (!b || b.type !== 'hospital' || b.destroyed) continue;
      const d = R.dist(b.out.x * TS, b.out.y * TS, this.x, this.y);
      if (d < bd) { bd = d; best = b; }
    }
    g.law.clearIncident(true);
    const fee = Math.min(this.cash, Math.max(20, Math.round(this.cash * 0.1)));
    this.cash -= fee;
    this.hp = this.maxHp;
    this.dead = false;
    this.bloody = 0;
    this.drunk = 0;
    this.weaponOut = false;
    this.knockV = null;
    for (const a of g.actors.list) if (a.hostile && a.state === 'fight') { a.state = 'idle'; a.target = null; a.hostile = false; }
    if (best) this.place(best.out.x * TS + 8, best.out.y * TS + 12);
    g.clock.skip(6 * 60);
    g.ui.toast(`You wake up at ${best ? best.name : 'the hospital'}. The bill: ${R.fmtMoney(fee)}.`);
  };
  P.useConsumable = function () {
    const g = this.game;
    const order = this.hp < this.maxHp * 0.7 ? ['bandage', 'tonic', 'sandwich', 'whiskey', 'smokes', 'coffee'] : ['smokes', 'whiskey', 'tonic', 'bandage', 'sandwich', 'coffee'];
    for (const id of order) {
      if (!this.inv.cons[id]) continue;
      this.inv.cons[id]--;
      const c = D.consumables[id];
      if (c.heal) this.hp = Math.min(this.maxHp, this.hp + c.heal);
      if (c.cool) this.cool = Math.min(100, this.cool + c.cool);
      if (c.drunk) this.drunk = Math.min(1, this.drunk + c.drunk);
      if (c.sober) this.drunk = 0;
      g.ui.toast(`Used ${c.name}.`);
      g.audio.sfx('drink');
      return;
    }
    g.ui.toast('Nothing to use. Stores sell bandages, smokes and whiskey.', 'warn');
  };
  P.drink = function () {
    this.drunk = Math.min(1, this.drunk + 0.25);
    this.cool = Math.min(100, this.cool + 30);
    this.hp = Math.min(this.maxHp, this.hp + 5);
  };

  // ---------------------------------------------------------------- gasoline
  P.pour = function (dt) {
    const g = this.game;
    this.pourT = (this.pourT || 0) - dt;
    if (this.pourT > 0) return;
    this.pourT = 0.12;
    if ((this.gasLeft || 0) <= 0) {
      if (!this.inv.tools.gascan) return;
      this.inv.tools.gascan--;
      this.gasLeft = 30;
    }
    if (g.env.pourGas(this.x, this.y + 2)) {
      this.gasLeft--;
      g.fx.add({ x: this.x + Math.cos(this.ang) * 6, y: this.y - 2, vx: 0, vy: 20, life: 0.2, max: 0.2, c: '#6a5a30', s: 2 });
    }
    if (this.gasLeft <= 0 && !this.inv.tools.gascan) { g.ui.toast('Gas can empty. Stand on the trail and press USE to light it.'); this.weapon = 'fists'; }
  };

  // ---------------------------------------------------------------- crew
  P.recruit = function (h) {
    h.crew = true;
    h.tag = 'crew';
    h.keep = true;
    h.hostile = false;
    h.state = 'follow';
    h.timer = 1e9;
    this.crew.push(h);
    if (!h.armed) this.game.actors.arm(h, 'revolver');
    this.game.ui.toast(`${this.game.actors.displayName(h)} joined your crew.`, 'good');
  };
  P.dismiss = function (h) {
    h.crew = false;
    h.tag = 'named';
    h.keep = false;
    h.state = 'idle';
    this.crew = this.crew.filter((c) => c !== h);
  };
  P.crewUpdate = function (dt) {
    const g = this.game;
    this.crew = this.crew.filter((c) => !c.dead && !c.removed);
    for (const c of this.crew) {
      if (c.inCar) continue;
      if (c.state === 'fight' && c.target && !c.target.dead && c.target !== this) continue;
      // defend the boss
      const threat = g.actors.near(this.x, this.y, TS * 10, (a) => a.kind === 'h' && !a.dead && a.hostile && a.state === 'fight' && !a.crew)[0];
      if (threat) { c.state = 'fight'; c.target = threat; c.drawn = true; continue; }
      if (c.state !== 'follow') { c.state = 'follow'; c.timer = 1e9; }
    }
  };
})();

    dumbbell: { name: 'Dumbbell', dmg: 3, reach: 8, kb: 140, dur: 99, heavy: 1, throw: 0.8, swing: 260, mat: 'thud', fx: 'stun', where: ['house'] },

    cake: { name: 'Whole Cake', dmg: 0, reach: 9, kb: 50, dur: 1, throw: 1.1, swing: 200, mat: 'squish', fx: 'cake', where: ['diner', 'store'] },
  });

  // what each building type keeps lying around
  const ROOM_TAGS = {
    bar: 'bar', club: 'bar', casino: 'bar', diner: 'diner', house: 'house', apartment: 'house', cabin: 'house', hotel: 'house', motel: 'house',
    garage: 'garage', general: 'store', liquor: 'store', pharmacy: 'store', pawn: 'store', laundry: 'store', tailor: 'store', barber: 'store', butcher: 'diner',
    church: 'chapel', hospital: 'clinic', police: 'police', warehouse: 'harbor', factory: 'garage', barn: 'lot', social: 'bar', arcade: 'store', gas: 'garage',
  };
  // street furniture you can rip out of the ground
  const FROM_OBJ = { [O.TRASH]: 'trashcan', [O.BENCH]: 'bench', [O.HYDRANT]: 'hydrant', [O.CONE]: 'cone', [O.BARREL]: 'barrel', [O.CRATE]: 'crate', [O.MAILBOX]: 'mailbox', [O.SIGNPOST]: 'sign' };
  const HIT_WORD = { wood: 'CRACK!', metal: 'CLANG!', pan: 'BONK!', glass: 'SMASH!', soft: 'FWUMP!', twang: 'TWANNG!', squish: 'SPLAT!', thud: 'THUD!', boing: 'BOING!', splash: 'SPLOOSH!', hiss: 'FSSSH!' };
  const MAT_SFX = { wood: 'thud', metal: 'bump', pan: 'bump', glass: 'glass', soft: 'punch', twang: 'bump', squish: 'punch', thud: 'thud', boing: 'bump', splash: 'splash', hiss: 'splash' };

  const sprites = {};
  const sprite = (k) => sprites[k] || (sprites[k] = R.old.props[k] ? R.old.paintProp(k) : null);

  const Props = (R.props = {
    loose: [],
    flying: [],
    game: null,
    streetT: 0,
  });

  Props.init = function (game) {
    this.game = game;
    this.loose = [];
    this.flying = [];
    this.roomsDone = new Set();
  };

  Props.drop = function (k, x, y, dur) {
    const d = PROPS[k];
    if (!d) return null;
    const p = { k, x, y, dur: dur == null ? d.dur : dur, t: 0 };
    this.loose.push(p);
    return p;
  };

  // clutter a room the first time it's entered this session
  Props.furnishRoom = function (room) {
    const b = room.b;
    if (this.roomsDone.has(b.id)) return;
    this.roomsDone.add(b.id);
    const tag = ROOM_TAGS[b.type];
    if (!tag || !room.extra.length) return;
    const pool = Object.keys(PROPS).filter((k) => PROPS[k].where.includes(tag));
    if (!pool.length) return;
    const rnd = R.mulberry(b.seedArt + 17);
    const n = 1 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const s = room.extra[Math.floor(rnd() * room.extra.length)];
      this.drop(pool[Math.floor(rnd() * pool.length)], s.x * TS + 4 + rnd() * 8, s.y * TS + 8 + rnd() * 4);
    }
  };

  // keep a little junk lying around the streets near the player
  Props.update = function (dt) {
    const g = this.game, pl = g.player, w = g.world;
    for (const p of this.loose) p.t += dt;
    // flying things
    for (let i = this.flying.length - 1; i >= 0; i--) {
      const f = this.flying[i];
      f.t += dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;

    if (beat === 8 && bar % 2) this.tone('square', NOTE(62), NOTE(63), s16 * 6, 0.04, out, t, 0.05);
  };
})();

// ---- 15_input.js
// RHAPSODY — input: floating touch joystick + touch buttons (mobile first),
// keyboard for desktop. Actions are polled per frame via held()/pressed().
'use strict';
(function () {
  const KEYS = {
    KeyE: 'use', Enter: 'use', Space: 'attack', KeyF: 'attack', KeyQ: 'weapon', ShiftLeft: 'run', ShiftRight: 'run',
    KeyC: 'sneak', KeyM: 'mask', KeyR: 'radio', KeyG: 'greet', KeyT: 'talk', KeyX: 'defuse', KeyV: 'antag', KeyH: 'horn',
    KeyZ: 'cool', KeyB: 'brake', KeyI: 'heal', KeyP: 'phone', Escape: 'menu', Tab: 'map', KeyN: 'map',
  };
  const MOVE = { KeyW: [0, -1], ArrowUp: [0, -1], KeyS: [0, 1], ArrowDown: [0, 1], KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0] };

  const Input = (R.Input = function (game, root) {
    this.game = game;
    this.stick = { x: 0, y: 0 };
    this.keysDown = new Set();
    this.heldA = {};
    this.pressedA = {};
    this.longA = {};
    this.downAt = {};
    this.touchStick = null;
    this.root = root;
    this.bind();
  });
  const P = Input.prototype;

  P.bind = function () {
    const self = this;
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (this.game.ui && this.game.ui.modalOpen() && e.code !== 'Escape') {
        if (e.code === 'Escape' || e.code === 'Tab') e.preventDefault();
        return;
      }
      if (KEYS[e.code] || MOVE[e.code]) e.preventDefault();
      if (e.repeat) return;
      this.keysDown.add(e.code);
      const a = KEYS[e.code];
      if (a) this.down(a);
      // car: space brakes, H horns
      if (this.game.player && this.game.player.inCar) {
        if (e.code === 'Space') this.down('brake');
        if (e.code === 'KeyE') {} // exit handled by use
      }
    });
    window.addEventListener('keyup', (e) => {
      this.keysDown.delete(e.code);
      const a = KEYS[e.code];
      if (a) this.up(a);
      if (e.code === 'Space') this.up('brake');
    });
    window.addEventListener('blur', () => { this.keysDown.clear(); this.heldA = {}; this.stick.x = this.stick.y = 0; this.touchStick = null; this.drawStick(); });

    // fixed joystick (like the original): touch anywhere in the left pad
    const zone = this.root.querySelector('#stickzone');
    const base = this.root.querySelector('#stickbase');
    const knob = this.root.querySelector('#stickknob');
    this.base = base;
    this.knob = knob;
    zone.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (this.touchStick) return;
      this.game.audio.unlock();
      zone.setPointerCapture(e.pointerId);
      const r = base.getBoundingClientRect();
      this.touchStick = { id: e.pointerId, ox: r.left + r.width / 2, oy: r.top + r.height / 2, r: r.width * 0.36, x: e.clientX, y: e.clientY };
      this.drawStick();
    });
    zone.addEventListener('pointermove', (e) => {
      const t = this.touchStick;
      if (!t || t.id !== e.pointerId) return;
      t.x = e.clientX; t.y = e.clientY;
      this.drawStick();
    });
    const end = (e) => {
      const t = this.touchStick;
      if (!t || t.id !== e.pointerId) return;
      this.touchStick = null;
      this.drawStick();
    };
    zone.addEventListener('pointerup', end);
    zone.addEventListener('pointercancel', end);

    // on-screen buttons (data-k="action")
    this.root.querySelectorAll('[data-k]').forEach((btn) => {
      const a = btn.dataset.k;
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        this.game.audio.unlock();
        btn.setPointerCapture(e.pointerId);
        btn.classList.add('on');
        const act = this.game.player && this.game.player.inCar && btn.dataset.car ? btn.dataset.car : a;
        btn._act = act;
        this.down(act);
        if (navigator.vibrate) try { navigator.vibrate(8); } catch (err) {}
      });
      const up = (e) => {
        btn.classList.remove('on');
        if (btn._act) this.up(btn._act);
        btn._act = null;
      };
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointercancel', up);
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
    });
  };
  P.down = function (a) {
    if (!this.heldA[a]) {
      this.pressedA[a] = true;
      this.downAt[a] = performance.now();
    }
    this.heldA[a] = true;
    if (a === 'menu') this.game.ui.toggleMenu();
    if (a === 'map') this.game.ui.openMenu('map');
    if (a === 'phone') this.game.ui.openPhone();
  };
  P.up = function (a) {
    const held = performance.now() - (this.downAt[a] || 0);
    this.heldA[a] = false;
    if (held > 450) this.longA[a] = true;
  };
  P.held = function (a) { return !!this.heldA[a]; };
  P.pressed = function (a) { return !!this.pressedA[a]; };
  P.longPressed = function (a) { return !!this.longA[a]; };
  P.endFrame = function () {
    this.pressedA = {};
    this.longA = {};
  };
  P.drawStick = function () {
    const t = this.touchStick;
    if (!t) { this.knob.style.transform = ''; return; }
    let dx = t.x - t.ox, dy = t.y - t.oy;
    const d = Math.hypot(dx, dy);
    if (d > t.r) { dx = (dx / d) * t.r; dy = (dy / d) * t.r; }
    this.knob.style.transform = `translate(${dx}px, ${dy}px)`;
  };
  P.update = function () {
    let x = 0, y = 0;
    for (const k of this.keysDown) if (MOVE[k]) { x += MOVE[k][0]; y += MOVE[k][1]; }
    const d = Math.hypot(x, y);
    if (d > 0) { x /= d; y /= d; }
    const t = this.touchStick;
    if (t) {
      const max = t.r;
      let dx = (t.x - t.ox) / max, dy = (t.y - t.oy) / max;
      const m = Math.hypot(dx, dy);
      if (m > 1) { dx /= m; dy /= m; }
      if (m > 0.12) { x = dx; y = dy; }
      // pushing the stick all the way = run (mobile)
      if (m > 1.25 && !this.game.player.inCar) this.heldA.runStick = true;
      else this.heldA.runStick = false;
    } else this.heldA.runStick = false;
    this.stick.x = x;
    this.stick.y = y;
  };
})();

// ---- 16_ui.js
// RHAPSODY — UI: HUD, context chips (Greet / Antagonize / Talk), sheets for talk,

    this.bannerS = null;
    this.hurtT = 0;

  // ---------------------------------------------------------------- the in-screen HUD (canvas, pixel text)

  const A = () => R.art;

  U.drawHud = function (g) {
    const game = this.game, pl = game.player, W = 480, H = 320;

      for (let y = 0; y < H; y += 2) for (let x = (y / 2) % 2 ? 1 : 0; x < W; x += 2) if (x < 24 || x > W - 24 || y < 16 || y > H - 16) g.fillRect(x, y, 1, 1);
    }

    const ammo = held ? (held.dur >= 99 ? 'UNBREAKABLE' : 'USES ' + pl.held.dur) : pl.weapon === 'gascan' ? `x${pl.inv.tools.gascan || 0}` : ww && ww.gun ? `${pl.clip[pl.weapon] || 0}/${pl.inv.ammo[ww.ammo] || 0}` : ww && ww.thrown ? `x${pl.inv.ammo[pl.weapon] || 0}` : 'SWAP';
    const bw = Math.max(A().ptWidth(wn, 2), A().ptWidth(ammo)) + 14;
    hbox(g, W - 6 - bw, 6, bw, 34, true);
    pt(g, wn, W - 13, 10, { align: 'right', scale: 2, color: '#3a2418' });

    g.fillStyle = '#d8c8a0'; g.fillRect(W - 57, 49, 46, 6);

    g.fillStyle = '#6ac0e0'; g.fillRect(W - 57, 49, Math.round(46 * pl.cool / 100), 1);
    // objective
    const j = game.jobs.active;

      const m = game.jobs.marker();

      let dist = '';

        const a = Math.atan2(m.y - here.y, m.x - here.x);
        dist = ' ' + ['E', 'SE', 'S', 'SW', 'W', 'NW', 'N', 'NE'][((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8] + ' ' + Math.round(d * 3) + 'M';
      }

      let title = j.title.toUpperCase();
      while (title.length > 8 && A().ptWidth('> ' + title + dist) > 250) title = title.slice(0, -1);

      bCol = inc.state === 'search' ? '#f0b838' : '#c83a2a';

    } else if (wit) { bTitle = 'WITNESS'; bSub = 'SOMEONE WILL REPORT YOU'; bCol = '#f0b838'; bText = '#2a1a12'; }
    else if (this.bannerS) { bTitle = this.bannerS.title.toUpperCase(); bSub = this.bannerS.sub.toUpperCase(); }
    if (bTitle) {
      const w2 = Math.max(A().ptWidth(bTitle, 2), A().ptWidth(bSub)) + 16;
      const x = Math.round(W / 2 - w2 / 2);
      if (blink && Math.floor(performance.now() / 400) % 2) bCol = '#7a1a10';
      hbox(g, x, 70, w2, bSub ? 32 : 22, !inc && !wit);
      if (inc || wit) { g.fillStyle = bCol; g.fillRect(x, 70, w2, bSub ? 32 : 22); }
      pt(g, bTitle, W / 2, 74 + (inc || wit ? 0 : 2), { align: 'center', scale: 2, color: bText });

    const sub = this.subsList[this.subsList.length - 1];
    let storyTop = H;
    if (sub) {
      const tag = sub.name.toUpperCase().slice(0, 16);
      const tagW = A().ptWidth(tag) + 8;
      const lines = game.renderer.wrap(sub.text.toUpperCase(), 440 - tagW);
      const h = Math.min(2, lines.length) * 11 + 10;
      storyTop = H - 8 - h;

      g.fillStyle = '#2a1a12'; g.fillRect(25, storyTop + 6, tagW + 2, 12);
      g.fillStyle = '#c83a2a'; g.fillRect(26, storyTop + 7, tagW, 10);
      pt(g, tag, 30, storyTop + 8, { color: '#f6ecd0' });
      lines.slice(0, 2).forEach((l, i) => pt(g, l, 32 + tagW, storyTop + 8 + i * 11, { color: '#3a2418' }));
    }
    // toast (one at a time, above the story bar)

    if (t) {
      const lines = game.renderer.wrap(t.text.toUpperCase(), 400);
      const h = lines.length * 11 + 8;
      const w2 = Math.max(...lines.map((l) => A().ptWidth(l))) + 18;
      const x = Math.round(W / 2 - w2 / 2), y = storyTop - 12 - h;
      g.fillStyle = '#2a1a12'; g.fillRect(x - 2, y - 2, w2 + 4, h + 4);
      g.fillStyle = 'rgba(20,12,10,0.92)'; g.fillRect(x, y, w2, h);
      g.fillStyle = t.kind === 'bad' ? '#c83a2a' : t.kind === 'good' ? '#6a9a30' : t.kind === 'warn' ? '#d9621e' : '#f0b838';
      g.fillRect(x, y, 4, h);
      lines.forEach((l, i) => pt(g, l, x + 10, y + 5 + i * 11, { color: '#f6ecd0' }));
    }
  };
