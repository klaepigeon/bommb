          } else if (v.parked) {
            v.dentCount = (v.dentCount || 0) + 1;
            if (v.dentCount >= 3 && !v.vandalReported) { v.vandalReported = true; g.law.crime('vandalism', v.x, v.y, { minor: true }); }
          }
        }
      }
    }
    return hit;
  };

  C.shoot = function (att, w, ang, target) {
    const g = game();
    if (att === g.player && g.player.cool > 0 && g.player.coolOn) w = Object.assign({}, w, { spread: 0 });
    const n = w.pellets || 1;
    const sx = att.x + Math.cos(ang) * 8, sy = att.y - 10 + Math.sin(ang) * 6;
    g.fx.flash(sx, sy);
    g.audio.sfx(w === D.weapons.shotgun ? 'shotgun' : w === D.weapons.chopper ? 'smg' : w === D.weapons.rifle ? 'rifle' : 'shot', att.x, att.y);
    g.actors.noise(att.x, att.y, TS * 22 * (w.loud || 1), 'gunshot', att);
    if (att === g.player) {
      g.cam.shake(w.pellets ? 3 : 1.5);
      g.law.shotsFired(att.x, att.y);
    }
    const skill = att === g.player ? 1 : att.cop ? 0.75 : 0.55;
    for (let p = 0; p < n; p++) {
      const spread = w.spread + (1 - skill) * 0.12 + (att.drunk ? 0.1 : 0);
      const a = ang + (R.rng() - 0.5) * spread * 2;
      C.ray(att, sx, sy, a, w.range, w.dmg);
    }
  };

  C.ray = function (att, sx, sy, a, range, dmg) {
    const g = game(), world = g.world;
    const dx = Math.cos(a), dy = Math.sin(a);
    let ex = sx + dx * range, ey = sy + dy * range;
    let hitT = null;
    const step = 4;
    const cands = g.actors.near(sx + dx * range * 0.5, sy + dy * range * 0.5, range * 0.5 + 20);
    const pl = g.player;
    if (att !== pl && !pl.inside) cands.push(pl.inCar || pl);
    const cars = g.traffic.hash.query(sx + dx * range * 0.5, sy + dy * range * 0.5, range * 0.5 + 40);
    for (let d = 6; d < range; d += step) {
      const x = sx + dx * d, y = sy + dy * d;
      const tx = (x / TS) | 0, ty = ((y + 8) / TS) | 0;
      const t = world.t(tx, ty);
      if (t === T.BLDG || t === T.ROCK || t === T.WALL || t === T.VOID) {
        ex = x; ey = y;
        g.fx.sparks(x, y, 2);
        const b = world.buildingAt(tx, ty);
        if (b && att === pl) g.env.damageBuilding(b, 0.5, att);
        break;
      }
      const o = world.o(tx, ty);
      if (o === D.O.LAMP && R.dist(x, y + 8, tx * TS + 8, ty * TS + 4) < 5) {
        g.env.shootLamp(tx, ty);
      }
      if (o === D.O.BARREL && R.dist(x, y + 8, tx * TS + 8, ty * TS + 8) < 7) {
        world.setO(tx, ty, 0);
        C.explosion(tx * TS + 8, ty * TS + 8, 36, 60, att);
        ex = x; ey = y;
        break;
      }
      for (const c of cars) {
        if (c.removed || c.wrecked || c === att.inCar) continue;
        const rx = x - c.x, ry = y + 6 - c.y;
        const cc = Math.cos(c.angle), ss = Math.sin(c.angle);
        if (Math.abs(rx * cc + ry * ss) < c.model.w * 0.5 && Math.abs(-rx * ss + ry * cc) < c.model.h * 0.5) {
          // the occupant may get hit
          if (c.driver && R.rng() < 0.35) C.damage(c.driver === pl ? pl : c.driver, dmg * 0.6, att, 'bullet');
          g.traffic.damage(c, dmg * 0.25, att);
          g.fx.sparks(x, y, 2);
          hitT = c;
          break;
        }
      }
      if (hitT) { ex = x; ey = y; break; }
      for (const t of cands) {
        if (t === att || t.dead || t.inCar || (t.kind === 'a' && t.flying && R.rng() < 0.5)) continue;
        if (t.kind === 'v') continue;
        if (hitHuman(t, x, y)) {
          const head = t.kind === 'h' && y < t.y - 13;
          C.damage(t, dmg * (head ? 1.8 : 1), att, 'bullet');
          if (head && att === pl) g.fx.text(t.x, t.y - 26, 'HEADSHOT', '#e4a92a');
          hitT = t;
          break;
        }
      }
      if (hitT) { ex = x; ey = y; break; }
    }
    g.fx.tracer(sx, sy, ex, ey);
  };

  C.throwIt = function (att, id, w, ang, target) {
    const g = game();
    let dist = w.range;
    if (target) dist = Math.min(w.range, R.dist(att.x, att.y, target.x, target.y));
    const tx = att.x + Math.cos(ang) * dist, ty = att.y + Math.sin(ang) * dist;
    C.projectiles.push({ id, x: att.x, y: att.y - 10, sx: att.x, sy: att.y - 10, tx, ty, t: 0, dur: 0.55 + dist / 400, owner: att, fuse: id === 'dynamite' ? 2.2 : 0 });
    g.audio.sfx('swing', att.x, att.y);
  };

  C.update = function (dt) {
    const g = game();
    for (const p of C.projectiles) {
      p.t += dt;
      const k = Math.min(1, p.t / p.dur);
      p.x = R.lerp(p.sx, p.tx, k);
      p.y = R.lerp(p.sy, p.ty, k) - Math.sin(k * Math.PI) * 26;
      if (k >= 1 && !p.landed) {
        p.landed = true;
        if (p.id === 'molotov') {
          g.fx.shatter(p.tx, p.ty);
          g.env.ignite(p.tx, p.ty, 1.8, p.owner);
          for (const a of g.actors.near(p.tx, p.ty, 26)) C.damage(a, 12, p.owner, 'fire'), (a.kind === 'h' && !a.dead && (a.burning = 4));
          if (!g.player.inCar && R.dist(g.player.x, g.player.y, p.tx, p.ty) < 22) g.player.hurt(10, p.owner, 'fire');
          g.actors.noise(p.tx, p.ty, TS * 10, 'blast', p.owner);
          p.done = true;
          if (p.owner === g.player) g.law.crime('arson', p.tx, p.ty, { minor: true });
        }
      }
      if (p.landed && p.id === 'dynamite') {
        p.fuse -= dt;
        if (R.rng() < 0.5) g.fx.spark1(p.tx, p.ty - 4);
        if (p.fuse <= 0) {
          C.explosion(p.tx, p.ty, 52, 120, p.owner);
          p.done = true;
        }
      }
    }
    C.projectiles = C.projectiles.filter((p) => !p.done);
    // burning people
    for (const a of g.actors.list) {
      if (a.burning > 0 && !a.dead) {
        a.burning -= dt;
        a.hp -= dt * 14;
        if (R.rng() < 0.4) g.fx.flame(a.x, a.y - 8);
        if (a.state !== 'flee' && a.kind === 'h') g.actors.setFlee(a, a, 3);
        if (a.hp <= 0) C.kill(a, a.lastHitBy, 'fire');
      }
    }
  };

  C.explosion = function (x, y, radius, dmg, owner, isCar) {
    const g = game();
    g.fx.boom(x, y, radius);
    g.audio.sfx('boom', x, y);
    g.cam.shake(R.clamp(10 - R.dist(x, y, g.player.x, g.player.y) / 30, 2, 10));
    g.actors.noise(x, y, TS * 28, 'blast', owner);
    for (const a of g.actors.near(x, y, radius + 10)) {
      const d = R.dist(x, y, a.x, a.y);
      const f = 1 - d / (radius + 10);
      if (f > 0) C.damage(a, dmg * f, owner, 'blast');
      if (!a.dead && a.kind === 'h') { a.down = Math.max(a.down, 2); g.actors.moveActor(a, (a.x - x) * 4, (a.y - y) * 4, 0.2); }
    }
    for (const v of g.traffic.hash.query(x, y, radius + 20)) {
      if (v.wrecked) continue;
      const d = R.dist(x, y, v.x, v.y);
      const f = 1 - d / (radius + 20);
      if (f > 0) { g.traffic.damage(v, dmg * f * 1.2, owner); v.vx += (v.x - x) * f * 5; v.vy += (v.y - y) * f * 5; }
    }
    const pl = g.player;
    const pd = R.dist(x, y, pl.x, pl.y);
    if (pd < radius + 10 && !isCar) pl.hurt(dmg * (1 - pd / (radius + 10)), owner, 'blast');
    else if (pd < radius && isCar) pl.hurt(30 * (1 - pd / radius), owner, 'blast');
    // world: fire, trees, buildings
    g.env.ignite(x, y, radius / TS, owner);
    const tr = Math.ceil(radius / TS);
    const tx0 = (x / TS) | 0, ty0 = (y / TS) | 0;
    const hitB = new Set();
    for (let yy = ty0 - tr; yy <= ty0 + tr; yy++)
      for (let xx = tx0 - tr; xx <= tx0 + tr; xx++) {
        if (R.dist(xx, yy, tx0, ty0) > tr) continue;
        const o = g.world.o(xx, yy);
        if (o === D.O.TREE || o === D.O.PINE || o === D.O.PALM) g.world.setO(xx, yy, D.O.STUMP);
        else if (o && o !== D.O.STUMP) { g.world.setO(xx, yy, 0); g.fx.debris(xx * TS + 8, yy * TS + 8, o); }
        const b = g.world.buildingAt(xx, yy);
        if (b) hitB.add(b);
      }
    for (const b of hitB) g.env.damageBuilding(b, dmg * 0.5, owner);
    if (owner === pl && !isCar) g.law.crime('explosion', x, y, {});
  };

  // ---------------------------------------------------------------- NPC fighting AI
  C.npcFight = function (h, dt) {
    const g = game();
    const pl = g.player;
    let tg = h.target;
    if (tg && tg.inCar && tg !== pl) tg = tg.inCar;
    if (tg === pl && pl.inCar) tg = pl.inCar;
    if (!tg || tg.dead || tg.removed || (tg === pl && (pl.dead || pl.inside)) || (tg === pl && pl.arrested)) {
      h.state = 'idle';
      h.timer = 2;
      h.target = null;
      return;
    }
    // cops at level 1 try to arrest rather than shoot
    if (h.cop && tg === pl && g.law.wantsArrest()) return g.law.copArrest(h, dt);
    const w = D.weapons[h.weapon];
    const d = R.dist(h.x, h.y, tg.x, tg.y);
    const ang = Math.atan2(tg.y - h.y, tg.x - h.x);
    h.ang = ang;
    h.dir = R.dir4(Math.cos(ang), Math.sin(ang));
    h.drawn = true;
    h.atkT = (h.atkT || 0) - dt;
    const runSpeed = 68 * (h.cop ? 1.05 : 1);
    // give up if the fight is going badly (non-cops)
    if (!h.cop && h.hp < 30 && h.tr.brave < 0.8 && !h.hostileLocked) {
      h.state = 'surrender';
      h.timer = 6;
      g.actors.say(h, R.dialog.line('beg', h));
      return;
    }
    if (w.melee || (w.gun && h.ammo <= 0)) {
      if (d > w.range) {
        g.actors.moveActor(h, Math.cos(ang) * runSpeed, Math.sin(ang) * runSpeed, dt);
        h.walk += dt * 20;
      } else if (h.atkT <= 0) {
        h.atkT = w.rate * 2.2 + R.rng() * 0.5;
        C.melee(h, w.gun ? D.weapons.fists : w, ang);
      }
      return;
    }
    // gunfighter: keep medium distance, strafe, shoot when in sight
    const ideal = w === D.weapons.shotgun ? 50 : 90;
    const los = g.world.los(h.x, h.y - 8, tg.x, tg.y - 8);
    let mx = 0, my = 0;
    if (!los || d > w.range * 0.9) { mx = Math.cos(ang); my = Math.sin(ang); }
    else if (d < ideal * 0.6) { mx = -Math.cos(ang); my = -Math.sin(ang); }
    else { h.strafe = h.strafe || (R.rng() < 0.5 ? 1 : -1); mx = Math.cos(ang + Math.PI / 2 * h.strafe) * 0.6; my = Math.sin(ang + Math.PI / 2 * h.strafe) * 0.6; if (R.rng() < dt * 0.4) h.strafe *= -1; }
    if (mx || my) { g.actors.moveActor(h, mx * runSpeed * 0.8, my * runSpeed * 0.8, dt); h.walk += dt * 15; }
    if (los && d < w.range && h.atkT <= 0) {
      h.atkT = w.rate * (h.cop ? 2.4 : 3) + R.rng() * 0.8;
      h.clipLeft = h.clipLeft === undefined ? w.clip : h.clipLeft;
      if (h.clipLeft <= 0) { h.clipLeft = w.clip; h.atkT = 1.6; return; }
      h.clipLeft--;
      h.ammo--;
      C.shoot(h, w, ang, tg);
    }
  };
})();

// ---- 08_law.js
// RHAPSODY — the law, modeled on RDR2: a crime only matters if someone sees it.
// Witnesses must physically report it (and can be stopped). Police respond to a
// last-known location, search a zone you can slip out of, and prefer arrests at
// low levels. Bounties are per jurisdiction and can be paid off. Accidents are free.
'use strict';
(function () {
  const D = R.data, TS = R.TILE;

  const CRIMES = {
    reckless: { name: 'Reckless Driving', bounty: 5, lvl: 1, minor: true },
    vandalism: { name: 'Vandalism', bounty: 5, lvl: 1, minor: true },
    brandish: { name: 'Brandishing a Weapon', bounty: 0, lvl: 1, minor: true },
    trespass: { name: 'Trespassing', bounty: 5, lvl: 1, minor: true },
    assault: { name: 'Assault', bounty: 15, lvl: 1 },
    theft: { name: 'Theft', bounty: 10, lvl: 1 },
    pickpocket: { name: 'Pickpocketing', bounty: 10, lvl: 1, minor: true },
    mugging: { name: 'Armed Robbery', bounty: 25, lvl: 1 },
    carjack: { name: 'Carjacking', bounty: 25, lvl: 1 },
    cartheft: { name: 'Auto Theft', bounty: 15, lvl: 1 },
    burglary: { name: 'Burglary', bounty: 35, lvl: 1 },
    robbery: { name: 'Store Robbery', bounty: 50, lvl: 2 },
    arson: { name: 'Arson', bounty: 45, lvl: 2 },
    explosion: { name: 'Explosives', bounty: 40, lvl: 2 },
    manslaughter: { name: 'Vehicular Manslaughter', bounty: 45, lvl: 1 },
    murder: { name: 'Murder', bounty: 100, lvl: 2 },
    copAssault: { name: 'Assaulting an Officer', bounty: 40, lvl: 2 },
    copMurder: { name: 'Killing an Officer', bounty: 250, lvl: 3 },
    heist: { name: 'Bank Robbery', bounty: 300, lvl: 3 },
    jailbreak: { name: 'Resisting Arrest', bounty: 20, lvl: 2 },
  };

  const Law = (R.Law = function (game) {
    this.game = game;
    this.bounty = {}; // jurisdiction -> $
    this.incident = null;
    this.warn = new WeakMap();
    this.log = [];
    this.recognizeT = 0;
    this.shotT = 0;
    this.hunterT = 60;
  });
  const L = Law.prototype;
  L.CRIMES = CRIMES;

  L.jurAt = function (x, y) {
    const c = this.game.world.cityAt((x / TS) | 0, (y / TS) | 0);
    return c ? c.id : 'county';
  };
  L.jurName = function (j) {
    const c = this.game.world.cities.find((c) => c.id === j);
    return c ? c.name : 'the County';
  };
  L.active = function () {
    return !!this.incident;
  };
  L.level = function () {
    return this.incident ? this.incident.level : 0;
  };
  L.totalBounty = function () {
    let s = 0;
    for (const k in this.bounty) s += this.bounty[k];
    return s;
  };

  // ------------------------------------------------ the crime happens
  L.crime = function (type, x, y, opts) {
    opts = opts || {};
    const g = this.game, pl = g.player;
    const def = CRIMES[type];
    if (!def) return;
    if (g.cheats && g.cheats.noLaw) return;
    const jur = this.jurAt(x, y);
    const loc = g.interiors ? g.interiors.outside(x, y) : { x, y };
    const crime = { type, def, x: loc.x, y: loc.y, jur, identified: !pl.masked, t: g.clock.t, lvl: def.lvl, bounty: def.bounty, victim: opts.victim || null };
    pl.stats.crimes++;
    // city consequences
    const city = g.world.cities.find((c) => c.id === jur);
    if (city && !def.minor) { city.heat += def.bounty / 10; city.prosperity = Math.max(0, city.prosperity - def.bounty / 40); }
    // who saw it?
    const night = g.clock.isNight();
    const range = TS * (night ? 7 : 12) * (g.env.weather.fog > 0.4 ? 0.6 : 1) * (g.env.weather.rain > 0.5 ? 0.8 : 1);
    const seen = [];
    let copSaw = null;
    for (const a of g.actors.near(x, y, range)) {
      if (a.kind !== 'h' || a.dead || a.down > 0 || a === opts.victim && opts.victim.dead) continue;
      if (a.hostile && !a.cop) continue; // your opponents are busy
      const lit = !night || g.env.litAt(a.x, a.y) || R.dist(a.x, a.y, x, y) < TS * 3;
      if (!lit) continue;
      if (!g.world.los(a.x, a.y - 10, x, y - 10)) continue;
      if (a.cop) { copSaw = a; continue; }
      seen.push(a);
    }
    if (opts.victim && !opts.victim.dead && !seen.includes(opts.victim) && opts.victim.kind === 'h' && !opts.victim.cop) seen.push(opts.victim);
    if (copSaw) {
      if (def.minor && !this.incident) {
        // a warning first for small stuff
        if (!this.warned(copSaw)) {
          this.warn.set(copSaw, g.clock.t);
          g.actors.say(copSaw, R.dialog.line('copWarnMinor', copSaw));
          g.ui.toast(`An officer saw that. One warning: ${def.name}.`);
          return;
        }
      }
      g.actors.say(copSaw, R.dialog.line('copSaw', copSaw));
      this.startIncident(crime, copSaw);
      return;
    }
    if (def.minor && type !== 'pickpocket' && type !== 'reckless') {
      // minor crimes don't get reported by civilians
      for (const a of seen) if (R.rng() < 0.5) g.actors.say(a, R.dialog.line('tut', a));
      return;
    }
    let witnesses = 0;
    for (const a of seen) {
      if (a.witness && !a.witness.done) continue;
      const p = a.person;
      // friends and the terrified keep quiet
      if ((p && p.opinion >= 55) || (a.faction && a.faction !== 'law' && g.jobs.familyStanding(a.faction) >= 20)) {
        if (R.rng() < 0.6) g.actors.say(a, R.dialog.line('sawNothing', a));
        continue;
      }
      const cityFear = city ? city.fear / 100 : 0;
      if (a.tr.brave < 0.35 && R.rng() < 0.25 + cityFear * 0.5 + pl.rep.infamy / 400) {
        g.actors.say(a, R.dialog.line('sawNothing', a));
        continue;
      }
      a.witness = { crime, done: false, silenced: false };
      witnesses++;
      if (a.tr.brave > 0.8 && a.armed && a !== opts.victim) {
        g.actors.setFight(a, pl);
        g.actors.say(a, R.dialog.line('hero', a));
      } else if (a.tr.brave < 0.3 && R.dist(a.x, a.y, pl.x, pl.y) < TS * 4) {
        g.actors.setCower(a, 3 + R.rng() * 3);
        g.actors.say(a, R.dialog.line('cower', a));
      } else {
        g.actors.setFlee(a, pl, 2 + R.rng() * 3);
        g.actors.say(a, R.dialog.line('witness', a));
      }
      a.alert = 'witness';
    }
    if (witnesses) {
      g.ui.toast(`${witnesses} witness${witnesses > 1 ? 'es' : ''} to ${def.name}${pl.masked ? ' (masked: they can\'t name you)' : ''}. Stop them before they reach a phone or a cop.`, 'warn');
      this.log.unshift(crime);
    } else if (!this.incident) {
      g.ui.toast(`Nobody saw the ${def.name.toLowerCase()}.`, 'good');
    } else {
      // during an active incident further crimes escalate directly
      this.escalate(crime);
    }
  };

  L.warned = function (h) {
    const t = this.warn.get(h);
    return t !== undefined && this.game.clock.t - t < 600;
  };
  L.brandish = function (cop) {
    const g = this.game;
    this.warn.set(cop, g.clock.t);
    cop.brandishT = 5;
    cop.state = 'watch';
    cop.watchT = g.player;
    cop.timer = 6;
    cop.drawn = true;
    g.ui.toast('Cop: "Put the gun away." Holster it (SWAP) or it becomes a problem.', 'warn');
  };

  // a witness made the call
  L.report = function (crime, witness) {
    const g = this.game;
    if (witness && witness.person) g.pop.remember(witness.person, 'witness', `I saw a ${crime.def.name.toLowerCase()} with my own eyes. Called it in.`, g.pop.day);
    g.ui.toast(`A witness reported the ${crime.def.name.toLowerCase()}. Police are responding in ${this.jurName(crime.jur)}.`, 'bad');
    g.audio.sfx('alarm');
    if (this.incident) this.escalate(crime);
    else this.startIncident(crime, null);
  };

  L.addBounty = function (crime) {
    if (!crime.identified || !crime.bounty) return;
    this.bounty[crime.jur] = (this.bounty[crime.jur] || 0) + crime.bounty;
    this.game.player.rep.infamy += crime.bounty / 25;
  };

  L.startIncident = function (crime, cop) {
    const g = this.game;
    this.addBounty(crime);
    this.incident = {
      jur: crime.jur, level: crime.lvl, lastX: crime.x, lastY: crime.y, state: cop ? 'pursuit' : 'responding',
      seenT: cop ? g.clock.real : -99, searchLeft: 0, units: [], crimes: [crime], started: g.clock.real, dispatchT: 0,
      arrestT: 0, identified: crime.identified,
    };
    if (cop) {
      this.incident.units.push(cop);
      g.actors.setFight(cop, g.player);
    }
    this.dispatch();
    g.audio.music('tense');
  };
  L.escalate = function (crime) {
    const inc = this.incident;
    this.addBounty(crime);
    inc.crimes.push(crime);
    if (crime.lvl > inc.level) {
      inc.level = crime.lvl;
      this.game.ui.toast(`Police response escalated: ${['', 'Wanted', 'Dangerous', 'Shoot on sight'][inc.level]}.`, 'bad');
      this.dispatch();
    }
    if (crime.identified) inc.identified = true;
  };

  // Send units towards the last known position
  L.dispatch = function () {
    const g = this.game, inc = this.incident;
    const want = [0, 2, 3, 5][inc.level];
    const alive = inc.units.filter((u) => !u.dead && !u.removed).length;
    const w = g.world;
    const cars = Math.ceil((want - alive) / 2);
    for (let k = 0; k < cars; k++) {
      const s = w.findNear(inc.lastX / TS, inc.lastY / TS, 20, 32, (x, y) => w.flow[w.idx(x, y)] && !g.cam.onScreen(x * TS, y * TS, 30));
      if (!s) continue;
      const car = g.traffic.make('police', s.x * TS + 8, s.y * TS + 8, 0, { mode: 'chase', keep: true });
      car.siren = true;
      car.angle = Math.atan2(inc.lastY - car.y, inc.lastX - car.x);
      const d1 = g.traffic.addDriver(car, { cop: true, role: 'cop', city: inc.jur });
      d1.look = g.pop.makeLook(R.mulberry(R.rng.int(0, 1e9)), { fem: R.rng.chance(0.25), age: 35, role: 'cop', city: inc.jur });
      g.actors.arm(d1, inc.level >= 3 ? 'shotgun' : 'revolver');
      const d2 = g.actors.makeHuman(car.x, car.y, { cop: true, role: 'cop', city: inc.jur });
      d2.look = g.pop.makeLook(R.mulberry(R.rng.int(0, 1e9)), { fem: R.rng.chance(0.25), age: 30, role: 'cop', city: inc.jur });
      if (inc.level >= 2) g.actors.arm(d2, R.rng.pick(['shotgun', 'revolver', 'magnum']));
      d2.inCar = car;
      d2.state = 'drive';
      car.passengers = [d2];
      car.ai = { dest: { x: inc.lastX, y: inc.lastY }, stopNear: 40, onArrive: (c) => this.unload(c) };
      d1.keep = d2.keep = true;
      inc.units.push(d1, d2);
      g.actors.say(d1, R.dialog.line('radio', d1));
    }
  };
  L.unload = function (car) {
    const g = this.game, inc = this.incident;
    const crew = [car.driver].concat(car.passengers || []).filter((x) => x && x !== g.player && !x.dead);
    car.passengers = [];
    for (const c of crew) {
      g.traffic.exitVehicle(car, c);
      c.state = 'idle';
      if (inc && inc.state === 'pursuit') g.actors.setFight(c, g.player);
      else this.searchPoint(c);
    }
    car.siren = inc ? true : false;
    car.ai = {};
  };
  L.searchPoint = function (c) {
    const inc = this.incident;
    if (!inc) return;
    const r = this.searchRadius();
    const a = R.rng() * Math.PI * 2, d = R.rng() * r;
    c.state = 'travel';
    c.hurry = true;
    this.game.actors.goTo(c, ((inc.lastX + Math.cos(a) * d) / TS) | 0, ((inc.lastY + Math.sin(a) * d) / TS) | 0, { near: 20 });
  };
  L.searchRadius = function () {
    return TS * (10 + this.incident.level * 4);
  };

  // ------------------------------------------------ perception hooks from cops
  L.copSees = function (cop, d) {
    const g = this.game, pl = g.player, inc = this.incident;
    if (inc) {
      if (d < TS * 12) this.seen(cop);
      return;
    }
    // brandishing warning expires into a crime
    if (cop.brandishT > 0) {
      if (!pl.weaponOut || !D.weapons[pl.weapon] || !D.weapons[pl.weapon].gun) { cop.brandishT = 0; g.actors.say(cop, R.dialog.line('copOk', cop)); cop.drawn = false; return; }
      cop.brandishT -= 0.3;
      if (cop.brandishT <= 0) this.startIncident({ type: 'brandish', def: CRIMES.brandish, x: pl.x, y: pl.y, jur: this.jurAt(pl.x, pl.y), identified: !pl.masked, lvl: 1, bounty: 5 }, cop);
      return;
    }
    // recognise a wanted face
    const b = this.bounty[this.jurAt(pl.x, pl.y)] || 0;
    if (b <= 0 || pl.masked || d > TS * 7) return;
    const disguise = pl.outfitChangedSince > 0 ? 0.25 : 1;
    const chance = Math.min(0.25, b / 2000) * disguise * (g.clock.isNight() ? 0.5 : 1);
    if (R.rng() < chance) {
      g.actors.say(cop, R.dialog.line('recognise', cop));
      g.ui.toast(`An officer recognised you. Bounty in ${this.jurName(this.jurAt(pl.x, pl.y))}: ${R.fmtMoney(b)}.`, 'warn');
      this.startIncident({ type: 'warrant', def: { name: 'Outstanding Warrant', minor: false }, x: pl.x, y: pl.y, jur: this.jurAt(pl.x, pl.y), identified: true, lvl: 1, bounty: 0 }, cop);
    }
  };
  L.copHears = function (cop, x, y, kind) {
    if (cop.state === 'fight' || cop.inCar) return;
    cop.state = 'travel';
    cop.hurry = true;
    this.game.actors.goTo(cop, (x / TS) | 0, (y / TS) | 0, { near: 30 });
    if (R.rng() < 0.5) this.game.actors.say(cop, R.dialog.line('copInvestigate', cop));
  };
  L.shotsFired = function (x, y) {
    // firing in town near cops without an incident is brandishing at least
    const g = this.game;
    if (this.incident) return;
    // shooting back at someone who is shooting at you is not a crime
    for (const a of g.actors.near(g.player.x, g.player.y, TS * 16)) if (!a.dead && a.kind === 'h' && (a.attackedPlayer || a.hostile && a.state === 'fight' && a.target === g.player)) return;
    for (const a of g.actors.near(x, y, TS * 12)) {
      if (a.cop && !a.dead && g.world.los(a.x, a.y - 8, x, y - 8)) {
        g.actors.say(a, R.dialog.line('copSaw', a));
        this.startIncident({ type: 'shots', def: { name: 'Discharging a Firearm' }, x, y, jur: this.jurAt(x, y), identified: !g.player.masked, lvl: 1, bounty: 10 }, a);
        return;
      }
    }
  };
  L.seen = function (cop) {
    const g = this.game, pl = g.player, inc = this.incident;
    const at = g.interiors.outside(pl.x, pl.y);
    inc.lastX = at.x;
    inc.lastY = at.y;
    inc.seenT = g.clock.real;
    if (inc.state !== 'pursuit') {
      inc.state = 'pursuit';
      g.ui.toast('Spotted! Police in pursuit.', 'bad');
    }
    if (cop && cop.state !== 'fight' && !cop.inCar) g.actors.setFight(cop, pl);
    if (cop && !inc.units.includes(cop)) inc.units.push(cop);
  };

  // level 1: cops walk up and cuff you
  L.wantsArrest = function () {
    const inc = this.incident;
    return inc && inc.level === 1 && !inc.resisted;
  };
  L.copArrest = function (cop, dt) {
    const g = this.game, pl = g.player, inc = this.incident;
    const d = R.dist(cop.x, cop.y, pl.x, pl.y);
    const ang = Math.atan2(pl.y - cop.y, pl.x - cop.x);
    cop.dir = R.dir4(Math.cos(ang), Math.sin(ang));
    cop.drawn = true;
    if (pl.inCar) {
      // order you out
      if (d < TS * 6 && !cop.saidOut) { cop.saidOut = true; g.actors.say(cop, 'Step out of the vehicle!'); }
      if (d > TS * 3) g.actors.moveActor(cop, Math.cos(ang) * 60, Math.sin(ang) * 60, dt), (cop.walk += dt * 20);
      inc.fleeT = (inc.fleeT || 0) + (Math.abs(pl.inCar.speed) > 60 ? dt : 0);
      if (inc.fleeT > 2) this.resist('Fleeing in a vehicle');
      return;
    }
    if (d > 26) {
      g.actors.moveActor(cop, Math.cos(ang) * 62, Math.sin(ang) * 62, dt);
      cop.walk += dt * 20;
      if (d > TS * 9 && inc.arrestT > 0) { inc.fleeT = (inc.fleeT || 0) + dt; if (inc.fleeT > 4) this.resist('Fleeing arrest'); }
      return;
    }
    if (!inc.arrestT) {
      inc.arrestT = 7;
      g.actors.say(cop, R.dialog.line('arrest', cop));
      g.ui.arrestPrompt(cop);
    }
  };
  L.resist = function (why) {
    const inc = this.incident;
    if (!inc || inc.resisted) return;
    inc.resisted = true;
    inc.arrestT = 0;
    this.game.ui.closeArrest();
    this.escalate({ type: 'jailbreak', def: CRIMES.jailbreak, x: this.game.player.x, y: this.game.player.y, jur: inc.jur, identified: !this.game.player.masked, lvl: 2, bounty: CRIMES.jailbreak.bounty });
    this.game.ui.toast(`${why}. Officers will use force.`, 'bad');
  };
  L.surrender = function () {
    const g = this.game, pl = g.player, inc = this.incident;
    const jur = inc ? inc.jur : this.jurAt(pl.x, pl.y);
    const b = this.bounty[jur] || 0;
    const fine = Math.max(25, Math.round(b));
    this.clearIncident(true);
    if (pl.cash >= fine) {
      pl.cash -= fine;
      this.bounty[jur] = 0;
      g.ui.story('BOOKED', `You spend a night in the ${this.jurName(jur)} lockup and pay ${R.fmtMoney(fine)} in fines. Your slate is clean here.`);
      g.clock.skip(10 * 60);
    } else {
      const days = 1 + Math.floor(b / 200);
      pl.cash = Math.floor(pl.cash * 0.5);
      this.bounty[jur] = 0;
      g.ui.story('DOING TIME', `Can't cover the ${R.fmtMoney(fine)} bounty. You serve ${days} day${days > 1 ? 's' : ''} in the ${this.jurName(jur)} county jail. The city kept living without you.`);
      for (let k = 0; k < days; k++) g.clock.skip(24 * 60);
    }
    const city = g.world.cities.find((c) => c.id === jur) || g.world.cities[0];
    const ps = city.buildings.find((b) => b.type === 'police');
    if (ps) pl.place(ps.out.x * TS + 8, ps.out.y * TS + 10);
    pl.weaponOut = false;
    pl.stats.arrests++;
  };
  L.payBounty = function (jur) {
    const g = this.game, pl = g.player;
    const b = this.bounty[jur] || 0;
    if (!b) return false;
    if (pl.cash < b) return false;
    pl.cash -= b;
    this.bounty[jur] = 0;
    g.ui.toast(`Bounty of ${R.fmtMoney(b)} paid in ${this.jurName(jur)}.`, 'good');
    return true;
  };
  L.clearIncident = function (quiet) {
    const g = this.game, inc = this.incident;
    if (!inc) return;
    for (const u of inc.units) {
      if (u.dead || u.removed) continue;
      u.keep = false;
      u.hostile = false;
      if (u.state === 'fight') { u.state = 'idle'; u.timer = 2; u.target = null; }
      if (u.inCar) u.inCar.keep = false;
    }
    for (const v of g.traffic.list) if (v.modelId === 'police') { v.siren = false; v.keep = false; if (v.ai) { v.ai.target = null; v.ai.dest = null; } }
    for (const a of g.actors.list) if (a.cop && a.hostile) { a.hostile = false; if (a.state === 'fight') { a.state = 'idle'; a.timer = 2; } }
    this.incident = null;
    g.ui.closeArrest();
    g.audio.music(null);
    if (!quiet) {
      const b = this.bounty[inc.jur] || 0;
      g.ui.toast(`You lost them.${b ? ` Bounty in ${this.jurName(inc.jur)}: ${R.fmtMoney(b)}.` : ' They never got a look at your face.'}`, 'good');
      g.player.stats.escapes++;
    }
  };

  // ------------------------------------------------ per-frame
  L.update = function (dt) {
    const g = this.game, inc = this.incident;
    // indoors, the law treats you as being at the building's front door
    const pl = g.player.room ? Object.assign({}, g.player, g.interiors.outside(g.player.x, g.player.y), { inside: g.player.room }) : g.player;
    this.hunterT -= dt;
    if (this.hunterT <= 0) { this.hunterT = 90; this.bountyHunters(); }
    if (!inc) return;
    const now = g.clock.real;
    // check cop line of sight directly (so cars count too)
    let seenNow = false;
    for (const u of inc.units) {
      if (u.dead || u.removed) continue;
      const P0 = u.room ? g.player : pl;
      const d = R.dist(u.x, u.y, P0.x, P0.y);
      if (d < TS * 13 && (u.room || !pl.inside) && g.world.los(u.x, u.y - 8, P0.x, P0.y - 8)) { seenNow = true; break; }
    }
    const P1 = g.player;
    for (const a of g.actors.near(P1.x, P1.y, TS * 12)) {
      if (a.cop && !a.dead && !inc.units.includes(a) && g.world.los(a.x, a.y - 8, P1.x, P1.y - 8)) { inc.units.push(a); seenNow = true; }
    }
    if (seenNow) this.seen(null);
    const sinceSeen = now - inc.seenT;
    // police cars chase when you drive, head to last seen otherwise
    for (const v of g.traffic.list) {
      if (v.modelId !== 'police' || !v.driver || v.driver === pl || v.removed || !v.keep) continue;
      if (inc.state === 'pursuit' && sinceSeen < 3 && pl.inCar) v.ai = { target: pl, stopNear: 0 };
      else if (inc.state === 'pursuit' && sinceSeen < 3 && R.dist(v.x, v.y, pl.x, pl.y) > TS * 6) v.ai = { target: pl, stopNear: 50, onArrive: (c) => this.unload(c) };
      else if (!v.ai || !v.ai.dest) v.ai = { dest: { x: inc.lastX, y: inc.lastY }, stopNear: 40, onArrive: (c) => this.unload(c) };
    }
    // foot units lose track -> search
    if (inc.state === 'pursuit' && sinceSeen > 6) {
      inc.state = 'search';
      inc.searchLeft = 40 + inc.level * 12;
      g.ui.toast('They lost sight of you. Leave the search area or lie low.', 'warn');
      for (const u of inc.units) if (!u.dead && !u.removed && !u.inCar) this.searchPoint(u);
    }
    if (inc.state === 'responding' || inc.state === 'search') {
      if (inc.state === 'responding' && now - inc.started > 25) { inc.state = 'search'; inc.searchLeft = 40 + inc.level * 12; }
      inc.searchLeft -= dt * (pl.inside ? 1.6 : 1);
      const outside = R.dist(pl.x, pl.y, inc.lastX, inc.lastY) > this.searchRadius();
      if (outside) inc.outT = (inc.outT || 0) + dt;
      else inc.outT = 0;
      for (const u of inc.units) if (!u.dead && !u.removed && !u.inCar && u.state === 'idle') this.searchPoint(u);
      if ((inc.state === 'search' && inc.searchLeft <= 0) || inc.outT > 6 || this.jurAt(pl.x, pl.y) !== inc.jur && inc.outT > 2) this.clearIncident(false);
    }
    // arrest countdown
    if (inc.arrestT > 0) {
      inc.arrestT -= dt;
      if (inc.arrestT <= 0 && this.incident) this.resist('You ignored the order');
    }
    // reinforcements
    inc.dispatchT -= dt;
    if (inc.dispatchT <= 0 && this.incident) { inc.dispatchT = 25; this.dispatch(); }
  };

  // ------------------------------------------------ bounty hunters on the open road
  L.bountyHunters = function () {
    const g = this.game, pl = g.player;
    if (this.incident || pl.inside) return;
    const jur = this.jurAt(pl.x, pl.y);
    if (jur !== 'county') return;
    let best = null, amt = 0;
    for (const k in this.bounty) if (this.bounty[k] > amt) { amt = this.bounty[k]; best = k; }
    if (amt < 120 || R.rng() > Math.min(0.5, amt / 800) * g.settings.events) return;
    const s = g.world.findNear(pl.x / TS, pl.y / TS, 16, 22, (x, y) => !g.world.solidPed(x, y) && !g.world.isWater(x, y));
    if (!s) return;
    const n = amt > 400 ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const h = g.actors.makeHuman(s.x * TS + 8 + i * 12, s.y * TS + 8, { tag: 'bounty', weapon: R.rng.pick(['rifle', 'shotgun', 'revolver']) });
      h.look.hat = 'cowboy';
      h.look.hatCol = '#4a3020';
      h.look.top = '#5a4030';
      h.tr.brave = 1;
      h.hostileLocked = true;
      g.actors.setFight(h, pl);
      if (i === 0) g.actors.say(h, `That's the one from ${this.jurName(best)}. ${R.fmtMoney(amt)}, dead or alive!`);
    }
    g.ui.toast(`Bounty hunters from ${this.jurName(best)} tracked you down.`, 'bad');
  };

  L.serialize = function () {
    return { bounty: this.bounty };
  };
  L.restore = function (s) {
    this.bounty = s.bounty || {};
  };
})();

// ---- 09_env.js
// RHAPSODY — environment: clock, weather, fire propagation, gasoline, hydrants,
// street lighting, building damage, particles and the camera.
'use strict';
(function () {
  const D = R.data, T = D.T, O = D.O, TS = R.TILE;

  // ---------------------------------------------------------------- clock
  R.Clock = function (game, startMinutes) {
    this.game = game;
    this.t = startMinutes; // in-game minutes since the epoch
    this.real = 0; // real seconds
    this.rate = 1; // game minutes per real second
    this.lastDay = Math.floor(startMinutes / 1440);
  };
  const CK = R.Clock.prototype;
  CK.update = function (dt) {
    this.real += dt;
    this.t += dt * this.rate;
    this.checkDay();
  };
  CK.checkDay = function () {
    // the daily life tick happens at 5am
    const d = Math.floor((this.t - 300) / 1440);
    while (this.lastDay < d) {
      this.lastDay++;
      this.game.onNewDay();
    }
  };
  CK.skip = function (mins) {
    this.t += mins;
    this.checkDay();
  };
  CK.day = function () { return Math.floor(this.t / 1440); };
  CK.hour = function () { return (this.t % 1440) / 60; };
  CK.isNight = function () { const h = this.hour(); return h < 5.5 || h >= 20.5; };
  CK.weekday = function () { return ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'][this.day() % 7]; };
  CK.label = function () {
    const h = Math.floor(this.hour()), m = Math.floor(this.t % 60);
    const ap = h < 12 ? 'AM' : 'PM';
    const hh = h % 12 === 0 ? 12 : h % 12;
    return `${hh}:${String(m).padStart(2, '0')} ${ap}`;
  };
  // 0 bright day .. 1 darkest night
  CK.darkness = function () {
    const h = this.hour();
    if (h >= 7 && h < 18.5) return 0;
    if (h >= 18.5 && h < 21) return (h - 18.5) / 2.5 * 0.82;
    if (h >= 21 || h < 4.5) return 0.82;
    return 0.82 * (1 - (h - 4.5) / 2.5);
  };
  // warm tint strength around sunset / sunrise
  CK.golden = function () {
    const h = this.hour();
    const a = Math.max(0, 1 - Math.abs(h - 18.7) / 1.6);
    const b = Math.max(0, 1 - Math.abs(h - 6.2) / 1.2) * 0.7;
    return Math.max(a, b);
  };

  // ---------------------------------------------------------------- environment
  const Env = (R.Env = function (game) {
    this.game = game;
    this.weather = { kind: 'clear', rain: 0, fog: 0, cloud: 0.1, wind: { x: 0.6, y: 0.2 }, target: null, nextT: 40, dry: 0.4, snow: false, heat: 0 };
    this.fires = new Map(); // tile idx -> {i, fuel, b}
    this.gas = new Map(); // tile idx -> amount
    this.geysers = [];
    this.fireT = 0;
    this.lightning = 0;
    this.fireDispatchT = 0;
    R.env = this;
  });
  const E = Env.prototype;

  const WEATHER = {
    clear: { rain: 0, fog: 0, cloud: 0.05, next: [['clear', 3], ['cloudy', 2], ['heat', 0.8], ['fog', 0.5]] },
    cloudy: { rain: 0, fog: 0.05, cloud: 0.5, next: [['clear', 2], ['rain', 2], ['cloudy', 1], ['storm', 0.6]] },
    rain: { rain: 0.7, fog: 0.15, cloud: 0.8, next: [['cloudy', 2], ['rain', 1], ['storm', 1], ['fog', 0.6]] },
    storm: { rain: 1, fog: 0.2, cloud: 1, next: [['rain', 2], ['cloudy', 1]] },
    fog: { rain: 0, fog: 0.7, cloud: 0.4, next: [['clear', 2], ['cloudy', 1]] },
    heat: { rain: 0, fog: 0, cloud: 0, next: [['clear', 2], ['heat', 1], ['storm', 0.4]] },
  };
  E.WEATHER_NAMES = { clear: 'Clear', cloudy: 'Overcast', rain: 'Rain', storm: 'Thunderstorm', fog: 'Fog', heat: 'Heatwave' };

  E.setWeather = function (kind) {
    const w = this.weather;
    w.kind = kind;
    w.target = WEATHER[kind];
    w.nextT = 40 + R.rng() * 80;
    const a = R.rng() * Math.PI * 2, s = kind === 'storm' ? 1.4 : 0.3 + R.rng() * 0.7;
    w.wind = { x: Math.cos(a) * s, y: Math.sin(a) * s };
  };

  E.update = function (dt) {
    const g = this.game, w = this.weather, pl = g.player;
    // regional flavour: the desert rarely rains, the north snows
    const fy = pl.y / TS / g.world.H, fx = pl.x / TS / g.world.W;
    const desert = fx > 0.6 && fy > 0.6;
    w.snow = fy < 0.22;
    w.nextT -= dt * g.clock.rate;
    if (w.nextT <= 0 || !w.target) {
      let nk = R.rng.weighted(WEATHER[w.kind].next);
      if (desert && (nk === 'rain' || nk === 'fog') && R.rng() < 0.7) nk = 'heat';
      this.setWeather(nk);
      if (g.started) g.ui.toast(`Weather: ${this.WEATHER_NAMES[nk]}${w.snow && (nk === 'rain' || nk === 'storm') ? ' (snow up north)' : ''}.`);
    }
    const tg = w.target;
    const k = Math.min(1, dt * 0.15);
    w.rain += (tg.rain * (desert ? 0.4 : 1) - w.rain) * k;
    w.fog += (tg.fog - w.fog) * k;
    w.cloud += (tg.cloud - w.cloud) * k;
    w.heat += ((w.kind === 'heat' ? 1 : 0) - w.heat) * k;
    w.dry = R.clamp(w.dry + dt * (w.rain > 0.2 ? -0.01 * w.rain : w.kind === 'heat' ? 0.004 : 0.0015), 0.05, 1);
    // lightning
    this.lightning = Math.max(0, this.lightning - dt * 3);
    if (w.kind === 'storm' && R.rng() < dt * 0.08) this.strike();
    // geysers
    for (const gz of this.geysers) {
      gz.t -= dt;
      for (let k2 = 0; k2 < 3; k2++) g.fx.water(gz.x, gz.y - 4);
      this.douse(gz.x, gz.y, 30, dt * 2);
      for (const a of g.actors.near(gz.x, gz.y, 14)) if (a.kind === 'h' && !a.dead && a.state !== 'flee' && R.rng() < 0.05) g.actors.say(a, R.dialog.line('wet', a));
    }
    this.geysers = this.geysers.filter((gz) => gz.t > 0);
    // fire tick
    this.fireT -= dt;
    if (this.fireT <= 0) {
      this.fireT = 0.2;
      this.tickFire(0.2);
    }
  };

  E.strike = function () {
    const g = this.game, pl = g.player;
    this.lightning = 1;
    g.audio.sfx('thunder');
    if (R.rng() < 0.45) {
      const a = R.rng() * 6.28, d = 60 + R.rng() * 240;
      const x = pl.x + Math.cos(a) * d, y = pl.y + Math.sin(a) * d;
      g.fx.bolt(x, y);
      const tx = (x / TS) | 0, ty = (y / TS) | 0;
      const o = g.world.o(tx, ty);
      if ((o === O.TREE || o === O.PINE || o === O.DEADTREE || this.weather.rain < 0.8) && R.rng() < 0.7) this.ignite(x, y, 0.6, null);
      g.actors.noise(x, y, TS * 12, 'blast', null);
      if (R.dist(x, y, pl.x, pl.y) < 20 && !pl.inCar) pl.hurt(40, null, 'blast');
    }
  };

  // ---------------------------------------------------------------- fire
  E.flammability = function (x, y) {
    const w = this.game.world;
    const i = w.idx(x, y);
    const t = w.tile[i];
    let f = D.flammableTile[t];
    if (D.flammableObj[w.obj[i]]) f = Math.max(f, 0.9);
    if (w.bid[i]) {
      const b = w.buildings[w.bid[i]];
      f = Math.max(f, (D.btypes[b.type].fl || 0.5) * 0.35);
    }
    if (this.gas.has(i)) f = 3;
    return f;
  };
  E.ignite = function (x, y, radiusTiles, owner) {
    const w = this.game.world;
    const tx = (x / TS) | 0, ty = (y / TS) | 0;
    const r = Math.max(0.5, radiusTiles);
    for (let yy = Math.floor(ty - r); yy <= Math.ceil(ty + r); yy++)
      for (let xx = Math.floor(tx - r); xx <= Math.ceil(tx + r); xx++) {
        if (!w.inb(xx, yy) || R.dist(xx, yy, tx, ty) > r) continue;
        const fl = this.flammability(xx, yy);
        if (fl <= 0.02 && !this.gas.has(w.idx(xx, yy))) {
          // even pavement burns briefly from a molotov
          this.addFire(xx, yy, 0.35, owner);
        } else this.addFire(xx, yy, 1.2 + fl * 3, owner);
      }
  };
  E.addFire = function (x, y, fuel, owner) {
    const w = this.game.world;
    if (!w.inb(x, y) || w.isWater(x, y)) return;
    const i = w.idx(x, y);
    if (this.fires.has(i)) return;
    if (this.fires.size > 500) return;

    return list.filter((p) => p.alive && !p.actor && this.desiredKey(p) === key);
  };

  L.spawnPerson = function (p, x, y) {
    const g = this.game;
    if (p.actor || !p.alive) return p.actor;
    const h = g.actors.makeHuman(x, y, { person: p, city: p.city });
    h.tag = p.role === 'kid' || p.role === 'student' ? 'kid' : 'named';
    return h;
  };

  L.update = function (dt) {
    const g = this.game, pl = g.player;
    this.t -= dt;
    this.eventT -= dt;
    if (this.eventT <= 0) {
      // the world starts quiet and livens up as the days go by and your name spreads
      const calm = g.calm();
      this.eventT = (40 + R.rng() * 50) / Math.max(0.25, calm);
      if (R.rng() < 0.35 + calm * 0.65) R.events.random(g);
    }
    if (this.t > 0) return;
    this.t = 1.2;
    this.crews();
    const ptx = pl.x / TS, pty = pl.y / TS;
    let spawned = 0;
    const cap = 22;
    let named = 0;
    for (const a of g.actors.list) if (a.person && !a.dead) named++;
    const cities = g.world.cities.filter((c) => R.dist(ptx, pty, c.cx, c.cy) < c.nbx * 8 + 60);
    if (R.dist(ptx, pty, 0, 0) >= 0) cities.push(g.world.countyCity());
    for (const c of cities) {
      const list = g.pop.byCity[c.id] || [];
      for (const p of list) {
        if (!p.alive) continue;
        const want = this.desiredKey(p);
        if (p.actor) {
          const h = p.actor;
          if (h.dead || h.removed) { p.actor = null; continue; }
          if (h.room) continue; // the interior manages people inside
          const calm = h.state === 'idle' || h.state === 'hang' || h.state === 'wander' || h.state === 'perform' || (h.state === 'travel' && h.destKey !== want);
          if (calm && h.destKey !== want) this.route(h, want);
          continue;
        }
        if (want === 'gone') { p.place = want; continue; }
        if (p.place === want) {
          if (want && want[0] === 's' && named < cap && spawned < 4) {
            const pos = this.posOf(want);
            if (pos && R.dist(ptx, pty, pos.x, pos.y) < 34) {
              const h = this.spawnPerson(p, pos.x * TS + 8 + (R.rng() - 0.5) * 24, pos.y * TS + 8 + (R.rng() - 0.5) * 24);
              if (h) { h.spot = pos.spot; h.destKey = want; g.actors.hangAround(h); spawned++; named++; }
            }
          }
          continue;
        }
        // transition
        const from = this.posOf(p.place);
        const to = this.posOf(want);
        if (from && to && named < cap && spawned < 4 && R.dist(ptx, pty, from.x, from.y) < 34 && R.dist(from.x, from.y, to.x, to.y) < 140 && !g.world.solidPed(from.x, from.y)) {
          const h = this.spawnPerson(p, from.x * TS + 8, from.y * TS + 8);
          if (h) { this.route(h, want); spawned++; named++; }
        }
        p.place = p.actor ? p.place : want;
      }
    }
  };
  // construction crews hammer away at building sites near the player during the day
  L.crews = function () {
    const g = this.game, pl = g.player, h = g.clock.hour();
    if (h < 7 || h > 18) return;
    for (const pr of g.pop.projects) {
      const lot = pr.lot;
      const cx = (lot.x + lot.w / 2) * TS, cy = (lot.y + lot.h / 2) * TS;
      if (R.dist(cx, cy, pl.x, pl.y) > TS * 30) continue;
      pr.crew = (pr.crew || []).filter((w) => !w.dead && !w.removed);
      while (pr.crew.length < 2) {
        const w = g.actors.makeHuman(cx + (R.rng() - 0.5) * lot.w * 10, cy + (R.rng() - 0.5) * 40, { tag: 'worker', arch: R.rng.pick(['grumpy', 'friendly', 'tough']) });
        w.look.hat = 'cap'; w.look.hatCol = '#e4a92a'; w.look.top = R.rng.pick(['#d9621e', '#4a6a8a', '#8a7a5a']);
        w.state = 'work'; w.timer = 60; w.tag = 'worker';
        pr.crew.push(w);
      }
      for (const w of pr.crew) {
        if (w.state === 'work' && R.rng() < 0.15) { g.fx.sparks(w.x + 4, w.y - 6, 2); g.audio.sfx('bump', w.x, w.y); }
        if (w.state !== 'work' && w.state !== 'flee' && w.state !== 'fight' && w.state !== 'cower' && w.state !== 'talk') { w.state = 'work'; w.timer = 40; }
      }
    }
  };
  L.route = function (h, want) {
    const g = this.game;
    const to = this.posOf(want);
    h.destKey = want;
    if (!to) { h.state = 'idle'; return; }
    h.spot = null;
    g.actors.goTo(h, to.x, to.y, { enter: !!to.b, spot: to.spot, placeKey: want, near: to.b ? 8 : 14, far: true });
    h.state = 'travel';
  };

  // ---------------------------------------------------------------- street events
  const EV = (R.events = {});

  EV.mugging = function (m) {
    const g = R.game, pl = g.player;
    if (m.dead || pl.inCar || pl.inside) return;
    m.state = 'talk';
    m.timer = 12;
    m.hostile = false;
    m.drawn = true;
    g.actors.say(m, R.rng.pick(['Empty your pockets, pal.', 'Nice suit. Hand over the wallet.', 'Wallet. Now. Nobody gets hurt.', 'This is a stick-up, fancy pants.']));
    const take = Math.min(pl.cash, R.rng.int(20, 60));
    g.ui.choice(`${g.actors.displayName(m)} wants your money`, [
      { label: `Hand over ${R.fmtMoney(take)}`, fn: () => { pl.cash -= take; m.cash += take; g.actors.say(m, 'Pleasure doing business.'); g.actors.setFlee(m, pl, 10); } },
      { label: 'Intimidate', fn: () => {
        const p = 0.35 + pl.rep.infamy / 150 + (pl.weaponOut ? 0.3 : 0) + (pl.masked ? 0.1 : 0);
        if (R.rng() < p) { g.actors.say(m, R.rng.pick(['Whoa, my mistake, boss!', "You're... you're HIM. Sorry!", "Forget I said nothin'."])); g.actors.setFlee(m, pl, 12); pl.rep.infamy += 1; }
        else { g.actors.say(m, 'Wrong answer.'); m.hostile = true; g.actors.setFight(m, pl); }
      } },
      { label: 'Fight', fn: () => { m.hostile = true; g.actors.setFight(m, pl); g.ui.toast('Self-defence: no crime to fight back.', 'good'); } },
    ]);
  };
  EV.pickpocket = function (m) {
    const g = R.game, pl = g.player;
    if (m.dead || pl.inCar || pl.inside || pl.cash < 5) { m.state = 'idle'; return; }
    const amt = Math.min(pl.cash, R.rng.int(10, 45));
    pl.cash -= amt;
    m.cash += amt;
    m.stolen = amt;
    m.hostile = true;
    m.tag = 'pickpocket';
    m.alert = 'thief';
    g.actors.setFlee(m, pl, 25);
    g.ui.toast(`Your wallet feels lighter: -${R.fmtMoney(amt)}. Catch that pickpocket!`, 'bad');
    g.audio.sfx('steal');
  };
  EV.hustlerPitch = function (m) {
    const g = R.game, pl = g.player;
    if (m.dead || pl.inCar || pl.inside) return;
    m.state = 'talk';
    m.timer = 12;
    const offers = [
      { item: 'watch', price: 22, line: 'Psst. Genuine Swiss watch. Fell off a truck.' },
      { item: 'ring', price: 45, line: "Diamond ring. Don't ask where it's been." },
      { item: 'bandage', price: 5, line: 'Hospital-grade bandages. Half price.', cons: true },
      { item: 'whiskey', price: 3, line: 'Bootleg rye. Puts hair on your hair.', cons: true },
      { item: 'knuckles', price: 20, line: 'Brass knuckles. For conversations.', weap: true },
      { item: 'lockpick', price: 8, line: 'Lockpicks. For your own front door, obviously.', tool: true },
    ];
    const o = R.rng.pick(offers);
    g.actors.say(m, o.line);
    g.ui.choice(`Hustler's offer: ${o.price ? R.fmtMoney(o.price) : ''}`, [
      { label: `Buy (${R.fmtMoney(o.price)})`, fn: () => {
        if (pl.cash < o.price) return g.ui.toast("You can't cover it.", 'warn');
        pl.cash -= o.price;
        if (o.cons) pl.inv.cons[o.item] = (pl.inv.cons[o.item] || 0) + 1;
        else if (o.weap) pl.giveWeapon(o.item);
        else if (o.tool) pl.inv.tools[o.item] = (pl.inv.tools[o.item] || 0) + 1;
        else pl.inv.loot[o.item] = (pl.inv.loot[o.item] || 0) + 1;
        g.actors.say(m, 'Pleasure. We never met.');
      } },
      { label: 'Shake him down', fn: () => {
        if (R.rng() < 0.5 + pl.rep.infamy / 200) { const c = m.cash + 10; pl.addCash(c); m.cash = 0; g.actors.say(m, 'Okay okay! Take it!'); g.actors.setFlee(m, pl, 10); g.law.crime('mugging', m.x, m.y, { victim: m }); }
        else { g.actors.say(m, 'You picked the wrong hustler.'); m.hostile = true; g.actors.setFight(m, pl); }
      } },
      { label: 'Walk away', fn: () => { g.actors.say(m, 'Your loss, sport.'); m.state = 'idle'; } },
    ]);
  };

  EV.random = function (g) {
    const pl = g.player;
    if (pl.inside || g.law.active()) return;
    const w = g.world;
    const city = w.cityAt((pl.x / TS) | 0, (pl.y / TS) | 0);
    const hour = g.clock.hour();
    const roll = R.rng();
    const calm = g.calm();
    const rough = calm * calm; // violent events ramp in slower than friendly ones
    if (city) {
      const evs = [
        ['brawl', (hour > 20 || hour < 3 ? 3 : 0.6) * rough],
        ['robbery', 1 * rough],
        ['newsboy', hour > 6 && hour < 12 ? 2 : 0.4],
        ['party', hour > 21 || hour < 3 ? 1.6 : 0],
        ['wedding', g.pop.news.some((n) => n.city === city.id && n.day === g.pop.day && /Wedding/.test(n.text)) && hour > 10 && hour < 18 ? 3 : 0],
        ['footchase', 0.8 * rough],
        ['crash', 0.7 * calm],
        ['nothing', 2],
      ];
      const ev = R.rng.weighted(evs.filter((e) => e[1] > 0).map(([k, v]) => [k, v * (k === 'nothing' ? 1 : g.settings.events)]));
      if (EV[ev]) EV[ev](g, city);
    } else {
      const ev = R.rng.weighted([['hitchhiker', 1.3], ['ambush', 0.6 * rough], ['predator', 1 * rough], ['nothing', 2.5]].map(([k, v]) => [k, v * (k === 'nothing' ? 1 : g.settings.events)]));
      if (EV[ev]) EV[ev](g);
    }
  };
  const spotNear = (g, rmin, rmax, pred) => g.world.findNear(g.player.x / TS, g.player.y / TS, rmin, rmax, pred || ((x, y) => { const t = g.world.t(x, y); return (t === T.WALK || t === T.PLAZA) && !g.world.solidPed(x, y); }));

  EV.brawl = function (g) {
    const s = spotNear(g, 8, 14);
    if (!s) return;
    const a = g.actors.makeHuman(s.x * TS + 4, s.y * TS + 8, { arch: 'tough', drunk: 1 });
    const b = g.actors.makeHuman(s.x * TS + 16, s.y * TS + 8, { arch: 'grumpy', drunk: 1 });
    a.hostileLocked = b.hostileLocked = true;
    a.tr.brave = b.tr.brave = 0.9;
    g.actors.setFight(a, b);
    g.actors.setFight(b, a);
    a.hostile = b.hostile = false;
    g.actors.say(a, R.rng.pick(['You spilled my drink!', 'Say that about my mother again!', "She was MY date!"]));
    g.actors.say(b, R.rng.pick(['Come on then!', "I'll knock your block off!"]));
    g.actors.noise(a.x, a.y, TS * 8, 'fight', a);
    g.ui.toast('A drunken brawl broke out nearby.');
  };
  EV.robbery = function (g, city) {
    const shops = city.buildings.filter((b) => D.btypes[b.type].rob && !b.destroyed && R.dist(b.out.x, b.out.y, g.player.x / TS, g.player.y / TS) < 22 && R.dist(b.out.x, b.out.y, g.player.x / TS, g.player.y / TS) > 6);
    if (!shops.length) return;
    const b = R.rng.pick(shops);
    const robber = g.actors.makeHuman(b.out.x * TS + 8, b.out.y * TS + 8, { tag: 'robber', weapon: 'revolver', arch: 'hustler' });
    robber.look.mask = true;
    robber.cash = R.rng.int(80, 200);
    robber.hostile = true;
    robber.alert = 'thief';
    robber.bounty = true;
    g.actors.setFlee(robber, { x: b.door.x * TS, y: b.door.y * TS }, 30);
    g.actors.say(robber, 'Outta my way!');
    const clerk = g.actors.makeHuman(b.out.x * TS + 12, b.out.y * TS + 12, {});
    clerk.state = 'idle'; clerk.timer = 8;
    g.actors.say(clerk, `Help! He robbed ${b.name}! Stop him!`);
    g.ui.toast(`${b.name} just got robbed. Stop the masked thief for a reward.`, 'warn');
    robber.onDeathReward = { b, amt: 60 };
  };
  EV.newsboy = function (g, city) {
    const s = spotNear(g, 6, 12);
    if (!s) return;
    const h = g.actors.makeHuman(s.x * TS + 8, s.y * TS + 8, { kid: true, tag: 'kid' });
    h.look.hat = 'cap'; h.look.hatCol = '#6a4a2a';
    const news = g.pop.news.filter((n) => n.city === city.id).slice(0, 3);
    const n = news.length ? R.rng.pick(news) : { text: 'Disco still not dead!' };
    h.state = 'idle'; h.timer = 12;
    g.actors.say(h, `Extra! Extra! ${n.text}`, 5, '#e4a92a');
  };
  EV.party = function (g, city) {
    const club = city.buildings.find((b) => (b.type === 'club' || b.type === 'bar') && R.dist(b.out.x, b.out.y, g.player.x / TS, g.player.y / TS) < 20);
    if (!club) return;
    const n = R.rng.int(4, 7);
    for (let k = 0; k < n; k++) {
      const h = g.actors.makeHuman(club.out.x * TS + 8 + (R.rng() - 0.5) * 50, club.out.y * TS + 8 + (R.rng() - 0.5) * 30, { arch: R.rng.pick(['flirt', 'friendly', 'eccentric']) });
      h.state = 'perform';
      h.role = 'dancer';
      h.timer = 30 + R.rng() * 20;
      h.look.top = R.rng.pick(['#e040a0', '#e4a92a', '#2a7d7a', '#f0f0f0', '#d9621e']);
    }
    g.ui.toast(`Block party spilling out of ${club.name}.`);
  };
  EV.wedding = function (g, city) {
    const church = city.buildings.find((b) => b.type === 'church');
    if (!church || R.dist(church.out.x, church.out.y, g.player.x / TS, g.player.y / TS) > 30) return;
    for (let k = 0; k < 8; k++) {
      const h = g.actors.makeHuman(church.out.x * TS + 8 + (R.rng() - 0.5) * 60, church.out.y * TS + 12 + R.rng() * 20, { arch: 'friendly' });
      h.state = 'watch';
      h.watchKind = 'wedding';
      h.watchT = { x: church.out.x * TS + 8, y: church.out.y * TS + 8 };
      h.timer = 40;
      if (k === 0) { h.look.top = '#f8f4ec'; h.look.dress = true; h.look.fem = true; }
      if (k === 1) { h.look.top = '#1a1a1a'; h.look.lapel = '#f0f0f0'; h.look.fem = false; }
    }
    g.ui.toast(`Wedding bells at ${church.name}.`);
  };
  EV.footchase = function (g, city) {
    const s = spotNear(g, 10, 16);
    if (!s) return;
    const perp = g.actors.makeHuman(s.x * TS + 8, s.y * TS + 8, { tag: 'robber', arch: 'hustler' });
    perp.hostile = true;
    perp.cash = R.rng.int(30, 90);
    perp.loot.push('watch');
    perp.alert = 'thief';
    const cop = g.actors.makeHuman(s.x * TS + 8 - 40, s.y * TS + 8, { cop: true, role: 'cop' });
    cop.look = g.pop.makeLook(R.mulberry(R.rng.int(0, 1e9)), { fem: false, age: 40, role: 'cop', city: city.id });
    g.actors.setFlee(perp, cop, 25);
    g.actors.setFight(cop, perp);
    cop.hostile = false;
    g.actors.say(cop, 'Stop! Police!');
    perp.onDeathReward = { amt: 30 };
  };
  EV.crash = function (g) {
    const cars = g.traffic.list.filter((v) => v.driver && v.driver !== g.player && v.mode === 'lane' && !g.cam.onScreen(v.x, v.y, -20) && R.dist(v.x, v.y, g.player.x, g.player.y) < TS * 18);
    if (!cars.length) return;
    const v = R.rng.pick(cars);
    v.ai.reckless = true;
    v.mode = 'chase';
    v.ai.wanderT = 4;
    v.ai.dest = null;
  };
  EV.hitchhiker = function (g) {
    const s = g.world.findNear(g.player.x / TS, g.player.y / TS, 8, 16, (x, y) => { const t = g.world.t(x, y); return !D.roadTile[t] && !g.world.solidPed(x, y) && D.roadTile[g.world.t(x + 1, y)]; });
    if (!s) return;
    const h = g.actors.makeHuman(s.x * TS + 8, s.y * TS + 8, { arch: R.rng.pick(['friendly', 'eccentric', 'gossip']) });
    h.tag = 'hitch';
    h.keep = true;
    const dest = R.rng.pick(g.world.cities);
    h.hitchDest = dest;
    h.state = 'idle';
    h.timer = 60;
    g.actors.say(h, `Ride to ${dest.name}? I can pay!`, 6);
    g.ui.toast(`A hitchhiker needs a ride to ${dest.name}. Stop your car next to them and honk.`);
  };
  EV.ambush = function (g) {
    const s = g.world.findNear(g.player.x / TS, g.player.y / TS, 12, 18, (x, y) => !g.world.solidPed(x, y) && !g.world.isWater(x, y));
    if (!s) return;
    const lure = g.actors.makeHuman(s.x * TS + 8, s.y * TS + 8, { arch: 'hustler', weapon: 'revolver' });
    lure.tag = 'lure';
    lure.drawn = false;
    g.actors.say(lure, 'Help! My car broke down! Please!', 5);
    lure.state = 'follow';
    lure.timer = 40;
    lure.onReach = (m) => {
      if (R.rng() < 0.55) {
        g.actors.say(m, 'Sucker. Boys, now!');
        m.hostile = true;
        g.actors.setFight(m, g.player);
        for (let k = 0; k < 2; k++) {
          const b = g.actors.makeHuman(m.x + (k ? 40 : -40), m.y + 30, { weapon: R.rng.pick(['bat', 'revolver', 'knife']), arch: 'tough' });
          b.hostile = true;
          g.actors.setFight(b, g.player);
        }
        g.ui.toast('Roadside ambush!', 'bad');
      } else {
        g.actors.say(m, "Oh thank God. Here, for your trouble. Don't tell my wife I was out here.");
        g.player.addCash(R.rng.int(10, 30));
        g.player.rep.honor += 2;
        m.state = 'idle';
      }
    };
  };
  EV.predator = function (g) {
    const s = g.world.findNear(g.player.x / TS, g.player.y / TS, 10, 16, (x, y) => !g.world.solidPed(x, y) && !g.world.isWater(x, y) && !D.roadTile[g.world.t(x, y)]);
    if (!s) return;
    const biome = g.world.biomeAt(s.x, s.y);
    const type = biome === 'marsh' ? 'gator' : biome === 'desert' ? 'coyote' : biome === 'forest' || biome === 'snow' ? (R.rng() < 0.3 ? 'bear' : 'wolf') : 'coyote';
    const victim = g.actors.makeHuman(s.x * TS + 8, s.y * TS + 8, { arch: 'timid' });
    victim.role = 'hunter';
    g.actors.say(victim, 'HELP! Somebody help me!', 5);
    const n = type === 'wolf' || type === 'coyote' ? 3 : 1;
    for (let k = 0; k < n; k++) {
      const a = g.actors.makeAnimal(victim.x + 40 + k * 10, victim.y + (k - 1) * 16, type);
      a.state = 'attack';
      a.target = victim;
      a.timer = 25;
    }
    g.actors.setFlee(victim, { x: victim.x + 40, y: victim.y }, 20);
    victim.onSavedReward = true;
    victim.keep = true;
    g.ui.toast('Someone is being attacked by animals nearby!');
  };
})();

// ---- 11_dialog.js
// RHAPSODY — dialogue. RDR2-style Greet / Antagonize / Defuse with personality-driven
// reactions, plus scripted talk trees by role. No free text: every exchange is a choice.
'use strict';
(function () {
  const D = R.data, TS = R.TILE;
  const G = () => R.game;
  const pick = (a) => a[Math.floor(R.rng() * a.length)];

  const L = {
    woken: ["Who's there?!", 'Honey, wake up! Someone\'s in the house!', 'I got a bat and I know how to use it!', 'Burglar! BURGLAR!'],
    getup: ['Ugh... my head.', 'What hit me?', 'Where am I?', "I'm calling my lawyer."],
    fleeing: ["He's crazy!", 'Run!', 'Somebody call the cops!', 'Not today, not today!', 'Mama!'],
    cower: ["Don't shoot! Please!", 'I got kids!', "I didn't see nothing!", 'Take whatever you want!', 'Please, mister...'],
    seeGun: ['Gun! He\'s got a gun!', 'Whoa, whoa, put that away!', "I'm outta here."],
    standoff: ["You don't scare me.", 'Go ahead. Try it.', 'Two can play that game.'],
    seeMask: ['Little early for Halloween, pal.', 'Why the mask?', "I don't like the look of this."],
    rivalSpot: ["That's one of Vane's boys!", 'Wrong side of town, mook.', 'Get him!'],
    grudge: ['You! You killed my family!', "I know what you did. You're gonna pay.", 'Murderer!'],
    copWarnGun: ['Holster that weapon. Now.', 'Put it away, pal.', "Don't make me draw on you."],
    copWarnMinor: ["I saw that. Don't let me see it again.", 'Knock it off, or you\'re coming downtown.', 'Last warning, wise guy.'],
    copSaw: ['Police! Freeze!', 'Hold it right there!', "That's it, you're under arrest!"],
    copOk: ['Smart choice.', 'Keep it that way.'],
    copInvestigate: ['Shots fired, checking it out.', 'What was that?', 'Dispatch, investigating a disturbance.'],
    recognise: ["Hold on... I know that face.", 'You match a description.', "Well well. Look who's wanted."],
    arrest: ['Hands where I can see them!', "You're under arrest. Don't make this harder.", 'On your knees. Slowly.'],
    radio: ['Unit responding, code three.', 'En route to the last known location.', 'Copy that, rolling.'],
    reportCop: ['Officer! That man just— he did something terrible!', "Officer, I saw it all! It was a big guy in a fedora!"],
    reportPhone: ['Operator? Get me the police!', 'Hello, police? I need to report a crime!', 'Yes, I saw the whole thing. Hurry!'],
