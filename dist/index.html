<style>
:root {
  color-scheme: dark;
  --ink: #2a1a12; --paper: #f6ecd0; --paper2: #e8d8b0; --frame: #7a3a18; --red: #c83a2a; --gold: #f0b838; --green: #6a9a30;
  --text: #3a2418; --muted: #7a5e44; --night: #140c0a; --shell: #4a3024; --orange: #d9621e; --teal: #2a7d7a; --plum: #5c2a4a;
  --pix: "Silkscreen", "Courier New", monospace;
  --read: "Pixelify Sans", "Trebuchet MS", sans-serif;
  --safeT: env(safe-area-inset-top, 0px); --safeB: env(safe-area-inset-bottom, 0px);
  --safeL: env(safe-area-inset-left, 0px); --safeR: env(safe-area-inset-right, 0px);
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--night); color: var(--paper); font-family: var(--read); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
  background-image: radial-gradient(rgba(122,58,24,0.18) 1px, transparent 1.2px); background-size: 6px 6px; }
button { font-family: var(--pix); color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- console layout ---------- */
#app { position: fixed; inset: 0; display: grid; gap: 10px; align-items: center; justify-items: center; padding: calc(8px + var(--safeT)) calc(8px + var(--safeR)) calc(8px + var(--safeB)) calc(8px + var(--safeL)); box-sizing: border-box; }
#app.landscape { grid-template-columns: 1fr auto 1fr; grid-template-areas: "L S R"; }
#app.portrait { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr; grid-template-areas: "S S" "C C" "L R"; align-items: start; row-gap: 12px; }
.stage { grid-area: S; position: relative; aspect-ratio: 3 / 2; container-type: inline-size; overflow: hidden; background: var(--night);
  box-shadow: 0 0 0 4px var(--ink), 0 0 0 10px var(--frame), 0 0 0 13px var(--shell), 0 0 0 16px var(--ink), 0 12px 30px rgba(0,0,0,0.6); border-radius: 2px; }
#app.landscape { --sh: min(calc(100vh - 44px - var(--safeT) - var(--safeB)), calc((100vw - 330px) / 1.5)); }
#app.landscape .stage { height: var(--sh); width: calc(var(--sh) * 1.5); }
#app.portrait { --sw: min(calc(100vw - 36px), calc(52vh * 1.5)); }
#app.portrait .stage { width: var(--sw); height: calc(var(--sw) / 1.5); margin-top: 8px; }
#view { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }

/* ---------- HUD inside the screen (sizes follow the screen width) ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; font-size: max(9px, 2.6cqw); }
.box { position: absolute; background: var(--paper); color: var(--text); border: 0.35em solid var(--ink); border-radius: 0.5em; padding: 0.35em 0.7em 0.4em;
  box-shadow: inset 0 0.35em 0 var(--orange), inset 0 0.6em 0 var(--gold), 0 0.3em 0 rgba(20,12,10,0.55); line-height: 1.1; }
.box.plain { box-shadow: 0 0.3em 0 rgba(20,12,10,0.55); }
#hudL { left: 2.2%; top: 3%; padding-top: 0.75em; pointer-events: auto; cursor: pointer; }
#hearts { display: flex; gap: 0.15em; height: 1.2em; }
.heart { width: 1.15em; height: 1.05em; }
#money { font-family: var(--pix); font-size: 1em; margin-top: 0.25em; white-space: nowrap; }
#money b { color: #3a7a20; font-weight: 400; }
#hudR { right: 2.2%; top: 3%; padding-top: 0.75em; text-align: right; font-family: var(--pix); white-space: nowrap; }
#wpnName { font-size: 1em; }
#wpnAmmo { font-size: 0.75em; color: var(--muted); }
#coolBox { right: 2.2%; top: 20%; font-family: var(--pix); font-size: 0.8em; display: flex; align-items: center; gap: 0.4em; white-space: nowrap; }
.meter { width: 4.6em; height: 0.75em; border: 0.18em solid var(--ink); background: #d8c8a0; }
.meter i { display: block; height: 100%; width: 50%; background: linear-gradient(180deg, #6ac0e0, var(--teal)); }
#obj { left: 2.2%; top: 23%; max-width: 46%; font-family: var(--read); font-size: 0.85em; padding: 0.25em 0.55em; }
#obj:empty, #obj[hidden] { display: none; }
#obj .d { color: var(--red); font-family: var(--pix); font-size: 0.85em; }
#banner { left: 50%; top: 3%; transform: translateX(-50%); font-family: var(--read); font-weight: 600; font-size: 1.05em; padding: 0.3em 0.9em; opacity: 0; transition: opacity 0.4s; white-space: nowrap; }
#banner.on { opacity: 1; }
#banner small { display: block; font-family: var(--pix); font-weight: 400; font-size: 0.65em; color: var(--muted); text-align: center; }
#wanted { left: 50%; top: 3%; transform: translateX(-50%); background: var(--red); color: var(--paper); font-family: var(--pix); text-align: center; padding: 0.3em 0.8em; display: none; white-space: nowrap; box-shadow: 0 0.3em 0 rgba(20,12,10,0.55); }
#wanted b { display: block; font-weight: 400; font-size: 0.95em; }
#wanted span { font-size: 0.7em; }
#wanted.search { background: var(--gold); color: var(--ink); }
#wanted.pulse { animation: pulse 0.8s steps(2) infinite; }

<script>
// ---- 00_core.js
// RHAPSODY — core utilities. Every module hangs off the global `R` namespace so the
// game can ship as one inlined HTML file without a bundler.
'use strict';
const R = (window.R = window.R || {});

R.TILE = 16;
R.DIRS = [ [0, -1], [1, 0], [0, 1], [-1, 0] ]; // N E S W
R.FLOW = { N: 1, E: 2, S: 4, W: 8, X: 16 }; // X = intersection tile
R.DIRBIT = [1, 2, 4, 8];

// ---------- random ----------
R.mulberry = function (seed) {
  let a = seed >>> 0;
  const f = function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.int = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.chance = (p) => f() < p;
  f.range = (lo, hi) => lo + f() * (hi - lo);
  f.weighted = (pairs) => {
    if (!pairs || !pairs.length) return undefined;
    let tot = 0;
    for (const p of pairs) tot += p[1];
    let r = f() * tot;
    for (const p of pairs) if ((r -= p[1]) <= 0) return p[0];
    return pairs[pairs.length - 1][0];
  };
  f.shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(f() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  return f;
};
R.rng = R.mulberry(Date.now() & 0xffffffff); // runtime randomness (non-deterministic)

R.hash2 = function (x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s | 0) * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
R.strHash = function (s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
};

// ---------- value noise ----------
R.makeNoise = function (seed) {
  const smooth = (t) => t * t * (3 - 2 * t);
  const n = function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const a = R.hash2(xi, yi, seed), b = R.hash2(xi + 1, yi, seed);
    const c = R.hash2(xi, yi + 1, seed), d = R.hash2(xi + 1, yi + 1, seed);
    const u = smooth(xf), v = smooth(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  n.fbm = function (x, y, oct) {
    let amp = 1, freq = 1, sum = 0, norm = 0;
    for (let i = 0; i < (oct || 4); i++) {
      sum += amp * n(x * freq, y * freq);
      norm += amp;
      amp *= 0.5;
      freq *= 2.03;
    }
    return sum / norm;
  };
  return n;
};

// ---------- math ----------
R.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
R.lerp = (a, b, t) => a + (b - a) * t;
R.dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
R.dist2 = (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay);
R.angDiff = function (a, b) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
};
R.approach = (v, target, step) => (v < target ? Math.min(target, v + step) : Math.max(target, v - step));
R.dir4 = function (dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 1 : 3;
  return dy > 0 ? 2 : 0;
};
R.fmtMoney = (n) => '$' + Math.floor(n).toLocaleString('en-US');

// ---------- events ----------
R.bus = {
  map: new Map(),
  on(ev, fn) {
    if (!this.map.has(ev)) this.map.set(ev, []);
    this.map.get(ev).push(fn);
  },
  emit(ev, ...args) {
    const l = this.map.get(ev);
    if (l) for (const fn of l.slice()) fn(...args);
  },
};

// ---------- spatial hash for actors ----------
R.SpatialHash = class {
  constructor(cell) {
    this.cell = cell;
    this.map = new Map();
  }
  clear() {
    this.map.clear();
  }
  key(cx, cy) {
    return cx * 73856093 ^ cy * 19349663;
  }
  insert(o) {
    const k = this.key(Math.floor(o.x / this.cell), Math.floor(o.y / this.cell));
    let b = this.map.get(k);
    if (!b) this.map.set(k, (b = []));
    b.push(o);
  }
  query(x, y, r, out) {
    out = out || [];
    const c = this.cell;
    const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
    const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
    const r2 = r * r;
    for (let cx = x0; cx <= x1; cx++)
      for (let cy = y0; cy <= y1; cy++) {
        const b = this.map.get(this.key(cx, cy));
        if (!b) continue;
        for (const o of b) if (R.dist2(x, y, o.x, o.y) <= r2) out.push(o);
      }
    return out;
  }
};

// ---------- safe storage ----------
R.store = {
  get(k) {
    try {
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : null;
    } catch (e) {
      return null;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(k, JSON.stringify(v));
      return true;
    } catch (e) {
      return false;
    }
  },
  del(k) {
    try {
      localStorage.removeItem(k);
    } catch (e) {}
  },
};

// ---- 01_data.js

  const D = (R.data = {});

// ---- 02_world.js
// RHAPSODY — procedural world: coastline, biomes, rivers, five cities on street grids,
// hamlets, highways with lane-flow data for traffic, farms, cabins and street furniture.
'use strict';
(function () {
  const D = R.data, T = D.T, O = D.O, F = R.FLOW;
  // City block pitch: BS tiles of block + 2 tiles of road. Blocks are deep enough for
  // two facing rows of buildings RD tiles deep, RL tiles long, with a sidewalk ring.
  const RW = 4; // road width in tiles: two lanes each way
  const P = 22 + RW;
  const BS = P - RW, RD = (BS - 2) >> 1, RL = BS - 2;

  function World(seed) {
    this.seed = seed;
    this.W = 880;
    this.H = 880; // outdoor map height
    this.IH = 64; // hidden strip below the map where interiors are stamped
    this.TH = this.H + this.IH;
    const N = this.W * this.TH;
    this.tile = new Uint8Array(N);
    this.obj = new Uint8Array(N);
    this.flow = new Uint8Array(N);
    this.bid = new Uint16Array(N); // building id + 1
    this.zone = new Uint8Array(N); // city index + 1 (0 = county)
    this.dirty = new Set(); // chunk keys needing re-render
    this.buildings = [null];
    this.lots = [];
    this.inters = [];
    this.interAt = new Map();
    this.cities = [];
    this.hamlets = [];
    this.spots = []; // outdoor hangout spots for named NPCs
    this.phones = [];
    this.gen();
  }
  const W = World.prototype;
  W.idx = function (x, y) { return y * this.W + x; };
  W.inb = function (x, y) { return x >= 0 && y >= 0 && x < this.W && y < this.TH; };
  W.t = function (x, y) { return this.inb(x, y) ? this.tile[y * this.W + x] : T.DEEP; };
  W.o = function (x, y) { return this.inb(x, y) ? this.obj[y * this.W + x] : 0; };
  W.setT = function (x, y, t) {
    if (!this.inb(x, y)) return;
    this.tile[y * this.W + x] = t;
    this.markDirty(x, y);
  };
  W.setO = function (x, y, o) {
    if (!this.inb(x, y)) return;
    this.obj[y * this.W + x] = o;
    this.markDirty(x, y);
  };
  W.markDirty = function (x, y) {
    if (this.genDone) this.dirty.add(((x >> 5) << 16) | (y >> 5));
  };
  // Pedestrian collision
  W.solidPed = function (x, y) {
    if (!this.inb(x, y)) return true;
    const i = y * this.W + x;
    const t = this.tile[i];
    return D.solidTile[t] === 1 || D.solidObj[this.obj[i]] === 1 || t === T.DEEP;
  };
  // Vehicle collision
  W.solidCar = function (x, y) {
    if (!this.inb(x, y)) return true;
    const i = y * this.W + x;
    const t = this.tile[i];
    return D.solidTile[t] === 1 || D.solidObj[this.obj[i]] === 1 || D.waterTile[t] === 1;
  };
  W.isWater = function (x, y) { return D.waterTile[this.t(x, y)] === 1; };
  W.cityAt = function (tx, ty) {
    const z = this.inb(tx, ty) ? this.zone[ty * this.W + tx] : 0;
    return z ? this.cities[z - 1] : null;
  };
  W.buildingAt = function (tx, ty) {
    const b = this.inb(tx, ty) ? this.bid[ty * this.W + tx] : 0;
    return b ? this.buildings[b] : null;
  };
  W.biomeAt = function (tx, ty) {
    const t = this.t(tx, ty);
    if (this.cityAt(tx, ty)) return 'city';
    switch (t) {
      case T.FOREST: return 'forest';
      case T.DESERT: return 'desert';
      case T.MARSH: return 'marsh';
      case T.SNOW: return 'snow';
      case T.FIELD: return 'field';
      case T.SAND: return 'coast';
      case T.WATER: case T.DEEP: return 'water';
      default: return 'grass';
    }
  };

  // ------------------------------------------------------------------
  W.gen = function () {
    const rnd = (this.rnd = R.mulberry(this.seed));
    this.tile.fill(T.VOID, this.W * this.H);
    this.planCities(rnd);
    this.genTerrain(rnd);
    this.genRiver(rnd);
    for (const c of this.cities) this.genCity(c, rnd);
    this.genHighways(rnd);
    this.genCountryside(rnd);
    this.finishRoads();
    this.genFurniture(rnd);
    this.genDone = true;
  };

  W.planCities = function (rnd) {
    const sizes = { port: [7, 7], avalon: [9, 8], dust: [5, 5], pine: [5, 4], bayou: [5, 5] };
    D.cities.forEach((def, i) => {
      const [nbx, nby] = sizes[def.id];
      const cx = Math.round(def.fx * this.W), cy = Math.round(def.fy * this.H);
      const x0 = cx - Math.floor((nbx * P) / 2), y0 = cy - Math.floor((nby * P) / 2);
      this.cities.push({
        idx: i, id: def.id, name: def.name, def, x0, y0, nbx, nby,
        x1: x0 + nbx * P + RW - 1, y1: y0 + nby * P + RW - 1,
        rowY: y0 + Math.floor(nby / 2) * P, colX: x0 + Math.floor(nbx / 2) * P,
        cx, cy, buildings: [], lots: [], hamlet: false,
        prosperity: 55, fear: 0, heat: 0, growth: 0, // live stats
      });
    });
    D.hamlets.forEach((h, i) => {
      const nb = 2;
      const cx = Math.round(h.fx * this.W), cy = Math.round(h.fy * this.H);
      const x0 = cx - P, y0 = cy - P;
      this.hamlets.push({
        idx: -1, id: 'ham' + i, name: h.name, def: { family: null, color: '#a08060', biome: 'hamlet' }, x0, y0, nbx: nb, nby: nb,
        x1: x0 + nb * P + RW - 1, y1: y0 + nb * P + RW - 1, rowY: y0 + P, colX: x0 + P, cx, cy, buildings: [], lots: [], hamlet: true,
        prosperity: 40, fear: 0, heat: 0, growth: 0,
      });
    });
  };

  W.inCityRect = function (x, y, m) {
    for (const c of this.cities.concat(this.hamlets))
      if (x >= c.x0 - m && x <= c.x1 + m && y >= c.y0 - m && y <= c.y1 + m) return c;
    return null;
  };

  W.genTerrain = function (rnd) {
    const nE = R.makeNoise(this.seed + 11), nM = R.makeNoise(this.seed + 23), nC = R.makeNoise(this.seed + 37);
    const w = this.W, h = this.H;
    const port = this.cities[0];
    for (let y = 0; y < h; y++) {
      const coastX = w * (0.075 + 0.045 * nC.fbm(y / 70, 3.3, 3)) + (y > h * 0.75 ? (y - h * 0.75) * 0.25 : 0);
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        const fx = x / w, fy = y / h;
        let e = nE.fbm(x / 95, y / 95, 5);
        e += Math.pow(Math.max(0, 0.32 - fy), 1.4) * 1.7; // northern range
        e += Math.max(0, fx - 0.88) * 2.2; // eastern ridge
        let m = nM.fbm(x / 80, y / 80, 4);
        m += (0.5 - fx) * 0.3;
        // coast: ocean on the west, bending south
        let coast = coastX;
        if (y > port.y0 - 10 && y < port.y1 + 10) coast = Math.min(coast, port.x0 + P + RW - 6); // harbor inlet
        const sea = x - coast;
        const southSea = fy > 0.955 + 0.02 * nC(x / 40, 9) && fx < 0.5;
        let t;
        if (sea < 0 || southSea) t = sea < -5 || southSea ? T.DEEP : T.WATER;
        else if (sea < 3) t = T.SAND;
        else {
          const desert = (fx - 0.55) * 2.2 + (fy - 0.5) * 2.0 - m * 0.8;
          const marshC = 1 - R.dist(fx, fy, 0.25, 0.83) / 0.2 + (nM(x / 25, y / 25) - 0.5) * 0.6;
          if (e > 0.86) t = T.ROCK;
          else if (fy < 0.17 && e > 0.7) t = T.SNOW;
          else if (marshC > 0.35) t = nM(x / 9, y / 9) > 0.72 ? T.WATER : T.MARSH;
          else if (desert > 0.7) t = T.DESERT;
          else if (m > 0.54 || (fy < 0.3 && m > 0.44)) t = T.FOREST;
          else if (desert > 0.45 && nM(x / 12, y / 12) > 0.5) t = T.DIRT;
          else t = T.GRASS;
        }
        this.tile[i] = t;
        // scatter
        const r = R.hash2(x, y, this.seed + 5);
        let o = 0;
        if (t === T.FOREST) o = r < 0.36 ? (fy < 0.35 || e > 0.6 ? O.PINE : r < 0.2 ? O.TREE : O.PINE) : r < 0.42 ? O.BUSH : 0;
        else if (t === T.GRASS) o = r < 0.018 ? O.TREE : r < 0.03 ? O.BUSH : r < 0.034 ? O.BOULDER : r < 0.04 ? O.FLOWERS : 0;
        else if (t === T.DESERT) o = r < 0.012 ? O.CACTUS : r < 0.018 ? O.BOULDER : r < 0.021 ? O.DEADTREE : 0;
        else if (t === T.MARSH) o = r < 0.12 ? O.REED : r < 0.15 ? O.DEADTREE : r < 0.18 ? O.TREE : 0;
        else if (t === T.SNOW) o = r < 0.14 ? O.PINE : r < 0.16 ? O.BOULDER : 0;
        else if (t === T.SAND) o = r < 0.01 && fy > 0.6 ? O.PALM : 0;
        else if (t === T.DIRT) o = r < 0.02 ? O.BOULDER : r < 0.03 ? O.BUSH : 0;
        this.obj[i] = o;
      }
    }
    // clear land under settlements
    for (const c of this.cities.concat(this.hamlets)) {
      for (let y = c.y0 - 3; y <= c.y1 + 3; y++)
        for (let x = c.x0 - 3; x <= c.x1 + 3; x++) {
          if (!this.inb(x, y)) continue;
          const i = y * w + x;
          if (c.id === 'port' && x < c.x0 + P + RW) continue; // docks handled in genCity
          const t = this.tile[i];
          this.tile[i] = c.def.biome === 'desert' ? T.DESERT : t === T.SNOW ? T.SNOW : T.GRASS;
          if (c.def.biome === 'marsh' && t === T.MARSH) this.tile[i] = T.GRASS;
          this.obj[i] = 0;
          this.zone[i] = c.hamlet ? 0 : c.idx + 1;
        }
      // jurisdiction margin
      if (!c.hamlet)
        for (let y = c.y0 - 18; y <= c.y1 + 18; y++)
          for (let x = c.x0 - 18; x <= c.x1 + 18; x++) if (this.inb(x, y)) this.zone[y * w + x] = c.idx + 1;
    }
  };

  W.genRiver = function (rnd) {
    const pts = [[0.71, -0.02], [0.73, 0.2], [0.7, 0.4], [0.705, 0.62], [0.6, 0.86], [0.55, 1.03]];
    const nR = R.makeNoise(this.seed + 99);
    for (let s = 0; s < pts.length - 1; s++) {
      const [ax, ay] = pts[s], [bx, by] = pts[s + 1];
      const steps = Math.ceil(R.dist(ax * this.W, ay * this.H, bx * this.W, by * this.H));
      for (let k = 0; k <= steps; k++) {
        const t = k / steps;
        let x = R.lerp(ax, bx, t) * this.W, y = R.lerp(ay, by, t) * this.H;
        x += (nR(y / 30, 1) - 0.5) * 22;
        const width = 3 + nR(x / 20, y / 20) * 3;
        for (let dy = -width; dy <= width; dy++)
          for (let dx = -width; dx <= width; dx++) {
            const px = Math.round(x + dx), py = Math.round(y + dy);
            if (!this.inb(px, py) || this.inCityRect(px, py, 2)) continue;
            const d = Math.hypot(dx, dy);
            const i = py * this.W + px;
            if (d < width - 1.2) {
              this.tile[i] = d < width - 2.5 ? T.DEEP : T.WATER;
              this.obj[i] = 0;
            } else if (d < width + 0.5 && !D.waterTile[this.tile[i]] && this.tile[i] !== T.ROCK) {
              this.tile[i] = this.tile[i] === T.DESERT ? T.SAND : this.tile[i];
              if (this.obj[i] === O.CACTUS) this.obj[i] = 0;
              if (R.hash2(px, py, 3) < 0.25) this.obj[i] = O.REED;
            }
          }
      }
    }
    // Pinecrest lake
    const lx = 0.43 * this.W, ly = 0.14 * this.H;
    for (let y = -16; y <= 16; y++)
      for (let x = -24; x <= 24; x++) {
        const d = Math.hypot(x / 24, y / 16) + (nR((lx + x) / 8, (ly + y) / 8) - 0.5) * 0.25;
        const px = Math.round(lx + x), py = Math.round(ly + y);
        if (!this.inb(px, py) || this.inCityRect(px, py, 2)) continue;
        const i = py * this.W + px;
        if (d < 0.75) { this.tile[i] = d < 0.5 ? T.DEEP : T.WATER; this.obj[i] = 0; }
        else if (d < 0.85) { this.tile[i] = T.SAND; this.obj[i] = 0; }
      }
  };

  // Lay a two-lane road. Horizontal: row y = westbound, y+1 = eastbound.
  // Vertical: col x = southbound, x+1 = northbound. (drive on the right)
  W.layH = function (xa, xb, y, type) {
    const x0 = Math.min(xa, xb), x1 = Math.max(xa, xb);
    for (let x = x0; x <= x1; x++)
      for (let k = 0; k < RW; k++) this.paveRoad(x, y + k, k < RW / 2 ? F.W : F.E, type);
  };
  W.layV = function (x, ya, yb, type) {
    const y0 = Math.min(ya, yb), y1 = Math.max(ya, yb);
    for (let y = y0; y <= y1; y++)
      for (let k = 0; k < RW; k++) this.paveRoad(x + k, y, k < RW / 2 ? F.S : F.N, type);
  };
  W.paveRoad = function (x, y, flow, type) {
    if (!this.inb(x, y)) return;
    const i = y * this.W + x;
    const t = this.tile[i];
    if (t === T.BLDG) return;
    if (D.waterTile[t] || t === T.BRIDGE) this.tile[i] = T.BRIDGE;
    else if (t === T.ROAD) {} // keep city pavement
    else this.tile[i] = type;
    this.obj[i] = 0;
    this.flow[i] |= flow;
  };

  W.genCity = function (c, rnd) {
    const def = c.def;
    const roadT = T.ROAD;
    // grid roads
    for (let i = 0; i <= c.nbx; i++) this.layV(c.x0 + i * P, c.y0, c.y0 + c.nby * P + RW - 1, roadT);
    for (let j = 0; j <= c.nby; j++) this.layH(c.x0, c.x0 + c.nbx * P + RW - 1, c.y0 + j * P, roadT);
    // blocks
    const rows = [];
    const cxB = (c.nbx - 1) / 2, cyB = (c.nby - 1) / 2;
    for (let i = 0; i < c.nbx; i++)
      for (let j = 0; j < c.nby; j++) {
        const bx = c.x0 + i * P + RW, by = c.y0 + j * P + RW;
        const d = Math.hypot((i - cxB) / Math.max(1, cxB + 0.5), (j - cyB) / Math.max(1, cyB + 0.5));
        const zone = c.hamlet ? 'hamlet' : d < 0.38 ? 'core' : d < 0.78 ? 'mid' : 'edge';
        // port: westmost column is the harbor
        if (c.id === 'port' && i === 0) {
          this.genDocks(c, bx, by, rnd);
          continue;
        }
        // sidewalk ring
        for (let y = by; y < by + BS; y++)
          for (let x = bx; x < bx + BS; x++) {
            const edge = x === bx || y === by || x === bx + BS - 1 || y === by + BS - 1;
            this.tile[y * this.W + x] = edge ? T.WALK : T.LOT;
            this.obj[y * this.W + x] = 0;
          }
        // parks
        const parkChance = zone === 'core' ? 0.06 : zone === 'mid' ? 0.1 : 0.06;
        if (!c.hamlet && rnd() < parkChance) {
          this.genPark(c, bx, by, rnd);
          continue;
        }
        rows.push({ c, x: bx + 1, y: by + 1, face: 'N', cur: 0, zone, d });
        rows.push({ c, x: bx + 1, y: by + 1 + RD, face: 'S', cur: 0, zone, d });
      }
    // required buildings first, closest rows to the centre
    const req = c.hamlet ? ['gas', 'diner', 'bar', 'general', 'motel'] : D.cityRequired.slice();
    if (c.id === 'avalon') req.push('casino', 'club', 'bank', 'police', 'arcade', 'social');
    if (c.id === 'port') req.push('warehouse', 'bar');
    if (c.id === 'pine') req.push('factory', 'butcher', 'cabin');
    if (c.id === 'dust') req.push('motel', 'gas');
    if (c.id === 'bayou') req.push('bar', 'butcher');
    const sorted = rows.slice().sort((a, b) => a.d - b.d + (rnd() - 0.5) * 0.35);
    for (const type of req) {
      const bt = D.btypes[type];
      const w = rnd.int(bt.w[0], bt.w[1]);
      const row = sorted.find((r) => RL - r.cur >= w && (type !== 'house' || r.zone !== 'core'));
      if (row) this.placeBuilding(row, type, w, rnd);
    }
    // fill
    for (const row of rows) {
      let guard = 0;
      while (row.cur < RL && guard++ < 10) {
        const left = RL - row.cur;
        const mix = c.hamlet ? [['house', 4], ['barn', 1], ['general', 0.3], ['bar', 0.3]] : D.cityMix[row.zone];
        let type = rnd.weighted(mix);
        if (c.id === 'dust' && type === 'apartment' && rnd() < 0.5) type = 'house';
        if (c.id === 'pine' && type === 'house' && rnd() < 0.3) type = 'cabin';
        const bt = D.btypes[type];
        const vacant = row.zone === 'edge' ? 0.3 : row.zone === 'mid' ? 0.08 : 0.03;
        if (left < bt.w[0] || rnd() < vacant) {
          const w = left < 4 ? left : Math.min(left, rnd.int(6, 9));
          if (w >= 4 && rnd() < 0.25 && row.zone !== 'edge') this.placeParking(row, w);
          else this.addLot(row, w);
          continue;
        }
        const w = Math.min(left, rnd.int(bt.w[0], bt.w[1]));
        this.placeBuilding(row, type, w, rnd);
      }
    }
    // hangout spots: plaza corners near core
    for (let k = 0; k < c.nbx * c.nby * 0.6; k++) {
      const i = rnd.int(0, c.nbx - 1), j = rnd.int(0, c.nby - 1);
      const bx = c.x0 + i * P + RW, by = c.y0 + j * P + RW;
      const corner = rnd.int(0, 3);
      const x = corner & 1 ? bx + BS - 1 : bx, y = corner & 2 ? by + BS - 1 : by;
      if (this.t(x, y) === T.WALK) this.spots.push({ x, y, city: c, kind: 'corner' });
    }
  };

  W.addLot = function (row, w) {
    const x = row.x + row.cur;
    row.cur += w;
    if (w < 3) return;
    const lot = { x, y: row.y, w, h: RD, face: row.face, city: row.c, zone: row.zone, used: false };
    this.lots.push(lot);
    row.c.lots.push(lot);
    for (let yy = row.y; yy < row.y + RD; yy++)
      for (let xx = x; xx < x + w; xx++) {
        this.tile[yy * this.W + xx] = T.LOT;
        if (R.hash2(xx, yy, 77) < 0.08) this.obj[yy * this.W + xx] = O.BUSH;
      }
  };
  W.placeParking = function (row, w) {
    const x = row.x + row.cur;
    row.cur += w;
    for (let yy = row.y; yy < row.y + RD; yy++)
      for (let xx = x; xx < x + w; xx++) this.tile[yy * this.W + xx] = T.PARKING;
  };

  W.placeBuilding = function (row, type, w, rnd, lot) {
    const bt = D.btypes[type];
    const h = Math.min(RD, rnd.int(bt.h[0], bt.h[1]));
    const x = lot ? lot.x : row.x + row.cur;
    const face = lot ? lot.face : row.face;
    const rowY = lot ? lot.y : row.y;
    const y = face === 'N' ? rowY : rowY + RD - h;
    if (row) row.cur += w + (type === 'house' || type === 'cabin' ? (row.cur + w < RL - 1 ? 1 : 0) : 0);
    const c = lot ? lot.city : row.c;
    return this.addBuilding(c, type, x, y, w, h, face, rnd);
  };

  W.addBuilding = function (c, type, x, y, w, h, face, rnd) {
    const bt = D.btypes[type];
    const id = this.buildings.length;
    const doorX = x + Math.floor(w / 2);
    const doorY = face === 'N' ? y : face === 'S' ? y + h - 1 : y + Math.floor(h / 2);
    const out = face === 'N' ? [doorX, y - 1] : face === 'S' ? [doorX, y + h] : face === 'E' ? [x + w, doorY] : [x - 1, doorY];
    const b = {
      id, type, x, y, w, h, face, city: c, cityId: c.id,
      door: { x: face === 'E' ? x + w - 1 : face === 'W' ? x : doorX, y: doorY },
      out: { x: out[0], y: out[1] },
      roof: rnd.pick(bt.roof), wall: rnd.pick(bt.wall),
      name: this.nameBuilding(c, type, rnd),
      residents: [], workers: [], owner: null, // person ids
      hp: 100, burning: 0, destroyed: false,
      cash: bt.rob ? rnd.int(40, 160) : 0, robbedDay: -9, burgledDay: -9, racket: 0, playerOwned: false,
      floors: type === 'office' || type === 'apartment' || type === 'hotel' ? rnd.int(2, 5) : 1,
      seedArt: rnd.int(0, 99999),
    };
    this.buildings.push(b);
    c.buildings.push(b);
    for (let yy = y; yy < y + h; yy++)
      for (let xx = x; xx < x + w; xx++) {
        const i = yy * this.W + xx;
        this.tile[i] = T.BLDG;
        this.obj[i] = 0;
        this.bid[i] = id;
      }
    // yard trees behind houses
    if (type === 'house' || type === 'cabin') {
      const yardY = face === 'N' ? y + h : y - 1;
      for (let xx = x; xx < x + w; xx++)
        if (this.t(xx, yardY) === T.LOT && R.hash2(xx, yardY, 5) < 0.3) this.obj[yardY * this.W + xx] = rnd() < 0.5 ? O.TREE : O.BUSH;
    }
    if (this.genDone) for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) this.markDirty(xx, yy);
    return b;
  };

  W.nameBuilding = function (c, type, rnd) {
    const pats = D.shopNames[type] || ['{L}'];
    const lasts = D.lastAll[c.id] || D.lastAll.avalon;
    return rnd
      .pick(pats)
      .replace('{L}', rnd.pick(lasts))
      .replace('{F}', rnd.pick(rnd() < 0.5 ? D.firstM : D.firstF))
      .replace('{C}', c.name.split(' ').pop())
      .replace('{Fam}', c.def.family || 'Kessler')
      .replace('{N}', String(rnd.int(3, 19)));
  };

  W.genPark = function (c, bx, by, rnd) {
    const m = BS >> 1;
    for (let y = by; y < by + BS; y++)
      for (let x = bx; x < bx + BS; x++) {
        const edge = x === bx || y === by || x === bx + BS - 1 || y === by + BS - 1;
        const i = y * this.W + x;
        const cross = x === bx + m - 1 || x === bx + m || y === by + m - 1 || y === by + m;
        this.tile[i] = edge ? T.WALK : cross ? T.PLAZA : T.PARK;
        const r = R.hash2(x, y, 41);
        this.obj[i] = !edge && !cross ? (r < 0.22 ? (c.def.biome === 'desert' ? O.PALM : O.TREE) : r < 0.3 ? O.FLOWERS : r < 0.35 ? O.BUSH : 0) : 0;
        if (cross && !edge && (x === bx + m - 2 || x === bx + m + 1 || y === by + m - 2 || y === by + m + 1) && r < 0.3) this.obj[i] = O.BENCH;
      }
    this.spots.push({ x: bx + m - 1, y: by + m - 1, city: c, kind: 'park' });
    this.spots.push({ x: bx + m, y: by + 4, city: c, kind: 'park' });
    this.spots.push({ x: bx + 4, y: by + m, city: c, kind: 'park' });
  };

  W.genDocks = function (c, bx, by, rnd) {
    // Planks over water with a warehouse or two, west side of Port Hollow.
    for (let y = by - 2; y < by + BS; y++)
      for (let x = bx - 30; x < bx + BS; x++) {
        if (!this.inb(x, y)) continue;
        const i = y * this.W + x;
        if (x >= bx) {
          this.tile[i] = x === bx + BS - 1 || y === by + BS - 1 ? T.WALK : T.DOCK;
          this.obj[i] = 0;
          this.zone[i] = c.idx + 1;
        } else if (!D.waterTile[this.tile[i]] && x < bx - 1) {
          this.tile[i] = T.WATER;
          this.obj[i] = 0;
        } else if (x >= bx - 1) {
          this.tile[i] = T.WATER;
          this.obj[i] = 0;
        }
      }
    // piers
    for (let p = 0; p < 4; p++) {
      const py = by + 1 + p * 5;
      for (let x = bx - 12; x < bx; x++) {
        this.tile[py * this.W + x] = T.DOCK;
        this.tile[(py + 1) * this.W + x] = T.DOCK;
        if (x === bx - 12 || x === bx - 6) this.obj[py * this.W + x] = O.CRATE;
      }
      this.spots.push({ x: bx - 8, y: py + 1, city: c, kind: 'pier' });
    }
    const wy = by + 3;
    const b = this.addBuilding(c, 'warehouse', bx + 6, wy, 13, 10, 'E', rnd);
    b.out = { x: bx + BS - 1, y: b.door.y };
    for (let k = 0; k < 6; k++) {
      const x = bx + rnd.int(1, 5), y = by + rnd.int(1, BS - 2);
      if (this.t(x, y) === T.DOCK) this.obj[y * this.W + x] = rnd() < 0.6 ? O.CRATE : O.BARREL;
    }
  };

  // Highways: horizontal leg on A's main row, vertical leg on B's main column.
  W.genHighways = function (rnd) {
    const byId = {};
    for (const c of this.cities) byId[c.id] = c;
    this.hamlets.forEach((h, i) => (byId['h' + i] = h));
    const edges = [
      ['port', 'h0'], ['h0', 'pine'], ['h0', 'avalon'], ['port', 'avalon'], ['avalon', 'h1'], ['h1', 'dust'],
      ['pine', 'h2'], ['h2', 'h1'], ['avalon', 'h3'], ['h3', 'bayou'], ['bayou', 'port'], ['h3', 'dust'],
    ];
    this.highways = [];
    const all = this.cities.concat(this.hamlets);
    const inRect = (x, y) => all.find((c) => x >= c.x0 - 1 && x <= c.x1 + 1 && y >= c.y0 - 1 && y <= c.y1 + 1);
    const onRow = (c, y) => y >= c.y0 && (y - c.y0) % P === 0;
    const onCol = (c, x) => x >= c.x0 && (x - c.x0) % P === 0;
    const rowsOf = (c) => Array.from({ length: c.nby + 1 }, (_, j) => c.y0 + j * P);
    const colsOf = (c) => Array.from({ length: c.nbx + 1 }, (_, i) => c.x0 + i * P);
    const legOk = (horiz, fixed, a0, a1) => {
      const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
      for (let v = lo; v <= hi; v++)
        for (let o = 0; o < RW; o++) {
          const x = horiz ? v : fixed + o, y = horiz ? fixed + o : v;
          const c = inRect(x, y);
          if (c && !(horiz ? onRow(c, fixed) : onCol(c, fixed))) return false;
          if (this.t(x, y) === T.ROCK && R.hash2(x, y, 1) < 0.02) {} // tunnels are fine
        }
      return true;
    };
    for (const [a, b] of edges) {
      const A = byId[a], B = byId[b];
      let done = false;
      // Option 1: horizontal out of A on one of its rows, vertical into B on one of its cols
      const rA = rowsOf(A).sort((p, q) => Math.abs(p - B.cy) - Math.abs(q - B.cy));
      const cB = colsOf(B).sort((p, q) => Math.abs(p - A.cx) - Math.abs(q - A.cx));
      const cA = colsOf(A).sort((p, q) => Math.abs(p - B.cx) - Math.abs(q - B.cx));
      const rB = rowsOf(B).sort((p, q) => Math.abs(p - A.cy) - Math.abs(q - A.cy));
      for (const row of rA) {
        for (const col of cB) {
          const sx = A.colX;
          if (legOk(true, row, sx, col + RW - 1) && legOk(false, col, row, B.rowY + RW - 1)) {
            this.layH(sx, col + RW - 1, row, T.HWY);
            this.layV(col, row, B.rowY + RW - 1, T.HWY);
            this.highways.push({ a: A, b: B });
            done = true;
            break;
          }
        }
        if (done) break;
      }
      if (done) continue;
      // Option 2: vertical out of A, horizontal into B
      for (const col of cA) {
        for (const row of rB) {
          if (legOk(false, col, A.rowY, row + RW - 1) && legOk(true, row, col, B.colX + RW - 1)) {
            this.layV(col, A.rowY, row + RW - 1, T.HWY);
            this.layH(col, B.colX + RW - 1, row, T.HWY);
            this.highways.push({ a: A, b: B });
            done = true;
            break;
          }
        }
        if (done) break;
      }
      if (!done) console.warn('highway skipped', a, b);
    }
    // Hamlet grids are generated after highways cross them
    for (const h of this.hamlets) this.genCity(h, rnd);
  };

  W.genCountryside = function (rnd) {
    // Farms and cabins facing highways
    let farms = 0, cabins = 0;
    for (let tries = 0; tries < 900 && (farms < 22 || cabins < 20); tries++) {
      const x = rnd.int(10, this.W - 20), y = rnd.int(10, this.H - 20);
      const t = this.t(x, y);
      if (t !== T.HWY) continue;
      if (this.inCityRect(x, y, 14)) continue;
      const fl = this.flow[y * this.W + x];
      const horiz = fl & (F.E | F.W);
      // pick side
      const side = rnd() < 0.5 ? -1 : 1;
      const biome = this.biomeAt(x + (horiz ? 0 : side * 6), y + (horiz ? side * 6 : 0));
      const type = biome === 'forest' || biome === 'snow' ? 'cabin' : biome === 'grass' || biome === 'field' ? 'barn' : rnd() < 0.3 ? 'cabin' : null;
      if (!type || (type === 'barn' && farms >= 22) || (type === 'cabin' && cabins >= 20)) continue;
      const bt = D.btypes[type];
      const w = bt.w[1], h = bt.h[1];
      let bx, by, face;
      if (horiz) {
        // road rows are y..y+1 for this highway segment; find its top row
        let top = y;
        while (this.flow[(top - 1) * this.W + x] & (F.E | F.W) && y - top < RW) top--;
        bx = x - Math.floor(w / 2);
        if (side < 0) { by = top - 2 - h; face = 'S'; } else { by = top + RW + 2; face = 'N'; }
      } else {
        let left = x;
        while (this.flow[y * this.W + left - 1] & (F.N | F.S) && x - left < RW) left--;
        by = y - Math.floor(h / 2);
        if (side < 0) { bx = left - 2 - w; face = 'E'; } else { bx = left + RW + 2; face = 'W'; }
      }
      if (!this.areaFree(bx - 3, by - 3, w + 6, h + 6)) continue;
      const b = this.addBuilding(this.countyCity(), type, bx, by, w, h, face, rnd);
      b.rural = true;
      // path from door to road
      let px = b.out.x, py = b.out.y;
      for (let k = 0; k < 4; k++) {
        if (!this.inb(px, py) || D.roadTile[this.t(px, py)]) break;
        this.tile[py * this.W + px] = T.DIRT;
        this.obj[py * this.W + px] = 0;
        if (face === 'N') py--; else if (face === 'S') py++; else if (face === 'E') px++; else px--;
      }
      // clear yard, fields for farms
      for (let yy = by - 3; yy < by + h + 3; yy++)
        for (let xx = bx - 3; xx < bx + w + 3; xx++) {
          if (this.bid[yy * this.W + xx]) continue;
          const i = yy * this.W + xx;
          if (D.roadTile[this.tile[i]]) continue;
          this.obj[i] = 0;
          if (this.tile[i] !== T.DIRT) this.tile[i] = type === 'barn' ? T.GRASS : this.tile[i];
        }
      if (type === 'barn') {
        const fx0 = face === 'E' || face === 'W' ? bx + (face === 'E' ? -16 : w + 3) : bx - 6;
        const fy0 = face === 'N' ? by + h + 2 : face === 'S' ? by - 12 : by - 4;
        for (let yy = fy0; yy < fy0 + 10; yy++)
          for (let xx = fx0; xx < fx0 + 14; xx++) {
            if (!this.inb(xx, yy)) continue;
            const i = yy * this.W + xx;
            if (this.tile[i] === T.GRASS || this.tile[i] === T.DIRT || this.tile[i] === T.FOREST) {
              this.tile[i] = T.FIELD;
              this.obj[i] = xx === fx0 || yy === fy0 || xx === fx0 + 13 || yy === fy0 + 9 ? O.FENCE : 0;
            }
          }
        farms++;
      } else cabins++;
      this.spots.push({ x: b.out.x, y: b.out.y, city: this.countyCity(), kind: 'porch', b });
    }
  };
  W.countyCity = function () {
    if (!this._county)
      this._county = { idx: -1, id: 'county', name: 'County', def: { family: null, color: '#8a7a5a', biome: 'rural' }, buildings: [], lots: [], hamlet: true, rural: true, prosperity: 40, fear: 0, heat: 0, growth: 0 };
    return this._county;
  };
  W.areaFree = function (x, y, w, h) {
    for (let yy = y; yy < y + h; yy++)
      for (let xx = x; xx < x + w; xx++) {
        if (!this.inb(xx, yy)) return false;
        const t = this.tile[yy * this.W + xx];
        if (D.roadTile[t] || D.waterTile[t] || t === T.BLDG || t === T.ROCK || t === T.WALK || t === T.FIELD || t === T.DIRT && this.bid[yy * this.W + xx]) return false;
      }
    return true;
  };

  // Detect intersections and group them; add lights in town.
  W.finishRoads = function () {
    const w = this.W;
    for (let i = 0; i < this.flow.length; i++) {
      const f = this.flow[i];
      if (!f) continue;
      if (f & (F.N | F.S) && f & (F.E | F.W)) this.flow[i] |= F.X;
    }
    const seen = new Uint8Array(this.flow.length);
    for (let i = 0; i < this.flow.length; i++) {
      if (!(this.flow[i] & F.X) || seen[i]) continue;
      const stack = [i], tiles = [];
      seen[i] = 1;
      while (stack.length) {
        const j = stack.pop();
        tiles.push(j);
        const x = j % w, y = (j / w) | 0;
        for (const [dx, dy] of R.DIRS) {
          const k = (y + dy) * w + x + dx;
          if (this.inb(x + dx, y + dy) && !seen[k] && this.flow[k] & F.X) {
            seen[k] = 1;
            stack.push(k);
          }
        }
      }
      let arms = 0, mx = 0, my = 0;
      for (const j of tiles) {
        const x = j % w, y = (j / w) | 0;
        mx += x; my += y;
        R.DIRS.forEach(([dx, dy], d) => {
          const k = (y + dy) * w + x + dx;
          if (this.inb(x + dx, y + dy) && this.flow[k] && !(this.flow[k] & F.X)) arms++;
        });
      }
      const cx = mx / tiles.length, cy = my / tiles.length;
      const town = this.inCityRect(Math.round(cx), Math.round(cy), 0);
      const inTown = !!town && (Math.abs(cy - town.rowY - (RW - 1) / 2) < RW || Math.abs(cx - town.colX - (RW - 1) / 2) < RW || R.hash2(Math.round(cx), Math.round(cy), 4) < 0.45);
      const inter = {
        id: this.inters.length, tiles, cx, cy, arms: arms / 2, light: inTown && arms / 2 >= 3,
        phase: 0, timer: R.hash2(cx, cy, 1) * 8, // phase 0: E-W green, 1: yellow, 2: N-S green, 3: yellow
      };
      this.inters.push(inter);
      for (const j of tiles) this.interAt.set(j, inter);
    }
  };

  W.genFurniture = function (rnd) {
    const w = this.W;
    for (let y = 1; y < this.H - 1; y++)
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        if (this.tile[i] !== T.WALK || this.obj[i]) continue;
        // next to road?
        let nearRoad = false;
        for (const [dx, dy] of R.DIRS) if (D.roadTile[this.tile[i + dy * w + dx]]) nearRoad = true;
        const r = R.hash2(x, y, 202);
        let nearDoor = false;
        for (const [dx, dy] of R.DIRS) {
          const b = this.bid[i + dy * w + dx];
          if (b && this.buildings[b].door.x === x + dx && this.buildings[b].door.y === y + dy) nearDoor = true;
        }
        if (nearRoad && (x + y) % 7 === 0 && r < 0.8) this.obj[i] = O.LAMP;
        else if (nearDoor) continue;
        else if (r < 0.02) this.obj[i] = O.HYDRANT;
        else if (r < 0.026) this.obj[i] = O.MAILBOX;
        else if (r < 0.032) this.obj[i] = O.TRASH;
        else if (r < 0.04) {
          this.obj[i] = O.PHONE;
          this.phones.push({ x, y });
        } else if (r < 0.05 && !nearRoad) this.obj[i] = O.BENCH;
      }
    // gas pumps in front of gas stations; barrels near warehouses
    for (const b of this.buildings) {
      if (!b) continue;
      if (b.type === 'gas') {
        const py = b.face === 'N' ? b.y - 2 : b.y + b.h + 1;
        for (let xx = b.x; xx < b.x + b.w; xx += 2) {
          const t = this.t(xx, py);
          if (t === T.LOT || t === T.WALK || t === T.GRASS || t === T.DESERT || t === T.DIRT) {}
        }
        // pumps live on the lot beside the door
        const sx = b.x - 1;
        if (this.t(sx, b.door.y) === T.LOT) this.obj[b.door.y * w + sx] = O.PUMP;
        if (this.t(b.x + b.w, b.door.y) === T.LOT) this.obj[b.door.y * w + b.x + b.w] = O.PUMP;
      }
      if (b.type === 'warehouse' || b.type === 'factory') {
        for (let k = 0; k < 4; k++) {
          const xx = b.x - 1 + rnd.int(0, b.w + 1), yy = b.face === 'N' ? b.y + b.h : b.y - 1;
          if (this.t(xx, yy) === T.LOT && !this.obj[yy * w + xx]) this.obj[yy * w + xx] = rnd() < 0.5 ? O.BARREL : O.CRATE;
        }
      }
    }
    // ensure some phone booths per city
    for (const c of this.cities) {
      let n = this.phones.filter((p) => p.x >= c.x0 && p.x <= c.x1 && p.y >= c.y0 && p.y <= c.y1).length;
      for (let k = 0; k < 200 && n < c.nbx * c.nby * 0.7; k++) {
        const x = rnd.int(c.x0, c.x1), y = rnd.int(c.y0, c.y1);
        const i = y * w + x;
        if (this.tile[i] === T.WALK && !this.obj[i]) {
          let ok = true;
          for (const [dx, dy] of R.DIRS) if (D.roadTile[this.tile[i + dy * w + dx]] || this.bid[i + dy * w + dx]) ok = false;
          if (ok) { this.obj[i] = O.PHONE; this.phones.push({ x, y }); n++; }
        }
      }
    }
  };

  // Build on a vacant lot (city growth / player investment)
  W.buildOnLot = function (lot, type, rnd) {
    const bt = D.btypes[type];
    const w = Math.min(lot.w, bt.w[1]);
    if (w < bt.w[0]) return null;
    for (let yy = lot.y; yy < lot.y + lot.h; yy++) for (let xx = lot.x; xx < lot.x + lot.w; xx++) this.setO(xx, yy, 0);
    const b = this.placeBuilding(null, type, w, rnd, lot);
    lot.used = true;
    b.fromLot = lot;
    return b;
  };
  W.setSite = function (lot, on) {
    for (let yy = lot.y; yy < lot.y + lot.h; yy++)
      for (let xx = lot.x; xx < lot.x + lot.w; xx++) {
        this.setT(xx, yy, on ? T.SITE : T.LOT);
        this.setO(xx, yy, on && (xx === lot.x || xx === lot.x + lot.w - 1) && (yy === lot.y || yy === lot.y + lot.h - 1) ? O.CONE : 0);
      }
  };
  // Wreck a building (fire, dynamite) — becomes a lot for rebuilding later.
  W.destroyBuilding = function (b) {
    if (b.destroyed) return;
    b.destroyed = true;
    for (let yy = b.y; yy < b.y + b.h; yy++)
      for (let xx = b.x; xx < b.x + b.w; xx++) {
        const i = yy * this.W + xx;
        this.bid[i] = 0;
        this.setT(xx, yy, T.BURNT);
        this.setO(xx, yy, R.hash2(xx, yy, 9) < 0.25 ? O.CRATE : 0);
      }
    const face = b.face === 'N' || b.face === 'S' ? b.face : 'N';
    const lot = { x: b.x, y: face === 'N' ? b.y : b.y + b.h - RD, w: b.w, h: RD, face, city: b.city, zone: 'mid', used: false, ruin: true };
    if (b.fromLot) Object.assign(lot, { x: b.fromLot.x, y: b.fromLot.y, w: b.fromLot.w, h: b.fromLot.h });
    if (!b.city.rural) {
      this.lots.push(lot);
      b.city.lots.push(lot);
    }
    R.bus.emit('building:destroyed', b);
  };

  // Nearest tile of a type set in a ring search (for spawning / pathing targets)
  W.findNear = function (tx, ty, rmin, rmax, pred, rnd) {
    rnd = rnd || R.rng;
    for (let k = 0; k < 40; k++) {
      const a = rnd() * Math.PI * 2, r = rmin + rnd() * (rmax - rmin);
      const x = Math.round(tx + Math.cos(a) * r), y = Math.round(ty + Math.sin(a) * r);
      if (this.inb(x, y) && pred(x, y)) return { x, y };
    }
    return null;
  };

  // Line of sight in tiles (buildings/rock block sight)
  W.los = function (ax, ay, bx, by) {
    const T_ = R.TILE;
    const dist = R.dist(ax, ay, bx, by);
    const steps = Math.ceil(dist / (T_ * 0.5));
    for (let s = 1; s < steps; s++) {
      const t = s / steps;
      const x = ((ax + (bx - ax) * t) / T_) | 0, y = ((ay + (by - ay) * t) / T_) | 0;
      const tt = this.t(x, y);
      if (tt === T.BLDG || tt === T.ROCK || tt === T.WALL || tt === T.VOID) return false;
    }
    return true;
  };

  R.World = World;
  R.BLOCK_PITCH = P;
  R.ROAD_W = RW;
})();

// ---- 03_art.js
// RHAPSODY — procedural pixel art. Terrain is pre-rendered into 32x32-tile chunks;
// people, cars and animals are drawn each frame from a few rectangles.
'use strict';
(function () {
  const D = R.data, T = D.T, O = D.O, F = R.FLOW, TS = R.TILE;
  const A = (R.art = {});
  const CH = 32; // tiles per chunk
  A.CH = CH;

  const shade = (hex, amt) => {
    let n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = R.clamp(Math.round(r + amt), 0, 255);
    g = R.clamp(Math.round(g + amt), 0, 255);
    b = R.clamp(Math.round(b + amt), 0, 255);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  };
  A.shade = shade;

  const base = {};
  base[T.DEEP] = '#1f5566'; base[T.WATER] = '#2f7a86'; base[T.SAND] = '#e3cf9c'; base[T.GRASS] = '#78843e';
  base[T.FOREST] = '#566b33'; base[T.DIRT] = '#a88a5a'; base[T.DESERT] = '#d6b577'; base[T.MARSH] = '#5d6a3c';
  base[T.ROCK] = '#7d7468'; base[T.ROAD] = '#4a4541'; base[T.WALK] = '#b9ab92'; base[T.BLDG] = '#555';
  base[T.LOT] = '#7f8a48'; base[T.PARK] = '#6f8a3e'; base[T.DIRTROAD] = '#9a7a4e'; base[T.BRIDGE] = '#6a5a4a';
  base[T.PLAZA] = '#c08a62'; base[T.FIELD] = '#b89a48'; base[T.SNOW] = '#e8ecee'; base[T.BURNT] = '#3a332e';
  base[T.SITE] = '#9a7a52'; base[T.DOCK] = '#8a6a44'; base[T.PARKING] = '#565049'; base[T.HWY] = '#46423f';
  A.tileColor = base;

  // ------------------------------------------------------------ chunks
  A.chunkCache = new Map();
  A.getChunk = function (world, cx, cy) {

    let c = A.chunkCache.get(key);
    if (c && !world.dirty.has(key)) {
      c.used = performance.now();
      return c.canvas;
    }
    if (!c) {
      if (A.chunkCache.size >= 40) {
        let oldK = null, oldT = Infinity;
        for (const [k, v] of A.chunkCache) if (v.used < oldT) { oldT = v.used; oldK = k; }
        c = A.chunkCache.get(oldK);
        A.chunkCache.delete(oldK);
      } else {
        const cv = document.createElement('canvas');
        cv.width = cv.height = CH * TS;
        c = { canvas: cv };

      A.chunkCache.set(key, c);
    }
    world.dirty.delete(key);
    c.used = performance.now();
    A.renderChunk(world, cx, cy, c.canvas);
    return c.canvas;

  A.renderChunk = function (world, cx, cy, cv) {

    const x0 = cx * CH, y0 = cy * CH;
    g.clearRect(0, 0, cv.width, cv.height);
    for (let ty = 0; ty < CH; ty++)
      for (let tx = 0; tx < CH; tx++) A.drawTile(g, world, x0 + tx, y0 + ty, tx * TS, ty * TS);
    // buildings overlapping this chunk
    const seen = new Set();
    for (let ty = -1; ty <= CH; ty++)
      for (let tx = -1; tx <= CH; tx++) {

        if (b && !seen.has(b.id)) {

      }

    for (let ty = -2; ty <= CH + 1; ty++)
      for (let tx = -2; tx <= CH + 1; tx++) {
        const o = world.o(x0 + tx, y0 + ty);
        if (o) A.drawObj(g, o, tx * TS, ty * TS, x0 + tx, y0 + ty, world);
      }
  };

  function speck(g, x, y, col, n, h, sz) {
    g.fillStyle = col;
    for (let k = 0; k < n; k++) {
      const a = R.hash2(h, k, 3), b = R.hash2(k, h, 7);
      g.fillRect(x + ((a * TS) | 0), y + ((b * TS) | 0), sz || 1, sz || 1);

  }

  A.drawTile = function (g, w, x, y, px, py) {

      case T.WATER:

        speck(g, px, py, shade(col, -35), 3, hi, 2);
        break;
      case T.WALK: {
        g.fillStyle = shade(col, -16);

        for (let d = 0; d < 4; d++) {
          const [dx, dy] = R.DIRS[d];
          if (D.roadTile[w.t(x + dx, y + dy)]) {
            g.fillStyle = '#d8ccb4';
            if (d === 0) g.fillRect(px, py, TS, 2);
            if (d === 2) g.fillRect(px, py + TS - 2, TS, 2);
            if (d === 1) g.fillRect(px + TS - 2, py, 2, TS);
            if (d === 3) g.fillRect(px, py, 2, TS);
          }
        }

      }

      case T.FIELD:

  A.drawRoad = function (g, w, x, y, px, py, t) {

      else if (x % 2 === 0) g.fillRect(px + 2, py + TS - 1, 10, 2);

        if (w.flow[w.idx(x - 1, y)] & F.X) for (let k = 1; k < TS; k += 4) g.fillRect(px + 1, py + k, 3, 2);

  // ------------------------------------------------------------ buildings

        g.fillStyle = '#c8a040';
        g.fillRect(px + bw / 2 - 1, py - 4, 2, 10);
        g.fillRect(px + bw / 2 - 4, py - 1, 8, 2);
      }
    } else {
      // flat roof: parapet, AC units, vents, gravel
      g.fillStyle = shade(roof, 20);
      g.fillRect(px, py, bw, 2);
      g.fillRect(px, py, 2, bh - facadeH);
      g.fillRect(px + bw - 2, py, 2, bh - facadeH);
      g.fillStyle = shade(roof, -12);
      for (let k = 0; k < (b.w * b.h) / 2; k++) g.fillRect(px + 3 + rnd() * (bw - 6), py + 3 + rnd() * (bh - facadeH - 6), 1, 1);
      const units = 1 + Math.floor(rnd() * 3);
      for (let k = 0; k < units; k++) {
        const ux = px + 4 + rnd() * Math.max(1, bw - 16), uy = py + 4 + rnd() * Math.max(1, bh - facadeH - 14);
        g.fillStyle = '#8a8a86';
        g.fillRect(ux, uy, 9, 7);
        g.fillStyle = '#5a5a58';
        g.fillRect(ux + 2, uy + 2, 5, 3);
      }
      if (b.floors > 2) {
        g.fillStyle = '#2a2a2a';
        g.fillRect(px + bw - 12, py + 4, 6, 6); // water tank
        g.fillStyle = '#6a4a2a';
        g.fillRect(px + bw - 13, py + 3, 8, 3);
      }
    }
    // facade (always drawn to the south for the 3/4 look)
    const fy = py + bh - facadeH;
    g.fillStyle = b.wall;
    g.fillRect(px, fy, bw, facadeH);
    g.fillStyle = shade(b.wall, -40);
    g.fillRect(px, fy, bw, 1);
    // windows
    g.fillStyle = '#2a3a44';
    for (let wx = 3; wx < bw - 4; wx += 6) g.fillRect(px + wx, fy + 2, 3, 3);
    // awning + door marker on the entrance side
    const dx = (b.door.x - b.x) * TS, dy = (b.door.y - b.y) * TS;
    const aw = bt.neon ? '#e040a0' : shade(roof, 30);
    g.fillStyle = aw;
    if (b.face === 'S') {
      g.fillStyle = '#2a1a12';
      g.fillRect(px + dx + 4, fy + 1, 8, facadeH - 1);
      g.fillStyle = aw;
      for (let k = 0; k < 16; k += 4) g.fillRect(px + dx + k, fy - 3, 3, 3);
    } else if (b.face === 'N') {
      g.fillRect(px + dx + 1, py - 2, 14, 4);
      g.fillStyle = '#f0e0c0';
      for (let k = 2; k < 14; k += 4) g.fillRect(px + dx + 1 + k, py - 2, 2, 4);
    } else if (b.face === 'E') {
      g.fillRect(px + bw - 2, py + dy + 1, 4, 14);
    } else {
      g.fillRect(px - 2, py + dy + 1, 4, 14);
    }
    if (b.type === 'police') {
      g.fillStyle = '#2a4a8a';
      g.fillRect(px + 4, py + 4, 8, 8);
      g.fillStyle = '#e8e8f0';
      g.fillRect(px + 7, py + 5, 2, 6);
      g.fillRect(px + 5, py + 7, 6, 2);
    }
    if (b.type === 'hospital') {
      g.fillStyle = '#c02020';
      g.fillRect(px + bw / 2 - 2, py + 12, 4, 12);
      g.fillRect(px + bw / 2 - 6, py + 16, 12, 4);
    }
  };

  // ------------------------------------------------------------ objects
  A.drawObj = function (g, o, px, py, x, y, w) {
    const h = R.hash2(x, y, 5);
    switch (o) {
      case O.TREE: {
        const c = w.t(x, y) === T.SNOW ? '#4a6a4a' : h < 0.5 ? '#4f6a2a' : '#5e7a30';
        g.fillStyle = 'rgba(10,20,5,0.3)';
        g.beginPath(); g.ellipse(px + 10, py + 13, 9, 5, 0, 0, 7); g.fill();
        g.fillStyle = '#5a3a1e';
        g.fillRect(px + 7, py + 8, 3, 7);
        g.fillStyle = shade(c, -18);
        g.beginPath(); g.arc(px + 8, py + 5, 9, 0, 7); g.fill();
        g.fillStyle = c;
        g.beginPath(); g.arc(px + 7, py + 3, 7, 0, 7); g.fill();
        g.fillStyle = shade(c, 22);
        g.fillRect(px + 4, py - 1, 3, 2);
        if (h > 0.85) { g.fillStyle = '#d9621e'; g.fillRect(px + 10, py + 4, 2, 2); } // autumn leaf
        break;
      }
      case O.PINE: {
        g.fillStyle = 'rgba(10,20,5,0.3)';
        g.beginPath(); g.ellipse(px + 9, py + 14, 7, 3, 0, 0, 7); g.fill();
        g.fillStyle = '#4a2e18';
        g.fillRect(px + 7, py + 10, 2, 5);
        const c = w.t(x, y) === T.SNOW ? '#3a5a4a' : '#2f5230';
        for (let k = 0; k < 3; k++) {
          g.fillStyle = shade(c, k * 10);
          g.beginPath();
          g.moveTo(px + 8, py - 8 + k * 5);
          g.lineTo(px + 15 - k, py + 6 + k * 2);
          g.lineTo(px + 1 + k, py + 6 + k * 2);
          g.fill();
        }
        if (w.t(x, y) === T.SNOW) { g.fillStyle = '#f0f4f4'; g.fillRect(px + 6, py - 6, 4, 2); }
        break;
      }
      case O.PALM:
        g.fillStyle = '#7a5a3a';
        g.fillRect(px + 7, py - 2, 2, 16);
        g.fillStyle = '#4a7a3a';
        for (let k = 0; k < 5; k++) {
          const a = (k / 5) * Math.PI * 2;
          g.fillRect(px + 8 + Math.cos(a) * 5 - 2, py - 3 + Math.sin(a) * 3, 5, 2);
        }
        break;
      case O.CACTUS:
        g.fillStyle = '#4a7a3a';
        g.fillRect(px + 6, py + 1, 4, 14);
        g.fillRect(px + 2, py + 5, 3, 2); g.fillRect(px + 2, py + 2, 2, 4);
        g.fillRect(px + 11, py + 7, 3, 2); g.fillRect(px + 12, py + 4, 2, 4);
        g.fillStyle = '#6a9a4a';
        g.fillRect(px + 7, py + 1, 1, 13);
        break;
      case O.BUSH:
        g.fillStyle = '#4a5a28';
        g.beginPath(); g.arc(px + 8, py + 10, 5, 0, 7); g.fill();
        g.fillStyle = '#5e7034';
        g.beginPath(); g.arc(px + 7, py + 9, 3, 0, 7); g.fill();
        break;
      case O.BOULDER:
        g.fillStyle = '#6a645a';
        g.fillRect(px + 3, py + 6, 10, 8);
        g.fillStyle = '#8a8478';
        g.fillRect(px + 4, py + 6, 6, 3);
        break;
      case O.REED:
        g.fillStyle = '#8a8a4a';
        for (let k = 0; k < 4; k++) g.fillRect(px + 3 + k * 3, py + 5 + ((h * 10 + k) % 4), 1, 8);
        g.fillStyle = '#5a3a1a';
        g.fillRect(px + 6, py + 4, 2, 3);
        break;
      case O.DEADTREE:
        g.fillStyle = '#5a4a3a';
        g.fillRect(px + 7, py + 1, 2, 14);
        g.fillRect(px + 3, py + 4, 5, 1); g.fillRect(px + 9, py + 6, 5, 1);
        break;
      case O.STUMP:
        g.fillStyle = '#2a2420';
        g.fillRect(px + 6, py + 9, 4, 5);
        break;
      case O.FLOWERS:
        for (let k = 0; k < 4; k++) {
          g.fillStyle = ['#e4a92a', '#d9621e', '#e8e0f0', '#c04a8a'][(k + ((h * 4) | 0)) % 4];
          g.fillRect(px + 2 + k * 3, py + 6 + (k % 2) * 4, 2, 2);
        }
        break;
      case O.LAMP:
        g.fillStyle = '#3a3a3a';
        g.fillRect(px + 7, py + 2, 2, 12);
        g.fillStyle = '#2a2a2a';
        g.fillRect(px + 5, py + 13, 6, 2);
        g.fillStyle = '#f0e0a0';
        g.fillRect(px + 5, py + 1, 6, 3);
        break;
      case O.HYDRANT:
        g.fillStyle = '#c83a1a';
        g.fillRect(px + 6, py + 7, 4, 7);
        g.fillRect(px + 5, py + 9, 6, 2);
        g.fillStyle = '#e8c040';
        g.fillRect(px + 6, py + 6, 4, 1);
        break;
      case O.PHONE:
        g.fillStyle = 'rgba(0,0,0,0.3)';
        g.fillRect(px + 4, py + 12, 10, 4);
        g.fillStyle = '#2a5a9a';
        g.fillRect(px + 3, py + 1, 10, 13);
        g.fillStyle = '#a8d0f0';
        g.fillRect(px + 5, py + 4, 6, 7);
        g.fillStyle = '#f0f0e0';
        g.fillRect(px + 3, py + 1, 10, 2);
        break;
      case O.BENCH:
        g.fillStyle = '#6a4a2a';
        g.fillRect(px + 1, py + 6, 14, 3);
        g.fillRect(px + 1, py + 3, 14, 2);
        g.fillStyle = '#2a2a2a';
        g.fillRect(px + 2, py + 9, 1, 3); g.fillRect(px + 13, py + 9, 1, 3);
        break;
      case O.FENCE:
        g.fillStyle = '#7a5a3a';
        g.fillRect(px, py + 6, TS, 2);
        g.fillRect(px, py + 10, TS, 2);
        g.fillRect(px + 2, py + 4, 2, 10); g.fillRect(px + 11, py + 4, 2, 10);
        break;
      case O.PUMP:
        g.fillStyle = '#c04030';
        g.fillRect(px + 4, py + 2, 8, 12);
        g.fillStyle = '#f0f0e0';
        g.fillRect(px + 5, py + 4, 6, 4);
        g.fillStyle = '#2a2a2a';
        g.fillRect(px + 12, py + 6, 2, 5);
        break;
      case O.TRASH:
        g.fillStyle = '#5a6a5a';
        g.fillRect(px + 5, py + 6, 6, 8);
        g.fillStyle = '#7a8a7a';
        g.fillRect(px + 4, py + 5, 8, 2);
        break;
      case O.MAILBOX:
        g.fillStyle = '#2a4a8a';
        g.fillRect(px + 5, py + 5, 6, 9);
        g.fillStyle = '#4a6aaa';
        g.fillRect(px + 5, py + 5, 6, 2);
        break;
      case O.BARREL:
        g.fillStyle = h < 0.5 ? '#c04a1a' : '#4a6a3a';
        g.fillRect(px + 4, py + 3, 9, 11);
        g.fillStyle = 'rgba(0,0,0,0.3)';
        g.fillRect(px + 4, py + 6, 9, 1);
        g.fillRect(px + 4, py + 10, 9, 1);
        break;
      case O.CRATE:
        g.fillStyle = '#9a7040';
        g.fillRect(px + 2, py + 2, 12, 12);
        g.strokeStyle = '#6a4a28';
        g.lineWidth = 1;
        g.strokeRect(px + 2.5, py + 2.5, 11, 11);
        g.beginPath(); g.moveTo(px + 3, py + 3); g.lineTo(px + 13, py + 13); g.stroke();
        break;
      case O.CONE:
        g.fillStyle = '#e46a1a';
        g.beginPath(); g.moveTo(px + 8, py + 3); g.lineTo(px + 12, py + 13); g.lineTo(px + 4, py + 13); g.fill();
        g.fillStyle = '#f0f0f0';
        g.fillRect(px + 6, py + 8, 4, 2);
        break;
      case O.SIGNPOST:
        g.fillStyle = '#6a4a2a';
        g.fillRect(px + 7, py + 4, 2, 11);
        g.fillStyle = '#2a6a3a';
        g.fillRect(px + 1, py + 2, 14, 5);
        break;
    }
  };

  // ------------------------------------------------------------ people
  // look: { skin, hair, hairStyle, top, bottom, hat, hatCol, build, fem, kid, beard, shades, stripe, chain, mask, uniform }
  A.drawPerson = function (g, x, y, dir, walk, look, st) {
    st = st || {};
    const s = look.kid ? 0.72 : 1;
    const bw = (look.build === 2 ? 12 : look.build === 0 ? 8 : 10) * s;
    const X = Math.round(x), Y = Math.round(y);
    g.save();
    g.translate(X, Y);
    if (st.down) {
      // knocked down / dead: lie sideways
      g.rotate(Math.PI / 2);
      g.translate(-4, 0);
    }
    // shadow
    g.fillStyle = 'rgba(15,10,5,0.35)';
    g.beginPath(); g.ellipse(0, 1, bw * 0.6, 3 * s, 0, 0, 7); g.fill();
    const legSwing = walk ? Math.sin(walk) * 2.5 * s : 0;
    const lh = 6 * s, th = 8 * s, hh = 6 * s;
    const legTop = -lh;
    // legs
    g.fillStyle = look.bottom;
    if (dir === 1 || dir === 3) {
      g.fillRect(-2 * s + legSwing, legTop, 3 * s, lh);
      g.fillRect(-1 * s - legSwing, legTop, 3 * s, lh);
    } else {
      g.fillRect(-bw / 2 + 1, legTop + (legSwing > 0 ? -1 : 0), bw / 2 - 1, lh);
      g.fillRect(1, legTop + (legSwing < 0 ? -1 : 0), bw / 2 - 1, lh);
    }
    // shoes
    g.fillStyle = '#1a1210';
    if (dir === 1 || dir === 3) g.fillRect(-3 * s, -1.5, 6 * s, 1.5);
    else { g.fillRect(-bw / 2 + 1, -1.5, bw / 2 - 1, 1.5); g.fillRect(1, -1.5, bw / 2 - 1, 1.5); }
    // torso
    const tTop = legTop - th;
    const tw = dir === 1 || dir === 3 ? bw * 0.7 : bw;
    g.fillStyle = look.top;
    g.fillRect(-tw / 2, tTop, tw, th + 1);
    if (look.fem && !look.kid && look.dress) {
      g.fillRect(-tw / 2 - 1, legTop - 1, tw + 2, 4 * s);
    }
    if (look.stripe) {
      g.fillStyle = look.stripe;
      for (let k = -tw / 2 + 1.5; k < tw / 2; k += 2.5) g.fillRect(k, tTop + 1, 0.6, th - 1);
    }
    if (dir === 2) {
      // lapels / collar
      if (look.lapel) {
        g.fillStyle = look.lapel;
        g.beginPath(); g.moveTo(-2, tTop); g.lineTo(0, tTop + 5); g.lineTo(2, tTop); g.fill();
      }
      if (look.chain) { g.fillStyle = '#f0c040'; g.fillRect(-1.5, tTop + 1.5, 3, 1); }
    }
    // arms
    const armSwing = walk ? Math.cos(walk) * 2 * s : 0;
    g.fillStyle = look.top;
    if (dir === 1 || dir === 3) g.fillRect(-1.5 + armSwing * 0.8, tTop + 1, 3 * s, th - 1);
    else {
      g.fillRect(-tw / 2 - 2 * s, tTop + 1 + armSwing * 0.3, 2 * s, th - 1);
      g.fillRect(tw / 2, tTop + 1 - armSwing * 0.3, 2 * s, th - 1);
      g.fillStyle = look.skin;
      g.fillRect(-tw / 2 - 2 * s, tTop + th - 1 + armSwing * 0.3, 2 * s, 2);
      g.fillRect(tw / 2, tTop + th - 1 - armSwing * 0.3, 2 * s, 2);
    }
    // held weapon
    if (st.weapon && st.weapon !== 'fists') {
      g.fillStyle = st.weapon === 'bat' ? '#b08050' : st.weapon === 'knife' ? '#d0d0d0' : '#2a2a2a';
      const wl = st.weapon === 'bat' ? 8 : st.weapon === 'shotgun' || st.weapon === 'rifle' ? 9 : st.weapon === 'chopper' ? 7 : 4;
      if (dir === 1) g.fillRect(2, tTop + 4, wl, 2);
      else if (dir === 3) g.fillRect(-2 - wl, tTop + 4, wl, 2);
      else if (dir === 2) g.fillRect(tw / 2, tTop + 5, 2, wl);
      else g.fillRect(tw / 2, tTop + 1 - wl + 4, 2, wl);
    }
    // head
    const hTop = tTop - hh;
    const hw = 6 * s;
    g.fillStyle = look.mask ? '#2a2a2a' : look.skin;
    g.fillRect(-hw / 2, hTop, hw, hh);
    // hair
    if (!look.mask) {
      g.fillStyle = look.hair;
      if (look.hairStyle === 2) {
        // afro
        g.beginPath(); g.arc(0, hTop + 1, 5 * s, 0, 7); g.fill();
        g.fillStyle = look.skin;
        if (dir === 2) g.fillRect(-hw / 2 + 0.5, hTop + 2, hw - 1, hh - 2);
        else if (dir === 1) g.fillRect(0, hTop + 2, hw / 2, hh - 2);
        else if (dir === 3) g.fillRect(-hw / 2, hTop + 2, hw / 2, hh - 2);
      } else if (dir === 0) g.fillRect(-hw / 2, hTop, hw, hh - 1);
      else {
        g.fillRect(-hw / 2, hTop - 1, hw, 2.5);
        if (look.hairStyle === 1 || look.fem) {
          // long hair
          if (dir === 1) g.fillRect(-hw / 2, hTop, 2, hh + 2);
          else if (dir === 3) g.fillRect(hw / 2 - 2, hTop, 2, hh + 2);
          else { g.fillRect(-hw / 2 - 0.5, hTop, 1.5, hh + 2); g.fillRect(hw / 2 - 1, hTop, 1.5, hh + 2); }
        }
      }
      // face
      if (dir !== 0) {
        g.fillStyle = '#1a1010';
        const ex = dir === 1 ? 1 : dir === 3 ? -2 : 0;
        if (look.shades) {
          g.fillStyle = '#101010';
          if (dir === 2) g.fillRect(-2.5, hTop + 2.5, 5, 1.3);
          else g.fillRect(ex, hTop + 2.5, 2, 1.3);
        } else if (dir === 2) {
          g.fillRect(-2, hTop + 2.5, 1, 1); g.fillRect(1, hTop + 2.5, 1, 1);
        } else g.fillRect(ex + 0.5, hTop + 2.5, 1, 1);
        if (look.beard) {
          g.fillStyle = look.hair;
          if (dir === 2) g.fillRect(-2, hTop + 4, 4, 1);
          else g.fillRect(dir === 1 ? 0 : -3, hTop + 4, 3, 1);
        }
      }
    } else if (dir !== 0) {
      g.fillStyle = '#e8d0b0';
      if (dir === 2) { g.fillRect(-2.5, hTop + 2, 2, 1.5); g.fillRect(0.5, hTop + 2, 2, 1.5); }
      else g.fillRect(dir === 1 ? 0.5 : -2.5, hTop + 2, 2, 1.5);
    }
    // hat
    if (look.hat && !look.mask) {
      g.fillStyle = look.hatCol || '#2a2020';
      if (look.hat === 'fedora') {
        g.fillRect(-hw / 2 - 2, hTop + 0.5, hw + 4, 1.5); // brim
        g.fillRect(-hw / 2 + 0.5, hTop - 2.5, hw - 1, 3.2);
        g.fillStyle = '#7a2a1a';
        g.fillRect(-hw / 2 + 0.5, hTop - 0.3, hw - 1, 0.9); // band
      } else if (look.hat === 'cap') {
        g.fillRect(-hw / 2, hTop - 1.5, hw, 2.5);
        if (dir === 2) g.fillRect(-hw / 2, hTop + 0.5, hw, 1);
        else if (dir === 1) g.fillRect(hw / 2 - 1, hTop, 3, 1);
        else if (dir === 3) g.fillRect(-hw / 2 - 2, hTop, 3, 1);
      } else if (look.hat === 'cowboy') {
        g.fillRect(-hw / 2 - 3, hTop + 0.5, hw + 6, 1.5);
        g.fillRect(-hw / 2 + 0.5, hTop - 3, hw - 1, 3.6);
      } else if (look.hat === 'police') {
        g.fillStyle = '#1a2a4a';
        g.fillRect(-hw / 2 - 0.5, hTop - 2, hw + 1, 3);
        g.fillStyle = '#e4c040';
        g.fillRect(-0.5, hTop - 1.5, 1.2, 1.2);
      } else if (look.hat === 'beanie') {
        g.fillRect(-hw / 2, hTop - 2, hw, 3);
      }
    }
    g.restore();
  };

  // ------------------------------------------------------------ vehicles
  A.drawCar = function (g, v) {
    const m = v.model;
    const L = m.w, Wd = m.h;
    g.save();
    g.translate(Math.round(v.x), Math.round(v.y));
    g.rotate(v.angle);
    // shadow
    g.fillStyle = 'rgba(15,10,5,0.4)';
    g.fillRect(-L / 2 + 2, -Wd / 2 + 3, L, Wd);
    const col = v.wrecked ? '#3a3230' : v.color;
    // body
    g.fillStyle = shade(col, -30);
    g.fillRect(-L / 2, -Wd / 2, L, Wd);
    g.fillStyle = col;
    g.fillRect(-L / 2 + 1, -Wd / 2 + 1, L - 2, Wd - 2);
    // wheels peeking
    g.fillStyle = '#141414';
    g.fillRect(-L / 2 + 4, -Wd / 2 - 1, 6, 2); g.fillRect(L / 2 - 10, -Wd / 2 - 1, 6, 2);
    g.fillRect(-L / 2 + 4, Wd / 2 - 1, 6, 2); g.fillRect(L / 2 - 10, Wd / 2 - 1, 6, 2);
    if (m.bus || m.box || m.fire) {
      g.fillStyle = shade(col, 15);
      g.fillRect(-L / 2 + 2, -Wd / 2 + 2, L - 14, Wd - 4);
      g.fillStyle = '#2a3a4a';
      g.fillRect(L / 2 - 11, -Wd / 2 + 2, 5, Wd - 4); // cab glass
      if (m.bus) {
        g.fillStyle = '#a8c8d8';
        for (let k = -L / 2 + 4; k < L / 2 - 14; k += 6) { g.fillRect(k, -Wd / 2 + 1, 4, 2); g.fillRect(k, Wd / 2 - 3, 4, 2); }
      }
      if (m.fire) {
        g.fillStyle = '#d0d0d0';
        g.fillRect(-L / 2 + 4, -2, L - 18, 4); // ladder
        g.fillStyle = '#909090';
        for (let k = -L / 2 + 5; k < L / 2 - 14; k += 4) g.fillRect(k, -2, 1, 4);
      }
      if (m.box && v.variant) {
        g.fillStyle = '#f2e2c0';
        g.fillRect(-L / 2 + 6, -3, 18, 6);
      }
    } else {
      // windshield, roof, rear window
      const roofL = L * 0.42;
      g.fillStyle = '#2a3a48';
      g.fillRect(-roofL / 2 + 4, -Wd / 2 + 2, 4, Wd - 4); // front glass (towards +x)
      g.fillRect(-roofL / 2 - 3, -Wd / 2 + 2, 3, Wd - 4);
      g.fillStyle = m.vinyl ? '#f0e8d8' : shade(col, 18);
      g.fillRect(-roofL / 2, -Wd / 2 + 2, roofL - 2, Wd - 4);
      if (m.wood && !v.wrecked) {
        g.fillStyle = '#8a5a2a';
        g.fillRect(-L / 2 + 2, -Wd / 2 + 1, L - 8, 2);
        g.fillRect(-L / 2 + 2, Wd / 2 - 3, L - 8, 2);
      }
      if (m.stripes && !v.wrecked) {
        g.fillStyle = '#f0f0f0';
        g.fillRect(-L / 2 + 1, -1.5, L - 2, 1);
        g.fillRect(-L / 2 + 1, 0.5, L - 2, 1);
      }
      if (m.bed) {
        g.fillStyle = shade(col, -45);
        g.fillRect(-L / 2 + 2, -Wd / 2 + 2, 10, Wd - 4);
      }
      if (m.checker) {
        g.fillStyle = '#1a1a1a';
        for (let k = 0; k < 6; k++) g.fillRect(-L / 2 + 6 + k * 3, (k % 2) * 2 - Wd / 2 + 1, 2, 1);
        g.fillStyle = '#f0e0a0';
        g.fillRect(-2, -2, 4, 4);
      }
      if (m.mural && !v.wrecked) {
        g.fillStyle = '#e4a92a';
        g.beginPath(); g.arc(-6, -Wd / 2 + 2, 3, 0, Math.PI); g.fill();
        g.fillStyle = '#d9621e';
        g.beginPath(); g.arc(-6, Wd / 2 - 2, 3, Math.PI, 0); g.fill();
      }
      if (m.police) {
        g.fillStyle = '#f0f0f0';
        g.fillRect(-L / 2 + 1, -Wd / 2 + 1, 8, Wd - 2);
        g.fillRect(L / 2 - 8, -Wd / 2 + 1, 7, Wd - 2);
        const on = v.siren && (performance.now() / 150) % 2 < 1;
        g.fillStyle = on ? '#ff3030' : '#801818';
        g.fillRect(-3, -Wd / 2 + 2, 3, (Wd - 4) / 2);
        g.fillStyle = on ? '#3050ff' : '#182880';
        g.fillRect(-3, 0, 3, (Wd - 4) / 2);
      }
      if (m.medic) {
        g.fillStyle = '#c02020';
        g.fillRect(-6, -1, 8, 2);
        g.fillRect(-3, -4, 2, 8);
      }
    }
    // lights
    g.fillStyle = v.lights ? '#fff6c0' : '#d8d0a0';
    g.fillRect(L / 2 - 1, -Wd / 2 + 1, 1, 3);
    g.fillRect(L / 2 - 1, Wd / 2 - 4, 1, 3);
    g.fillStyle = v.braking ? '#ff3020' : '#8a1a10';
    g.fillRect(-L / 2, -Wd / 2 + 1, 1, 3);
    g.fillRect(-L / 2, Wd / 2 - 4, 1, 3);
    if (v.hp < 35 && !v.wrecked) {
      g.fillStyle = 'rgba(40,40,40,0.5)';
      g.fillRect(L / 2 - 8, -3, 5, 6);
    }
    g.restore();
  };

  // ------------------------------------------------------------ animals
  A.drawAnimal = function (g, a) {
    const d = a.def, s = d.size;
    g.save();
    g.translate(Math.round(a.x), Math.round(a.y));
    if (d.bird && a.flying) {
      g.translate(0, -10 - Math.sin(a.t * 3) * 2);
      g.fillStyle = 'rgba(0,0,0,0.15)';
      g.fillRect(-2, 12, 4, 2);
      g.fillStyle = d.col;
      const flap = Math.sin(a.t * 18) * 3;
      g.fillRect(-1, -1, 3, 3);
      g.fillRect(-5, -1 - flap, 4, 1.5);
      g.fillRect(2, -1 - flap, 4, 1.5);
      g.restore();
      return;
    }
    const face = Math.cos(a.angle) >= 0 ? 1 : -1;
    g.scale(face, 1);
    if (a.dead) g.rotate(Math.PI / 2 * 0.9);
    g.fillStyle = 'rgba(15,10,5,0.3)';
    g.beginPath(); g.ellipse(0, 1, s * 0.8, s * 0.3, 0, 0, 7); g.fill();
    const leg = a.moving && !a.dead ? Math.sin(a.t * 14) * 1.5 : 0;
    g.fillStyle = shade(d.col, -25);
    if (d.bird) {
      g.fillStyle = d.col;
      g.fillRect(-2, -4, 4, 3);
      g.fillRect(1, -6, 2, 2);
      g.fillStyle = '#e4a92a';
      g.fillRect(3, -5, 1.5, 1);
      g.restore();
      return;
    }
    if (a.def === D.animals.snake) {
      g.fillStyle = d.col;
      for (let k = 0; k < 5; k++) g.fillRect(-6 + k * 2.5, -2 + Math.sin(a.t * 6 + k) * 1.5, 3, 2);
      g.restore();
      return;
    }
    if (a.def === D.animals.gator) {
      g.fillStyle = d.col;
      g.fillRect(-s, -4, s * 2, 5);
      g.fillRect(s - 2, -3, 6, 3);
      g.fillRect(-s - 5, -3, 6, 2);
      g.fillStyle = '#e8e0a0';
      g.fillRect(s + 2, -3, 1, 1);
      g.restore();
      return;
    }
    // quadruped
    const bl = s * 1.3, bh = s * 0.55;
    g.fillRect(-bl / 2 + 1 + leg, -3, 2, 4);
    g.fillRect(bl / 2 - 3 - leg, -3, 2, 4);
    g.fillStyle = d.col;
    g.fillRect(-bl / 2, -3 - bh, bl, bh);
    // head
    g.fillRect(bl / 2 - 1, -3 - bh - s * 0.35, s * 0.5, s * 0.45);
    if (a.def === D.animals.deer && a.buck) {
      g.fillStyle = '#d8c8a0';
      g.fillRect(bl / 2, -3 - bh - s * 0.35 - 4, 1, 4);
      g.fillRect(bl / 2 + 2, -3 - bh - s * 0.35 - 3, 1, 3);
    }
    g.fillStyle = shade(d.col, 20);
    g.fillRect(-bl / 2, -3 - bh, bl, 1);
    // tail
    g.fillStyle = d.col;
    g.fillRect(-bl / 2 - 2, -3 - bh + 1, 2, 1.5);
    if (a.def === D.animals.rabbit) {
      g.fillStyle = '#f0e8e0';
      g.fillRect(-bl / 2 - 1, -3 - bh, 2, 2);
      g.fillStyle = d.col;
      g.fillRect(bl / 2, -3 - bh - s * 0.35 - 3, 1, 3);
    }
    if (a.def === D.animals.cattle) {
      g.fillStyle = '#f0e8e0';
      g.fillRect(-2, -3 - bh + 1, 4, 3);
    }
    g.restore();
  };

  // ------------------------------------------------------------ minimap image
  A.buildMiniMap = function (world) {
    const cv = document.createElement('canvas');
    cv.width = world.W;
    cv.height = world.H;
    const g = cv.getContext('2d');
    const img = g.createImageData(world.W, world.H);
    const rgb = {};
    for (const k in base) {
      const n = parseInt(base[k].slice(1), 16);
      rgb[k] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    rgb[T.BLDG] = [58, 44, 36];
    rgb[T.ROAD] = [222, 206, 170];
    rgb[T.HWY] = [240, 200, 110];
    rgb[T.BRIDGE] = [240, 200, 110];
    rgb[T.WALK] = [150, 140, 120];
    for (let i = 0; i < world.tile.length; i++) {
      const c = rgb[world.tile[i]] || [255, 0, 255];
      const o = world.obj[i];
      const dim = o === O.TREE || o === O.PINE ? 0.8 : 1;
      img.data[i * 4] = c[0] * dim;
      img.data[i * 4 + 1] = c[1] * dim;
      img.data[i * 4 + 2] = c[2] * dim;
      img.data[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return cv;
  };
})();

// ---- 04_population.js
// RHAPSODY — the living population: ~1,000 named people with homes, jobs, families,
// schedules, memories and opinions. Aging, marriage, births, deaths and city growth
// tick once per in-game day.
'use strict';
(function () {
  const D = R.data;

  const SKIN = ['#f1c9a5', '#e0ac7e', '#c68a5a', '#a0663c', '#7a4a2a', '#5a3620', '#f5d6b8'];
  const HAIR = ['#1a1210', '#3a2418', '#5a3a1e', '#8a5a2a', '#c89a50', '#d8c090', '#6a2a1a', '#9a9a9a', '#e0e0e0'];
  const TOPS = ['#8a4a1e', '#c8781e', '#e4a92a', '#7a8a2e', '#2a7d7a', '#5c2a4a', '#a8401c', '#e8dcc0', '#3a5a8a', '#6a4a3a', '#b05a6a', '#4a6a5a', '#d8b890', '#2a2a2a'];
  const BOTTOMS = ['#3a5a8a', '#2a3a5a', '#4a3a2a', '#6a5a3a', '#2a2a2a', '#8a7a5a', '#5a3a4a', '#a88a5a'];

  const Pop = (R.Population = function (world, seed) {

    this.seed = seed;

    this.day = 0;

  const P = Pop.prototype;

  P.makeLook = function (rnd, p) {
    const fem = p.fem;
    const look = {
      skin: rnd.pick(SKIN), hair: rnd.pick(p.age > 60 ? HAIR.slice(7) : HAIR.slice(0, 7)),
      hairStyle: rnd.chance(0.15) ? 2 : fem ? 1 : rnd.chance(0.25) ? 1 : 0,
      top: rnd.pick(TOPS), bottom: rnd.pick(BOTTOMS), fem, kid: p.age < 14,
      build: rnd.chance(0.25) ? 2 : rnd.chance(0.3) ? 0 : 1, beard: !fem && p.age > 17 && rnd.chance(0.35),
      shades: rnd.chance(0.12), dress: fem && rnd.chance(0.5), hat: null, hatCol: null, stripe: null, lapel: null,
    };
    const role = p.role;
    if (role === 'cop' || role === 'detective') {
      look.top = role === 'cop' ? '#2a3a6a' : '#6a5a4a';
      look.bottom = '#1a2a4a';
      look.hat = role === 'cop' ? 'police' : 'fedora';
      look.hatCol = '#4a3a2a';
      look.dress = false;
    } else if (role === 'capo' || role === 'soldier' || role === 'don') {
      look.top = rnd.pick(['#2a2a30', '#3a2a24', '#2a3040', '#4a2a2a']);
      look.bottom = look.top;
      look.stripe = 'rgba(255,255,255,0.18)';
      look.lapel = '#e8d8b8';
      look.hat = 'fedora';
      look.hatCol = '#1a1614';
      look.chain = true;
      look.dress = false;
      look.build = role === 'soldier' ? 2 : look.build;
    } else if (role === 'farmer' || role === 'hunter') {
      look.hat = rnd.chance(0.6) ? 'cowboy' : 'cap';
      look.hatCol = rnd.pick(['#8a6a3a', '#5a3a1a', '#c8a060']);
      look.bottom = '#3a5a8a';
    } else if (role === 'dockhand' || role === 'fisher' || role === 'worker') {
      look.hat = rnd.chance(0.5) ? 'beanie' : 'cap';
      look.hatCol = rnd.pick(['#6a2a1a', '#2a4a6a', '#4a4a4a']);
    } else if (role === 'nurse' || role === 'doctor') {
      look.top = '#e8e8e0';
    } else if (role === 'priest') {
      look.top = '#1a1a1a';
      look.bottom = '#1a1a1a';
      look.lapel = '#f0f0f0';
    } else if (p.city === 'dust' && rnd.chance(0.4)) {
      look.hat = 'cowboy';
      look.hatCol = rnd.pick(['#c8a060', '#8a6a3a', '#e8dcc0']);
    } else if (rnd.chance(0.08)) {

  P.newPerson = function (rnd, city, opts) {
