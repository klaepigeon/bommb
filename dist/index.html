    const lasts = D.lastAll[city] || D.lastAll.avalon;
    const p = {
      id: this.people.length,
      first: rnd.pick(fem ? D.firstF : D.firstM),
      last: opts.last || rnd.pick(lasts),
      nick: null,
      fem, age: opts.age, city, home: opts.home || 0, work: 0, role: 'none',
      arch: opts.arch || rnd.weighted([['friendly', 3], ['grumpy', 2], ['timid', 2], ['tough', 1.5], ['gossip', 1.5], ['square', 2], ['hustler', 1.2], ['flirt', 1], ['eccentric', 0.8], ['pious', 1]]),
      opinion: 0, fear: 0, fam: 0, met: false, alive: true,
      spouse: -1, parents: opts.parents || [], kids: [], wealth: rnd.int(5, 80), mem: [],
      place: null, lastGreet: -1, faction: null, seed: rnd.int(0, 1e9), look: null, debt: 0, grudge: 0,
    };
    const a = D.archetypes[p.arch];
    p.tr = {
      brave: R.clamp(a.brave + (rnd() - 0.5) * 0.3, 0, 1), warm: R.clamp(a.warm + (rnd() - 0.5) * 0.3, 0, 1),
      lawful: R.clamp(a.lawful + (rnd() - 0.5) * 0.3, 0, 1), chatty: R.clamp(a.chatty + (rnd() - 0.5) * 0.3, 0, 1),
      greed: R.clamp(a.greed + (rnd() - 0.5) * 0.3, 0, 1),
    };
    if (p.age < 14) p.role = 'kid';
    else if (p.age < 18) p.role = 'student';
    this.people.push(p);
    (this.byCity[city] = this.byCity[city] || []).push(p);
    return p;
  };
  P.name = function (p) {
    return p.nick ? `${p.first} "${p.nick}" ${p.last}` : `${p.first} ${p.last}`;
  };
  P.short = function (p) {
    return p.nick ? `"${p.nick}"` : p.first;
  };
  P.title = function (p) {
    return D.roleNames[p.role] || 'Local';
  };

  P.generate = function () {
    const rnd = R.mulberry(this.seed + 404);
    const w = this.world;
    const cityDefs = D.cities.map((d, i) => ({ id: d.id, c: w.cities[i], target: d.pop }));
    cityDefs.push({ id: 'county', c: w.countyCity(), target: 60, rural: true });
    // hamlet buildings are part of the county
    for (const h of w.hamlets) for (const b of h.buildings) { b.city = w.countyCity(); b.cityId = 'county'; w.countyCity().buildings.push(b); }
    for (const b of w.buildings) if (b && b.rural) b.cityId = 'county';

    for (const cd of cityDefs) {
      const homes = cd.c.buildings.filter((b) => D.btypes[b.type].house && b.type !== 'hotel');
      rnd.shuffle(homes);
      let pop = 0, hi = 0;
      while (pop < cd.target && hi < homes.length * 3) {
        const home = homes[hi % homes.length];
        hi++;
        const cap = D.btypes[home.type].house;
        if (home.residents.length >= cap) continue;
        // household
        const last = rnd.pick(D.lastAll[cd.id] || D.lastAll.avalon);
        const a1 = this.newPerson(rnd, cd.id, { age: rnd.int(19, 78), last, home: home.id });
        home.residents.push(a1.id);
        pop++;
        if (a1.age < 70 && rnd.chance(0.55) && home.residents.length < cap) {
          const a2 = this.newPerson(rnd, cd.id, { age: R.clamp(a1.age + rnd.int(-6, 6), 19, 80), last, home: home.id, fem: !a1.fem });
          a1.spouse = a2.id; a2.spouse = a1.id;
          home.residents.push(a2.id);
          pop++;
          const mom = a1.fem ? a1 : a2;
          const nk = mom.age < 50 ? rnd.weighted([[0, 2], [1, 3], [2, 3], [3, 1.5]]) : rnd.chance(0.3) ? 1 : 0;
          for (let k = 0; k < nk && home.residents.length < cap; k++) {
            const maxAge = Math.max(0, Math.min(mom.age - 18, 17));
            const kid = this.newPerson(rnd, cd.id, { age: rnd.int(0, maxAge), last, home: home.id, parents: [a1.id, a2.id] });
            a1.kids.push(kid.id); a2.kids.push(kid.id);
            home.residents.push(kid.id);
            pop++;
          }
        }
      }
      // jobs
      const adults = this.byCity[cd.id].filter((p) => p.age >= 18 && p.age < 67);
      rnd.shuffle(adults);
      let ai = 0;
      const jobsList = [];
      for (const b of cd.c.buildings) {
        const jobs = D.btypes[b.type].jobs;
        if (jobs) for (const role in jobs) for (let k = 0; k < jobs[role]; k++) jobsList.push([b, role]);
      }
      rnd.shuffle(jobsList);
      // prioritise essential roles
      const prio = { cop: 0, capo: 0, bartender: 1, fence: 1, clerk: 2 };
      jobsList.sort((a, b) => (prio[a[1]] ?? 3) - (prio[b[1]] ?? 3));
      for (const [b, role] of jobsList) {
        if (ai >= adults.length) break;
        const p = adults[ai++];
        this.assignJob(p, b, role, rnd);
      }
      for (const p of this.byCity[cd.id]) {
        if (p.role !== 'none') continue;
        if (p.age >= 67) p.role = 'retired';
        else if (cd.rural) p.role = rnd.pick(['farmer', 'hunter', 'hunter', 'drifter']);
        else p.role = rnd.weighted([['none', 4], ['hustler', 2], ['musician', 0.6], ['artist', 0.5], ['preacher', 0.3], ['drifter', 0.8], [cd.id === 'port' || cd.id === 'bayou' ? 'fisher' : 'none', 1.5]]);
      }
      // The Don
      if (!cd.rural) {
        const club = cd.c.buildings.find((b) => b.type === 'social');
        const def = D.cities.find((d) => d.id === cd.id);
        const [first, ...rest] = def.don.replace(/".*?"\s/, '').split(' ');
        const don = this.newPerson(rnd, cd.id, { age: rnd.int(52, 71), last: rest.join(' '), fem: /Mama|Soledad/.test(def.don), arch: 'tough' });
        don.first = first;
        const m = def.don.match(/"(.*?)"/);
        if (m) don.nick = m[1];
        don.role = 'don';
        don.work = club ? club.id : 0;
        don.faction = def.family;
        don.home = club ? club.id : 0;
        don.wealth = 5000;
        don.tr.brave = 1;
        don.isDon = true;
        if (club) club.owner = don.id;
        cd.c.don = don.id;
      }
    }
    // look + nicknames + businesses owners
    for (const p of this.people) {
      if (!p.look) p.look = this.makeLook(R.mulberry(p.seed), p);
      if ((p.role === 'soldier' || p.role === 'capo' || p.role === 'hustler') && rnd.chance(0.55)) p.nick = rnd.pick(D.nick);
      if (p.role === 'cop' || p.role === 'detective') p.faction = 'law';
    }
    for (const b of w.buildings) {
      if (!b || b.owner !== null) continue;
      if (b.workers.length) b.owner = b.workers[0];
      else if (b.residents.length) b.owner = b.residents[0];
    }
    this.count0 = this.people.length;
  };

  P.assignJob = function (p, b, role, rnd) {
    p.work = b.id;
    p.role = role;
    b.workers.push(p.id);
    if (role === 'capo' || role === 'soldier') {
      const def = D.cities.find((d) => d.id === p.city);
      p.faction = def ? def.family : null;
      p.arch = rnd.chance(0.6) ? 'tough' : 'hustler';
      p.tr.brave = Math.max(p.tr.brave, 0.7);
      p.tr.lawful = Math.min(p.tr.lawful, 0.2);
    }
    if (role === 'cop' || role === 'detective') {
      p.faction = 'law';
      p.tr.lawful = Math.max(p.tr.lawful, 0.8);
      p.tr.brave = Math.max(p.tr.brave, 0.6);
    }
    if (role === 'bouncer' || role === 'guard') p.tr.brave = Math.max(p.tr.brave, 0.75);
    p.look = null;
  };

  P.get = function (id) { return this.people[id]; };
  P.building = function (id) { return id ? this.world.buildings[id] : null; };

  // -------------------------------------------------- schedules
  // Returns desired place for hour h (float), on day d.
  P.desired = function (p, h, day) {
    const w = this.world;
    const hr = R.hash2(p.id, day, 71);
    const home = p.home;
    if (!p.alive) return null;
    if (p.jailed && p.jailed > day) return { b: 0, gone: true };
    if (p.forceSpot && h >= 7 && h < 23) return { spot: p.forceSpot };
    if (p.isDon && p.work) return { b: p.work }; // the Don holds court at his club
    if (p.role === 'kid' || p.role === 'student') {
      if (p.age >= 6 && h >= 8 && h < 15) {
        const school = this.cityBuilding(p.city, 'school');
        if (school) return { b: school.id };
      }
      if (p.age >= 7 && h >= 15 && h < 19 && hr < 0.6) return { spot: this.spotFor(p, day, 'park') };
      return { b: home };
    }
    const work = p.work ? w.buildings[p.work] : null;
    if (work && !work.destroyed) {
      const bt = D.btypes[work.type];
      let [o, c] = bt.hours || [9, 17];
      if (c <= o) c += 24;
      let len = c - o;
      let start = o, end = c;
      if (len > 10) {
        // shift work: split by id
        const shifts = Math.ceil(len / 9);
        const s = p.id % shifts;
        start = o + s * (len / shifts);
        end = start + len / shifts;
      }
      const off = R.hash2(p.id, 3, 3) < 0.15 && day % 7 === p.id % 7; // day off
      let hh = h;
      if (hh < start && end > 24 && hh + 24 < end) hh += 24;
      if (!off && hh >= start && hh < end) return { b: work.id };
    }
    // nightlife / leisure
    const night = h >= 22 || h < 6;
    const owl = p.role === 'hustler' || p.role === 'drifter' || p.role === 'musician' || p.arch === 'flirt';
    if ((h >= 23 || h < 6) && !(owl && h < 3)) return { b: home };
    if (h < 7) return { b: home };
    // outdoor jobs
    if (['musician', 'preacher', 'hustler', 'artist', 'fisher', 'drifter'].includes(p.role) && h >= 10 && h < 21) {
      return { spot: this.spotFor(p, day, p.role === 'fisher' ? 'pier' : null) };
    }
    if (p.role === 'hunter' || p.role === 'farmer') return h < 20 ? { spot: this.spotFor(p, day, 'porch') } : { b: home };
    const leisureChance = 0.2 + p.tr.chatty * 0.35;
    if (hr < leisureChance && h >= 17) {
      const lb = this.leisureFor(p, day, night);
      if (lb) return { b: lb.id };
    }
    if (hr > 0.75 && h >= 9 && h < 20) return { spot: this.spotFor(p, day, null) };
    return { b: home };
  };
  P.cityBuilding = function (cityId, type) {
    const c = this.cityObj(cityId);
    return c ? c.buildings.find((b) => b.type === type && !b.destroyed) : null;
  };
  P.cityObj = function (id) {
    if (id === 'county') return this.world.countyCity();
    return this.world.cities.find((c) => c.id === id);
  };
  P.leisureFor = function (p, day, night) {
    const c = this.cityObj(p.city);
    if (!c) return null;
    if (!c._leisure) c._leisure = c.buildings.filter((b) => D.btypes[b.type].leisure);
    const opts = c._leisure.filter((b) => !b.destroyed && (p.age >= 21 || (b.type !== 'bar' && b.type !== 'club')) && (b.type !== 'church' || p.arch === 'pious' || day % 7 === 6));
    if (!opts.length) return null;
    return opts[Math.floor(R.hash2(p.id, day, 5) * opts.length)];
  };
  P.spotFor = function (p, day, kind) {
    const c = this.cityObj(p.city);
    if (!c) return null;
    if (!c._spots) c._spots = this.world.spots.filter((s) => s.city === c);
    let opts = kind ? c._spots.filter((s) => s.kind === kind) : c._spots;
    if (!opts.length) opts = c._spots;
    if (!opts.length) return null;
    return opts[Math.floor(R.hash2(p.id, day, 9) * opts.length)];
  };

  // -------------------------------------------------- memories & opinions
  P.remember = function (p, kind, text, day) {
    p.mem.unshift({ kind, text, day });
    if (p.mem.length > 6) p.mem.length = 6;
  };
  P.addNews = function (city, text) {
    this.news.unshift({ day: this.day, city, text });
    if (this.news.length > 40) this.news.length = 40;
  };
  P.family = function (p) {
    const out = [];
    if (p.spouse >= 0) out.push(['spouse', this.people[p.spouse]]);
    for (const k of p.kids) out.push(['kid', this.people[k]]);
    for (const k of p.parents) out.push(['parent', this.people[k]]);
    return out.filter((x) => x[1]);
  };
  // A fact the person can mention when chatting (life-sim flavor)
  P.lifeFact = function (p) {
    const rnd = R.mulberry(p.seed + this.day);
    const facts = [];
    const fam = this.family(p);
    for (const [rel, q] of fam) {
      if (!q.alive) facts.push(`I still miss ${q.first}. Not a day goes by.`);
      else if (rel === 'kid' && q.age < 1) facts.push(`We just had a baby. ${q.first}. Hardly slept since.`);
      else if (rel === 'kid' && q.age < 13) facts.push(`My ${q.fem ? 'girl' : 'boy'} ${q.first} turned ${q.age}. Growing like a weed.`);
      else if (rel === 'kid' && q.age < 18) facts.push(`${q.first} is ${q.age} and already thinks ${q.fem ? 'she' : 'he'} knows everything.`);
      else if (rel === 'kid') facts.push(`${q.first} works as a ${D.roleNames[q.role] || 'something'} now. Proud of ${q.fem ? 'her' : 'him'}.`);
      else if (rel === 'spouse') facts.push(`${q.first} and me, ${Math.max(1, Math.min(p.age, q.age) - 20)} years married. Still dance on Fridays.`);
    }
    const work = p.work ? this.world.buildings[p.work] : null;
    if (work) facts.push(`I work over at ${work.name}. ${rnd.pick(['It pays the bills.', 'Boss is a creep.', "Can't complain.", 'Best job I ever had. Only job, too.'])}`);
    for (const m of p.mem.slice(0, 2)) if (m.text) facts.push(m.text);
    const news = this.news.find((n) => n.city === p.city && this.day - n.day < 3);
    if (news) facts.push(`You hear? ${news.text}`);
    return facts.length ? rnd.pick(facts) : 'Nothing new under the sun.';
  };

  // -------------------------------------------------- daily life sim
  P.dailyTick = function (game) {
    this.day++;
    const rnd = R.mulberry(this.seed + this.day * 977);
    const yrs = game.settings.lifeSpeed; // years per day
    const births = [], deaths = [];
    const aging = yrs >= 1 ? Math.round(yrs) : R.hash2(this.day, 1, 1) < yrs ? 1 : 0;
    for (const p of this.people) {
      if (!p.alive) continue;
      if (p.jailed && p.jailed <= this.day) p.jailed = 0;
      if (aging) {
        const was = p.age;
        p.age += aging;
        if (was < 14 && p.age >= 14) { p.look.kid = false; p.role = 'student'; }
        if (was < 18 && p.age >= 18) this.comeOfAge(p, rnd);
        if (p.age > 72 && rnd.chance((p.age - 70) * 0.012 * aging) && !p.isDon) deaths.push(p);
      }
      // mood drift towards neutral
      p.fear *= 0.8;
      p.grudge = Math.max(0, p.grudge - 3);
    }
    const byD = {};
    for (const p of deaths) {
      this.kill(p, 'old age');
      (byD[p.city] = byD[p.city] || []).push(p);
    }
    for (const c in byD) {
      const ds = byD[c];
      this.addNews(c, ds.length === 1 ? `${this.name(ds[0])} passed peacefully at ${ds[0].age}.` : `Services held for ${this.name(ds[0])} (${ds[0].age}) and ${ds.length - 1} other${ds.length > 2 ? 's' : ''}.`);
    }
    if (aging) {
      // marriages
      for (const cityId in this.byCity) {
        const singles = this.byCity[cityId].filter((p) => p.alive && p.spouse < 0 && p.age >= 20 && p.age <= 55 && !p.isDon);
        rnd.shuffle(singles);
        for (let i = 0; i < singles.length; i++) {
          const a = singles[i];
          if (a.spouse >= 0 || !rnd.chance(0.06 * aging)) continue;
          const b = singles.find((q) => q.spouse < 0 && q !== a && q.fem !== a.fem && Math.abs(q.age - a.age) < 9);
          if (!b) continue;
          a.spouse = b.id; b.spouse = a.id;
          const wife = a.fem ? a : b, hub = a.fem ? b : a;
          if (rnd.chance(0.7)) wife.last = hub.last;
          this.moveIn(b, a.home);
          this.addNews(cityId, `Wedding bells: ${a.first} ${a.last} married ${b.first}.`);
          this.remember(a, 'life', `I got married to ${b.first}. Can you believe it?`, this.day);
          this.remember(b, 'life', `Married ${a.first}. Best day of my life.`, this.day);
        }
        // births
        for (const p of this.byCity[cityId]) {
          if (!p.alive || !p.fem || p.spouse < 0 || p.age < 20 || p.age > 42) continue;
          const dad = this.people[p.spouse];
          if (!dad || !dad.alive) continue;
          const nk = p.kids.length;
          if (!rnd.chance((nk < 3 ? 0.14 : 0.03) * aging)) continue;
          const home = this.world.buildings[p.home];
          if (home && home.residents.length >= D.btypes[home.type].house + 2) continue;
          const kid = this.newPerson(rnd, cityId, { age: 0, last: dad.last, home: p.home, parents: [p.id, dad.id] });
          kid.look = this.makeLook(R.mulberry(kid.seed), kid);
          kid.look.skin = rnd.chance(0.5) ? p.look.skin : dad.look.skin;
          kid.look.hair = rnd.chance(0.5) ? p.look.hair : dad.look.hair;
          p.kids.push(kid.id); dad.kids.push(kid.id);
          if (home) home.residents.push(kid.id);
          births.push(kid);
          this.remember(p, 'life', `We just had a ${kid.fem ? 'baby girl' : 'baby boy'}. ${kid.first}.`, this.day);
        }
      }
    }
    // one birth announcement line per town
    const byC = {};
    for (const k of births) (byC[k.city] = byC[k.city] || []).push(k);
    for (const c in byC) {
      const ks = byC[c];
      const names = ks.slice(0, 2).map((k) => `${k.first} ${k.last}`);
      this.addNews(c, ks.length === 1 ? `It's a ${ks[0].fem ? 'girl' : 'boy'}! Welcome ${names[0]}.` : `${ks.length} babies born, including ${names.join(' and ')}.`);
    }
    this.fillJobs(rnd);
    this.growCities(game, rnd);
    return { births, deaths };
  };

  P.comeOfAge = function (p, rnd) {
    p.role = 'none';
    p.look = this.makeLook(R.mulberry(p.seed + 1), p);
    // try to move out
    const c = this.cityObj(p.city);
    if (!c) return;
    const free = c.buildings.find((b) => D.btypes[b.type].house && !b.destroyed && b.residents.length < D.btypes[b.type].house && b.type !== 'hotel');
    if (free && rnd.chance(0.6)) this.moveIn(p, free.id);
    this.remember(p, 'life', `I'm ${p.age} now. Out of school, looking for work.`, this.day);
  };
  P.moveIn = function (p, bid) {
    const old = this.world.buildings[p.home];
    if (old) old.residents = old.residents.filter((id) => id !== p.id);
    p.home = bid;
    const nb = this.world.buildings[bid];
    if (nb && !nb.residents.includes(p.id)) nb.residents.push(p.id);
  };
  P.fillJobs = function (rnd) {
    for (const c of this.world.cities.concat([this.world.countyCity()])) {
      const pool = (this.byCity[c.id] || []).filter((p) => p.alive && p.age >= 18 && p.age < 67 && (p.role === 'none' || p.role === 'drifter'));
      if (!pool.length) continue;
      for (const b of c.buildings) {
        if (b.destroyed) continue;
        const jobs = D.btypes[b.type].jobs;
        if (!jobs) continue;
        for (const role in jobs) {
          const have = b.workers.filter((id) => this.people[id].alive && this.people[id].role === role && this.people[id].work === b.id).length;
          for (let k = have; k < jobs[role] && pool.length; k++) {
            const p = pool.pop();
            this.assignJob(p, b, role, rnd);
            p.look = this.makeLook(R.mulberry(p.seed + 2), p);
            this.remember(p, 'life', `Started as a ${D.roleNames[role]} at ${b.name}.`, this.day);
          }
        }
      }
    }
  };
  P.kill = function (p, cause) {
    if (!p.alive) return;
    p.alive = false;
    p.deathCause = cause;
    p.diedDay = this.day;
    const b = this.world.buildings[p.work];
    if (b) b.workers = b.workers.filter((id) => id !== p.id);
    const h = this.world.buildings[p.home];
    if (h) h.residents = h.residents.filter((id) => id !== p.id);
    for (const [rel, q] of this.family(p)) {
      if (!q.alive) continue;
      this.remember(q, 'grief', cause === 'player' ? `Somebody killed my ${rel === 'spouse' ? (p.fem ? 'wife' : 'husband') : rel === 'kid' ? (p.fem ? 'daughter' : 'son') : p.fem ? 'mother' : 'father'} ${p.first}. I will find out who.` : `We buried ${p.first} this week.`, this.day);
      if (cause === 'player') q.grudge = 100;
    }
    if (p.spouse >= 0) {
      const s = this.people[p.spouse];
      if (s) s.spouse = -1;
    }
  };

  // Construction: cities with pressure build on vacant lots.
  P.growCities = function (game, rnd) {
    const w = this.world;
    // finish projects
    for (const pr of this.projects.slice()) {
      if (this.day < pr.done) continue;
      this.projects.splice(this.projects.indexOf(pr), 1);
      w.setSite(pr.lot, false);
      const b = w.buildOnLot(pr.lot, pr.type, rnd);
      if (b) {
        b.cityId = pr.lot.city.id;
        b.new = true;
        this.addNews(b.city.id, `Ribbon cut on the new ${D.btypes[b.type].name.toLowerCase()}: ${b.name}.`);
        if (b.city._leisure) b.city._leisure = null;
        R.bus.emit('building:new', b);
      }
    }
    for (const c of w.cities) {
      const pop = (this.byCity[c.id] || []).filter((p) => p.alive).length;
      let housing = 0;
      for (const b of c.buildings) if (!b.destroyed && D.btypes[b.type].house) housing += D.btypes[b.type].house;
      const pressure = pop / Math.max(1, housing);
      c.prosperity = R.clamp(c.prosperity + (c.prosperity < 60 ? 1.5 : 0.4) - c.heat * 0.05, 0, 100);
      c.heat *= 0.7;
      const active = this.projects.filter((p) => p.lot.city === c).length;
      const lots = c.lots.filter((l) => !l.used && !l.site);
      if (!lots.length || active >= 2 + (c.prosperity > 70 ? 1 : 0)) continue;

'use strict';

  const D = R.data, T = D.T, TS = R.TILE;

    PF.stamp = new Int32Array(n);
    PF.from = new Int32Array(n);
    PF.closed = new Int32Array(n);
    PF.gen = 1;
    PF.budget = 0;
  };
  PF.cost = function (x, y) {
    const w = PF.w;
    if (w.solidPed(x, y)) return -1;
    const t = w.tile[y * w.W + x];
    if (t === T.WATER) return 6;
    if (t === T.ROAD || t === T.HWY) return 2.2;
    if (t === T.FOREST || t === T.MARSH) return 1.4;
    if (w.obj[y * w.W + x] && D.smallObj[w.obj[y * w.W + x]]) return 1.6;
    return 1;
  };
  PF.find = function (sx, sy, gx, gy, maxNodes) {
    const w = PF.w;
    if (!w.inb(gx, gy) || !w.inb(sx, sy)) return null;
    if (PF.cost(gx, gy) < 0) {
      // goal is solid (e.g. a door): allow it as final node
    }
    maxNodes = maxNodes || 4000;
    PF.budget -= 1;
    const gen = ++PF.gen;
    const W = w.W;
    const start = sy * W + sx, goal = gy * W + gx;
    const heap = [start], hf = [0];
    PF.stamp[start] = gen;
    PF.g[start] = 0;
    PF.from[start] = -1;
    let n = 0;
    const push = (i, f) => {
      heap.push(i); hf.push(f);
      let k = heap.length - 1;
      while (k > 0) {
        const p = (k - 1) >> 1;
        if (hf[p] <= hf[k]) break;
        [heap[p], heap[k]] = [heap[k], heap[p]];
        [hf[p], hf[k]] = [hf[k], hf[p]];
        k = p;
      }
    };
    const pop = () => {
      const top = heap[0];
      const li = heap.pop(), lf = hf.pop();
      if (heap.length) {
        heap[0] = li; hf[0] = lf;
        let k = 0;
        for (;;) {
          const l = k * 2 + 1, r = l + 1;
          let m = k;
          if (l < heap.length && hf[l] < hf[m]) m = l;
          if (r < heap.length && hf[r] < hf[m]) m = r;
          if (m === k) break;
          [heap[m], heap[k]] = [heap[k], heap[m]];
          [hf[m], hf[k]] = [hf[k], hf[m]];
          k = m;
        }
      }
      return top;
    };
    while (heap.length && n++ < maxNodes) {
      const cur = pop();
      if (cur === goal) {
        const out = [];
        let c = cur;
        while (c !== -1) { out.push(c); c = PF.from[c]; }
        out.reverse();
        return out.map((i) => ({ x: i % W, y: (i / W) | 0 }));
      }
      if (PF.closed[cur] === gen) continue;
      PF.closed[cur] = gen;
      const cx = cur % W, cy = (cur / W) | 0;

        const nx = cx + R.DIRS[d][0], ny = cy + R.DIRS[d][1];

    if (!tr) {

    }
    if (!look) {
      const fake = { fem: rnd.chance(0.5), age: opts.kid ? 9 : rnd.int(18, 75), role: opts.role || 'none', city: opts.city || 'avalon' };
      look = game.pop.makeLook(R.mulberry(rnd.int(0, 1e9)), fake);
      look.fem = fake.fem;
      if (opts.kid) look.kid = true;

      state: 'idle', timer: rnd() * 2, goal: null, path: null, pathI: 0, weapon: 'fists', armed: false, ammo: 0,
      cop: !!cop, hostile: false, target: null, down: 0, dead: false, bubble: null, alert: null,
      cash: opts.cash !== undefined ? opts.cash : rnd.int(2, 45), loot: [], witness: null, anger: 0, fear: 0,
      tag: opts.tag || (person ? 'named' : 'ambient'), speedMul: 1, greeted: 0, lastSeenPlayer: 0, stuck: 0,
      strangerName: null, drunk: opts.drunk || 0, faction: person ? person.faction : opts.faction || null, alertT: 0,

  AP.arm = function (h, w) {

  AP.makeAnimal = function (x, y, type) {

        h.dir = R.dir4(Math.cos(a), Math.sin(a));
        if (R.dist(h.x, h.y, src.x, src.y) > TS * 4) this.moveActor(h, Math.cos(a) * walkSpeed, Math.sin(a) * walkSpeed, dt), (h.walk += dt * 10);
        if (think && R.rng() < 0.04) this.say(h, R.dialog.line(h.watchKind || 'cheer', h));
        if (h.timer <= 0) { h.state = 'idle'; h.timer = 1; }
        break;
      }
      case 'work': {
        // construction workers hammer, firemen spray
        h.timer -= dt;
        h.walk = 0;
        if (h.tag === 'fireman') R.env.fireman(h, dt);
        if (h.timer <= 0) this.startWander(h);
        break;
      }
      case 'perform': {
        h.timer -= dt;
        h.walk += dt * 3;
        if (think && R.rng() < 0.2) game.fx.note(h.x, h.y - 20);
        if (think && R.rng() < 0.02) this.say(h, R.dialog.line(h.role === 'preacher' ? 'preach' : 'perform', h));
        if (h.timer <= 0) this.hangAround(h);
        break;
      }
      case 'sleep': {
        h.walk = 0;
        break;
      }
      case 'surrender': {
        h.walk = 0;
        h.timer -= dt;
        if (h.timer <= 0) this.setFlee(h, pl, 10);
        break;
      }
    }
  };

  AP.hangAround = function (h) {
    const s = h.spot;
    h.state = 'hang';
    h.timer = 3 + R.rng() * 6;
    if (!s) { h.state = 'idle'; return; }
    if ((h.role === 'musician' || h.role === 'preacher') && R.rng() < 0.7) {
      h.state = 'perform';
      h.timer = 8 + R.rng() * 8;
      return;
    }
    const rad = h.stay ? 1 : 3;
    for (let k = 0; k < 6; k++) {
      const tx = s.x + R.rng.int(-rad, rad), ty = s.y + R.rng.int(-rad, rad);
      if (!this.game.world.solidPed(tx, ty) && !D.roadTile[this.game.world.t(tx, ty)]) {
        this.goTo(h, tx, ty, { near: 4 });
        break;
      }
    }
    if (R.rng() < 0.25) this.ambientChat(h);
  };

  AP.startWander = function (h) {
    h.state = 'wander';
    h.timer = 4 + R.rng() * 8;
    h.wdir = h.wdir !== undefined ? h.wdir : R.rng.int(0, 3);
  };
  // Walk along sidewalks / paths, choose at tile centers
  AP.sidewalkWalk = function (h, dt, speed) {
    const w = this.game.world;
    const tx = (h.x / TS) | 0, ty = (h.y / TS) | 0;
    const cx = tx * TS + 8, cy = ty * TS + 8;
    const [dx, dy] = R.DIRS[h.wdir];
    const good = (x, y) => {
      if (w.solidPed(x, y)) return false;
      const t = w.t(x, y);
      if (h.crossing && D.roadTile[t]) return true;
      return t === T.WALK || t === T.PLAZA || t === T.PARK || t === T.DOCK || t === T.PARKING || (!w.cityAt(x, y) && !D.waterTile[t] && !D.roadTile[t]);
    };
    // at center? decide
    const nearCenter = Math.abs(h.x - cx) < 2.5 && Math.abs(h.y - cy) < 2.5;
    if (nearCenter && h.lastDecide !== ty * 10000 + tx) {
      h.lastDecide = ty * 10000 + tx;
      const t = w.t(tx, ty);
      if (!D.roadTile[t]) h.crossing = false;
      const opts = [];
      for (let d = 0; d < 4; d++) {
        if (d === (h.wdir + 2) % 4) continue;
        if (good(tx + R.DIRS[d][0], ty + R.DIRS[d][1])) opts.push(d);
      }
      // crosswalk: road ahead then sidewalk beyond
      if (!opts.includes(h.wdir) && D.roadTile[w.t(tx + dx, ty + dy)] && R.rng() < 0.35) {
        let k = 1;
        while (k < 5 && D.roadTile[w.t(tx + dx * k, ty + dy * k)]) k++;
        if (k < 5 && w.t(tx + dx * k, ty + dy * k) === T.WALK) {
          h.crossing = true;
          opts.push(h.wdir);
        }
      }
      if (opts.includes(h.wdir) && R.rng() < 0.8) {} // keep going
      else if (opts.length) h.wdir = R.rng.pick(opts);
      else h.wdir = (h.wdir + 2) % 4;
      h.x = cx; h.y = cy;
    }
    const [ddx, ddy] = R.DIRS[h.wdir];
    const ok = this.moveActor(h, ddx * speed, ddy * speed, dt);
    if (!ok) { h.wdir = (h.wdir + 1 + R.rng.int(0, 2)) % 4; h.lastDecide = -1; }
    h.dir = h.wdir;
    h.walk += dt * speed * 0.35;
  };

  AP.ambientChat = function (h) {
    // Two neighbours chat; or a comment about the world
    const others = this.near(h.x, h.y, 40, (o) => o !== h && o.kind === 'h' && !o.dead && !o.cop && (o.state === 'idle' || o.state === 'hang'));
    if (others.length && R.rng() < 0.6) {
      const o = others[0];
      this.say(h, R.dialog.chatter(h, o));
      setTimeout(() => { if (!o.dead && !o.removed) this.say(o, R.dialog.chatterReply(o, h)); }, 1600);
      const a = Math.atan2(o.y - h.y, o.x - h.x);
      h.dir = R.dir4(Math.cos(a), Math.sin(a));
      o.dir = R.dir4(-Math.cos(a), -Math.sin(a));
    }
  };

  AP.setFlee = function (h, from, secs) {
    if (h.dead) return;
    h.state = 'flee';
    h.threat = from;
    h.timer = secs || 8;
    h.goal = null;
    h.fleeBias = (R.rng() - 0.5) * 0.8;
    if (h.person) h.person.place = null;
  };
  AP.setCower = function (h, secs) {
    h.state = 'cower';
    h.timer = secs || 6;
    h.goal = null;
  };
  AP.setFight = function (h, target) {
    if (h.dead) return;
    h.state = 'fight';
    h.target = target;
    h.goal = null;
    if (target === this.game.player) h.hostile = true;
    if (h.armed) h.drawn = true;
  };

  // ------------------------------------------------ perception
  AP.perceive = function (h) {
    const game = this.game, pl = game.player;
    if (h.state === 'fight' || h.state === 'report' || h.state === 'surrender' || h.state === 'sleep') return;
    const d = R.dist(h.x, h.y, pl.x, pl.y);
    const seesPlayer = d < TS * 10 && !pl.inside && (d < TS * 3 || game.world.los(h.x, h.y - 8, pl.x, pl.y - 8));
    // player with a gun drawn close by
    if (seesPlayer && pl.weaponOut && D.weapons[pl.weapon] && D.weapons[pl.weapon].gun && d < TS * 7 && h.state !== 'flee' && h.state !== 'cower') {
      if (h.cop) {
        if (!game.law.warned(h)) {
          this.say(h, R.dialog.line('copWarnGun', h));
          game.law.brandish(h);
        }
      } else if (h.hostile || (h.faction && h.faction !== 'law' && game.jobs.familyStanding(h.faction) < -20)) this.setFight(h, pl);
      else if (h.tr.brave > 0.8 && h.armed) {
        this.say(h, R.dialog.line('standoff', h));
        h.drawn = true;
        h.state = 'watch';
        h.watchT = pl;
        h.timer = 3;
      } else if (h.tr.brave < 0.35 || d < TS * 3) {
        this.setCower(h, 5);
        this.say(h, R.dialog.line('cower', h));
      } else {
        this.setFlee(h, pl, 7);
        this.say(h, R.dialog.line('seeGun', h));
      }
      return;
    }
    // masked stranger in daylight makes people nervous
    if (seesPlayer && pl.masked && d < TS * 4 && h.state === 'idle' && R.rng() < 0.08) this.say(h, R.dialog.line('seeMask', h));
    // cops recognise wanted player
    if (h.cop && seesPlayer) game.law.copSees(h, d);
    // hostile factions attack on sight
    if (seesPlayer && h.faction && h.faction !== 'law' && h.armed && game.jobs.familyStanding(h.faction) <= -50 && d < TS * 8) {
      this.say(h, R.dialog.line('rivalSpot', h));
      this.setFight(h, pl);
      return;
    }
    // grudge holders (you killed their kin) confront you
    if (seesPlayer && h.person && h.person.grudge > 60 && d < TS * 6 && !pl.masked && R.rng() < 0.3) {
      this.say(h, R.dialog.line('grudge', h));
      if (h.tr.brave > 0.45) this.setFight(h, pl);
      else this.setFlee(h, pl, 6);
      h.person.grudge = 40;
      return;
    }
    // bump reactions and people commenting on the player
    if (seesPlayer && d < TS * 2.2 && h.state !== 'talk' && h.state !== 'flee' && h.state !== 'cower' && R.rng() < 0.03 && (!h.greetCool || game.clock.t > h.greetCool)) {
      h.greetCool = game.clock.t + 40;
      this.say(h, R.dialog.passing(h, pl));
    }
  };

  // ------------------------------------------------ reporting crimes (RDR2-style witnesses)
  AP.startReport = function (h) {
    const game = this.game, w = game.world;
    if (!h.witness || h.witness.done) return;
    h.state = 'report';
    h.alert = 'report';
    // nearest of: cop actor, phone booth, police station
    const tx = (h.x / TS) | 0, ty = (h.y / TS) | 0;
    let best = null, bd = 1e9;
    for (const c of this.list) {
      if (!c.cop || c.dead || c.removed) continue;
      const d = R.dist(h.x, h.y, c.x, c.y);
      if (d < bd) { bd = d; best = { cop: c, tx: (c.x / TS) | 0, ty: (c.y / TS) | 0 }; }
    }
    for (const p of w.phones) {
      const d = R.dist(tx, ty, p.x, p.y) * TS;
      if (d < bd) { bd = d; best = { tx: p.x, ty: p.y }; }
    }
    const city = w.cityAt(tx, ty);
    if (city) {
      const ps = city.buildings.find((b) => b.type === 'police');
      if (ps) {
        const d = R.dist(tx, ty, ps.out.x, ps.out.y) * TS;
        if (d < bd) { bd = d; best = { tx: ps.out.x, ty: ps.out.y }; }
      }
    }
    if (!best || bd > TS * 60) {
      // nowhere to report: they'll tell the next lawman they meet (still counts as a slower report)
      best = null;
      h.witness.slow = true;
      h.timer = 25 + R.rng() * 15;
    }
    h.reportTo = best;
    if (best) this.goTo(h, best.tx, best.ty, { near: best.cop ? 20 : 14 });
    h.reportT = 0;
  };
  AP.updateReport = function (h, dt, speed) {
    const game = this.game;
    const wt = h.witness;
    if (!wt || wt.done || wt.silenced) { h.state = 'idle'; h.alert = null; return; }
    h.reportT += dt;
    if (!h.reportTo) {
      h.timer -= dt;
      this.moveActor(h, Math.cos(h.ang) * speed * 0.5, Math.sin(h.ang) * speed * 0.5, dt);
      if (h.timer <= 0) { game.law.report(wt.crime, h); wt.done = true; h.alert = null; this.setFlee(h, game.player, 5); }
      return;
    }
    if (h.reportTo.cop && !h.reportTo.cop.dead) {
      h.goal.tx = (h.reportTo.cop.x / TS) | 0;
      h.goal.ty = (h.reportTo.cop.y / TS) | 0;
    }
    const arrived = this.steer(h, dt, speed);
    if (arrived) {
      // phones take a moment
      h.phoneT = (h.phoneT || 0) + dt;
      h.walk = 0;
      if (h.phoneT > (h.reportTo.cop ? 0.5 : 2.5)) {
        this.say(h, R.dialog.line(h.reportTo.cop ? 'reportCop' : 'reportPhone', h));
        game.law.report(wt.crime, h);
        wt.done = true;
        h.alert = null;
        this.setFlee(h, game.player, 6);
      }
    } else if (h.reportT > 90) {
      wt.done = true; // gave up
      h.alert = null;
      h.state = 'idle';
    }
  };

  // ------------------------------------------------ noise events (gunshots, explosions, screams)
  AP.noise = function (x, y, radius, kind, source) {
    const game = this.game;
    const near = this.near(x, y, radius);
    for (const a of near) {
      if (a.dead || a === source) continue;
      if (a.state === 'sleep') {
        const d = R.dist(a.x, a.y, x, y);
        if (R.rng() < (kind === 'rustle' ? 0.35 : 1) * (1 - d / (radius + 1)) + (kind === 'rustle' ? 0 : 0.5)) {
          a.state = 'idle';
          a.timer = 1;
          a.x += 8;
          this.say(a, R.dialog.line('woken', a));
          const pl = this.game.player;
          if (pl.room && a.room === pl.room && !pl.room.b.playerOwned) {
            setTimeout(() => this.game.law.crime('burglary', pl.x, pl.y, { victim: a }), 400);
          }
        }
        continue;
      }
      if (kind === 'rustle') continue;
      if (a.kind === 'a') {
        if (a.def.bird) { a.flying = true; a.state = 'flee'; a.timer = 6; }
        else if (a.def.prey || !a.def.predator || R.rng() < 0.5) { a.state = 'flee'; a.target = source || game.player; a.timer = 6; }
        continue;
      }
      if (a.inCar) continue;
      if (a.cop) {
        if (kind === 'gunshot' || kind === 'blast' || kind === 'scream') game.law.copHears(a, x, y, kind);
        continue;
      }
      if (a.state === 'fight' || a.state === 'report') continue;
      if (a.hostile && a.armed) { this.setFight(a, game.player); continue; }
      const d = R.dist(a.x, a.y, x, y);
      if (kind === 'fight' && d < TS * 7 && a.state !== 'flee') {
        if (a.tr.brave > 0.45 && a.tag !== 'kid' && R.rng() < 0.6) { a.state = 'watch'; a.watchT = source || game.player; a.watchKind = 'cheer'; a.timer = 6 + R.rng() * 4; }
        else this.setFlee(a, source || game.player, 5);
        continue;
      }
      if (kind === 'gunshot' || kind === 'blast') {
        if (a.tr.brave < 0.3 && d < TS * 6) { this.setCower(a, 4 + R.rng() * 3); this.say(a, R.dialog.line('cower', a)); }
        else { this.setFlee(a, { x, y }, 8 + R.rng() * 5); if (R.rng() < 0.3) this.say(a, R.dialog.line('fleeing', a)); }
      }
    }
  };

  // ------------------------------------------------ animals
  AP.updateAnimal = function (a, dt) {
    const game = this.game, pl = game.player, def = a.def;
    a.t += dt;
    if (a.dead) return;
    a.timer -= dt;
    a.moving = false;
    // staggered by a blow
    if (a.stunT > 0) { a.stunT -= dt; return; }
    const hurt = a.hp < a.maxHp * 0.5;
    if (hurt && R.rng() < dt * 2) game.fx.blood(a.x, a.y - 2, 1);
    const dp = R.dist(a.x, a.y, pl.x, pl.y);
    const night = game.clock.isNight();
    const plTarget = pl.inCar || pl;
    const sneakMul = pl.sneak ? 0.45 : 1;
    let speed = def.speed * (a.state === 'flee' || a.state === 'hunt' || a.state === 'attack' ? 1 : 0.35);
    if (def.bird) {
      if (!a.flying && (dp < TS * 3.5 * sneakMul || a.state === 'flee')) {
        a.flying = true;
        a.state = 'flee';
        a.angle = Math.atan2(a.y - pl.y, a.x - pl.x) + (R.rng() - 0.5);
        a.timer = 8;
      }
      if (a.flying) {
        this.moveActor(a, Math.cos(a.angle) * def.speed, Math.sin(a.angle) * def.speed, dt);
        a.moving = true;
        if (a.timer <= 0) this.remove(a);
      } else if (a.timer <= 0) {
        a.angle = R.rng() * 6.28;
        a.timer = 1 + R.rng() * 2;
        this.moveActor(a, Math.cos(a.angle) * 8, Math.sin(a.angle) * 8, 0.3);
      }
      return;
    }
    switch (a.state) {
      case 'wander': {
        if (a.timer <= 0) {
          a.timer = 1.5 + R.rng() * 4;
          a.angle = R.rng() * 6.28;
          a.pause = R.rng() < 0.5;
        }
        if (!a.pause) {
          a.moving = true;
          if (!this.moveActor(a, Math.cos(a.angle) * speed, Math.sin(a.angle) * speed, dt)) a.angle += 1.5;
        }
        // perception
        if (def.prey && dp < TS * 7 * sneakMul && (!pl.sneak || dp < TS * 3)) { a.state = 'flee'; a.target = plTarget; a.timer = 5; }
        if (def.dog && dp < TS * 5 && a.timer < 0.2 && R.rng() < 0.3) { game.fx.text(a.x, a.y - 14, 'woof!', '#f2e2c0'); if (R.rng() < 0.3) { a.state = 'follow'; a.timer = 12; } }
        if (def.predator && !def.dog) {
          const aggro = (night ? def.night || 1 : 1) * (a.anger > 0 ? 3 : 1);
          if (!pl.inCar && dp < TS * (def.ambush ? 2.5 : 5) * aggro * sneakMul && (def === D.animals.bear || def === D.animals.gator || def === D.animals.snake || night || a.anger > 0 || R.rng() < 0.02)) {
            if (def === D.animals.snake && !a.warned) { a.warned = true; game.fx.text(a.x, a.y - 12, '*rattle*', '#e4a92a'); a.timer = 1.5; break; }
            a.state = 'attack';
            a.target = pl;
            a.timer = 12;
            if (def === D.animals.bear) game.fx.text(a.x, a.y - 20, 'ROAR', '#d9621e');
            if (def === D.animals.wolf) game.audio.sfx('howl');
          } else if (R.rng() < 0.01) {
            // hunt nearby prey
            const prey = this.near(a.x, a.y, TS * 12, (o) => o.kind === 'a' && !o.dead && o.def.prey && o !== a)[0];
            if (prey) { a.state = 'attack'; a.target = prey; a.timer = 10; }
          }
        }
        if (def.angry && dp < TS * 2.5 && R.rng() < 0.05) { a.state = 'attack'; a.target = pl; a.timer = 6; }
        break;
      }
      case 'follow': {
        if (dp > 24) {
          const ang = Math.atan2(pl.y - a.y, pl.x - a.x);
          a.angle = ang;
          a.moving = true;
          this.moveActor(a, Math.cos(ang) * def.speed * 0.6, Math.sin(ang) * def.speed * 0.6, dt);
        }
        if (a.timer <= 0) a.state = 'wander';
        break;
      }
      case 'flee': {
        const src = a.target || pl;
        const ang = Math.atan2(a.y - src.y, a.x - src.x) + Math.sin(a.t * 2) * 0.4;
        a.angle = ang;
        a.moving = true;
        const limp = hurt ? 0.45 : 1; // wounded animals can be run down
        if (!this.moveActor(a, Math.cos(ang) * def.speed * limp, Math.sin(ang) * def.speed * limp, dt)) a.target = { x: a.x + (R.rng() - 0.5) * 50, y: a.y + (R.rng() - 0.5) * 50 };
        if (a.timer <= 0) { a.state = 'wander'; a.target = null; }
        break;
      }
      case 'attack': {
        const tg = a.target;
        if (!tg || tg.dead || a.timer <= 0 || (tg === pl && (pl.inCar || pl.inside))) { a.state = 'wander'; a.target = null; break; }
        const d = R.dist(a.x, a.y, tg.x, tg.y);
        const ang = Math.atan2(tg.y - a.y, tg.x - a.x);
        a.angle = ang;
        if (d > (a.r + 8)) {
          a.moving = true;
          const lunge = def.ambush && d < 40 ? 1.8 : 1;
          this.moveActor(a, Math.cos(ang) * def.speed * lunge, Math.sin(ang) * def.speed * lunge, dt);
        } else {
          a.biteT = (a.biteT || 0) - dt;
          if (a.biteT <= 0) {
            a.biteT = 0.9;
            R.combat.damage(tg, def.dmg || 5, a, 'animal');
            game.fx.blood(tg.x, tg.y - 6, 5);
            if (tg.kind === 'a' && tg.dead) { a.state = 'wander'; a.timer = 20; a.pause = true; }
          }
        }
        // cowardly predators give up when hurt
        if (a.hp < a.maxHp * 0.2 && def !== D.animals.bear && !a.fledOnce) { a.fledOnce = true; a.state = 'flee'; a.target = pl; a.timer = 4; }
        break;
      }
    }
  };

  // ------------------------------------------------ population management around the player
  AP.manage = function () {
    const game = this.game, w = game.world, pl = game.player;
    const ptx = pl.x / TS, pty = pl.y / TS;
    // despawn far actors
    let humans = 0, animals = 0;
    for (const a of this.list) {
      const d = R.dist(a.x, a.y, pl.x, pl.y) / TS;
      if (a.inCar) continue;
      if (d > (a.dead ? 30 : 42) && !a.keep) { this.remove(a); continue; }
      if (a.kind === 'h' && !a.dead && (a.tag === 'ambient' || a.tag === 'kid')) humans++;
      if (a.kind === 'a' && !a.dead) animals++;
    }
    if (pl.room) return; // nothing spawns while you're indoors
    const city = w.cityAt(ptx | 0, pty | 0);
    const hour = game.clock.hour();
    const tod = hour < 5 ? 0.25 : hour < 7 ? 0.5 : hour < 20 ? 1 : hour < 23 ? 0.7 : 0.4;
    const weather = game.env.weather.rain > 0.3 ? 0.55 : 1;
    let target = 3;
    if (city) {
      const dc = R.dist(ptx, pty, city.cx, city.cy) / (city.nbx * 8);
      target = dc < 0.4 ? 26 : dc < 0.8 ? 18 : 11;
      if (city.id === 'avalon') target += 6;
    } else if (w.inCityRect(ptx | 0, pty | 0, 4)) target = 7;
    target = Math.round(target * tod * weather * game.settings.density);
    if (humans < target) {
      for (let k = 0; k < 3 && humans < target; k++) {
        const s = w.findNear(ptx, pty, 16, 30, (x, y) => {
          const t = w.t(x, y);
          return (t === T.WALK || t === T.PLAZA || t === T.PARK || (!city && (t === T.GRASS || t === T.DIRT || t === T.DESERT || t === T.SNOW || t === T.FOREST))) && !w.solidPed(x, y);
        });
        if (!s) continue;
        const sc = w.cityAt(s.x, s.y);
        const kid = hour > 7 && hour < 19 && R.rng() < 0.08;
        const h = this.makeHuman(s.x * TS + 8, s.y * TS + 8, { city: sc ? sc.id : 'county', kid, tag: kid ? 'kid' : 'ambient', drunk: hour > 22 || hour < 3 ? (R.rng() < 0.25 ? 1 : 0) : 0 });
        if (!sc) h.role = R.rng.pick(['hunter', 'drifter', 'farmer']);
        this.startWander(h);
        humans++;
        // nighttime muggers in the city, bounty hunters on the road
        if (sc && (hour >= 22 || hour < 4) && R.rng() < 0.08 * game.settings.events && !kid) {
          h.tag = 'mugger';
          this.arm(h, R.rng.pick(['knife', 'bat', 'revolver']));
          h.state = 'follow';
          h.timer = 30;
          h.hurry = false;
          h.onReach = (m) => R.events.mugging(m);
        } else if (sc && hour > 9 && hour < 21 && R.rng() < 0.03 * game.settings.events && !kid) {
          h.tag = 'pickpocket';
          h.state = 'follow';
          h.timer = 25;
          h.onReach = (m) => R.events.pickpocket(m);
        } else if (sc && R.rng() < 0.03 * game.settings.events && !kid) {
          h.tag = 'hustler';
          h.state = 'follow';
          h.timer = 25;
          h.onReach = (m) => R.events.hustlerPitch(m);
        }
      }
    }
    // wildlife
    if (!city && animals < 9 * game.settings.density) {
      const s = w.findNear(ptx, pty, 17, 32, (x, y) => !w.solidPed(x, y) && !D.roadTile[w.t(x, y)]);
      if (s) {
        const biome = w.biomeAt(s.x, s.y);
        const opts = Object.keys(D.animals).filter((k) => D.animals[k].biome.includes(biome) && (!D.animals[k].rare || R.rng() < 0.3));
        if (opts.length) {
          const type = R.rng.pick(opts);
          const def = D.animals[type];
          const n = def.herd ? R.rng.int(def.herd[0], def.herd[1]) : 1;
          for (let i = 0; i < n; i++) {
            const x = s.x * TS + 8 + (R.rng() - 0.5) * 40, y = s.y * TS + 8 + (R.rng() - 0.5) * 40;
            if (w.solidPed((x / TS) | 0, (y / TS) | 0) || w.isWater((x / TS) | 0, (y / TS) | 0) && type !== 'gator') continue;
            this.makeAnimal(x, y, type);
          }
        }
      }
    } else if (city && animals < 4) {
      const s = w.findNear(ptx, pty, 14, 26, (x, y) => { const t = w.t(x, y); return t === T.PARK || t === T.WALK || t === T.PLAZA || t === T.DOCK; });
      if (s) {
        const type = city.id === 'port' && R.rng() < 0.6 ? 'gull' : R.rng() < 0.2 ? 'dog' : 'crow';
        const def = D.animals[type];
        const n = def.herd ? R.rng.int(def.herd[0], def.herd[1]) : 1;
        for (let i = 0; i < n; i++) this.makeAnimal(s.x * TS + 8 + (R.rng() - 0.5) * 30, s.y * TS + 8 + (R.rng() - 0.5) * 30, type);
      }
    }
  };
})();

// ---- 06_traffic.js
// RHAPSODY — vehicles: lane-following civilian traffic with signals and yielding,
// arcade handling with drift for the player, chase steering for police/EMS,
// collisions, road rage and ambient pursuits.
'use strict';
(function () {
  const D = R.data, T = D.T, F = R.FLOW, TS = R.TILE;
  const DIRA = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];

  const Traffic = (R.Traffic = function (game) {
    this.game = game;
    this.list = [];
    this.hash = new R.SpatialHash(64);
    this.timer = 0;
    this.lightT = 0;
  });
  const TP = Traffic.prototype;

  TP.make = function (modelId, x, y, angle, opts) {
    opts = opts || {};
    const m = D.vehicles[modelId];
    const v = {
      kind: 'v', modelId, model: m, x, y, angle, speed: 0, vx: 0, vy: 0, color: opts.color || R.rng.pick(m.colors),
      hp: m.hp, maxHp: m.hp, driver: null, ai: opts.ai || null, lights: false, siren: false, braking: false, wrecked: false,
      burning: 0, parked: !!opts.parked, locked: opts.locked !== undefined ? opts.locked : R.rng.chance(0.4), owner: opts.owner || null,
      honkT: 0, wait: 0, variant: R.rng.chance(0.5), id: 0, r: m.w * 0.42, mode: opts.mode || 'lane', radio: R.rng.int(0, 2),
      stolen: false, keep: !!opts.keep,
    };
    v.id = ++this.nid || (this.nid = 1);
    this.list.push(v);
    return v;
  };
  TP.remove = function (v) {
    v.removed = true;
    if (v.driver && v.driver !== this.game.player) {
      this.game.actors.remove(v.driver);
    }
    for (const p of v.passengers || []) this.game.actors.remove(p);
  };

  TP.addDriver = function (v, opts) {
    const h = this.game.actors.makeHuman(v.x, v.y, Object.assign({ tag: 'driver' }, opts || {}));
    h.inCar = v;
    h.state = 'drive';
    v.driver = h;
    return h;
  };

  // ------------------------------------------------ update
  TP.update = function (dt) {
    const game = this.game;
    // traffic lights
    for (const it of game.world.inters) {
      if (!it.light) continue;
      it.timer += dt;
      const len = it.phase % 2 === 0 ? 9 : 2;
      if (it.timer > len) { it.timer = 0; it.phase = (it.phase + 1) % 4; }
    }
    this.hash.clear();
    for (const v of this.list) if (!v.removed) this.hash.insert(v);
    for (const v of this.list) {
      if (v.removed) continue;
      if (v.driver === game.player) this.playerDrive(v, dt);
      else if (v.driver && !v.driver.dead && !v.wrecked) {
        if (v.mode === 'lane') this.laneDrive(v, dt);
        else this.chaseDrive(v, dt);
      } else this.coast(v, dt);
      if (v.driver && v.driver !== game.player) { v.driver.x = v.x; v.driver.y = v.y; }
      for (const p of v.passengers || []) { p.x = v.x; p.y = v.y; }
      this.collide(v, dt);
      if (v.burning > 0) this.burn(v, dt);
      v.lights = game.clock.isNight() || game.env.weather.rain > 0.5 || game.env.weather.fog > 0.4;
      if (v.honkT > 0) v.honkT -= dt;
    }
    this.list = this.list.filter((v) => !v.removed);
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = 0.6;
      this.manage();
    }
  };

  // ------------------------------------------------ lane following
  TP.laneDrive = function (v, dt) {
    const w = this.game.world, ai = v.ai;
    const tcx = ai.tx * TS + 8, tcy = ai.ty * TS + 8;
    // Next tile center target
    const [dx, dy] = R.DIRS[ai.dir];
    let nx = ai.tx + dx, ny = ai.ty + dy;
    const tgx = nx * TS + 8, tgy = ny * TS + 8;
    const road = w.t(ai.tx, ai.ty);
    const hwy = road === T.HWY || road === T.BRIDGE;
    let want = v.model.top * (hwy ? 0.78 : 0.48) * (ai.reckless ? 1.6 : 1) * (this.game.env.weather.rain > 0.5 ? 0.85 : 1);
    // obstacle ahead
    const obst = this.obstacleAhead(v);
    if (obst) {
      const d = obst.d;
      want = d < v.model.w * 0.5 + 6 ? 0 : Math.min(want, (d - v.model.w * 0.5) * 2.2);
      if (v.speed < 5) {
        v.wait += dt;
        if ((obst.player || obst.o.driver === this.game.player) && v.wait > 1.8 && v.honkT <= 0) this.honk(v);
        if (v.wait > 7 && obst.o.kind === 'v' && !obst.o.driver) this.goAround(v);
        if (v.wait > 5 && obst.player && v.driver && v.driver.tr.brave > 0.7 && !v.driver.raged) this.roadRage(v);
      }
    } else v.wait = Math.max(0, v.wait - dt);
    // light / yield before entering intersection
    if (ai.hold) {
      want = 0;
      if (this.canEnter(v, nx, ny)) ai.hold = false;
    }
    v.braking = want < v.speed - 5;
    v.speed = R.approach(v.speed, want, (want > v.speed ? v.model.acc * 0.6 : 260) * dt);
    // move towards target
    const dist = R.dist(v.x, v.y, tgx, tgy);
    const step = v.speed * dt;
    if (dist <= step + 0.5 || dist < 1) {
      v.x = tgx; v.y = tgy;
      ai.tx = nx; ai.ty = ny;
      this.decide(v);
    } else {
      v.x += ((tgx - v.x) / dist) * step;
      v.y += ((tgy - v.y) / dist) * step;
    }
    const heading = Math.atan2(tgy - v.y, tgx - v.x);
    if (dist > 0.5) v.angle += R.angDiff(v.angle, heading) * Math.min(1, dt * 10);
    // lost the road (knocked off): switch to coasting
    if (!w.flow[w.idx(ai.tx, ai.ty)]) { v.mode = 'chase'; ai.wanderT = 3; }
  };
  TP.decide = function (v) {
    const w = this.game.world, ai = v.ai;
    const f = w.flow[w.idx(ai.tx, ai.ty)];
    const inX = !!(f & F.X);
    if (!inX) ai.turned = false;
    const valid = [];
    for (let d = 0; d < 4; d++) {
      if (d === (ai.dir + 2) % 4) continue;
      if (!(f & R.DIRBIT[d])) continue;
      const nx = ai.tx + R.DIRS[d][0], ny = ai.ty + R.DIRS[d][1];
      if (!w.inb(nx, ny)) continue;
      if (!(w.flow[w.idx(nx, ny)] & R.DIRBIT[d])) continue;
      valid.push(d);
    }
    let nd;
    if (!valid.length) {
      // dead end: u-turn into the opposite lane
      nd = (ai.dir + 2) % 4;
      const side = R.DIRS[(ai.dir + 3) % 4]; // left of travel
      let ok = false;
      for (let k = 1; k <= R.ROAD_W && !ok; k++) {
        const lx = ai.tx + side[0] * k, ly = ai.ty + side[1] * k;
        if (w.flow[w.idx(lx, ly)] & R.DIRBIT[nd]) { ai.tx = lx; ai.ty = ly; ok = true; }
      }
      if (!ok) { v.mode = 'chase'; ai.wanderT = 2; return; }
    } else if (inX && ai.turned) nd = valid.includes(ai.dir) ? ai.dir : valid[0];
    else {
      const opts = valid.map((d) => [d, d === ai.dir ? 3 : 1]);
      nd = R.rng.weighted(opts);
    }
    if (nd !== ai.dir && inX) ai.turned = true;
    ai.dir = nd;
    // entering an intersection?
    const nx = ai.tx + R.DIRS[nd][0], ny = ai.ty + R.DIRS[nd][1];
    if (!inX && w.flow[w.idx(nx, ny)] & F.X) ai.hold = !this.canEnter(v, nx, ny);
  };
  TP.canEnter = function (v, nx, ny) {
    const w = this.game.world;
    const it = w.interAt.get(w.idx(nx, ny));
    if (!it) return true;
    if (v.ai.reckless) return true;
    if (it.light) {
      const ew = v.ai.dir === 1 || v.ai.dir === 3;
      if (ew ? it.phase !== 0 : it.phase !== 2) return false;
    }
    // occupied by a crossing vehicle?
    const cx = it.cx * TS + 8, cy = it.cy * TS + 8;
    for (const o of this.hash.query(cx, cy, R.ROAD_W * 10)) {
      if (o === v || o.removed) continue;
      if (o.speed > 8 && o.ai && ((o.ai.dir & 1) !== (v.ai.dir & 1))) return false;
    }
    return true;
  };
  TP.obstacleAhead = function (v) {
    const fx = Math.cos(v.angle), fy = Math.sin(v.angle);
    const reach = v.model.w * 0.5 + 10 + v.speed * 0.45;
    let best = null;
    const test = (o, isPlayer) => {
      const rx = o.x - v.x, ry = o.y - v.y;
      const along = rx * fx + ry * fy;
      const lat = Math.abs(-rx * fy + ry * fx);
      const lw = o.kind === 'v' ? o.model.h * 0.5 + 2 : 7;
      if (along > 0 && along < reach + (o.kind === 'v' ? o.model.w * 0.5 : 0) && lat < lw) {
        const d = along - (o.kind === 'v' ? o.model.w * 0.5 : 0);
        if (!best || d < best.d) best = { d, o, player: isPlayer };
      }
    };
    for (const o of this.hash.query(v.x, v.y, reach + 30)) if (o !== v && !o.removed) test(o, false);
    for (const h of this.game.actors.near(v.x + fx * reach * 0.5, v.y + fy * reach * 0.5, reach * 0.6 + 8)) {
      if (h.kind === 'h' && !h.inCar && !h.dead) test(h, false);
      if (h.kind === 'a' && !h.dead && !h.flying) test(h, false);
    }
    const pl = this.game.player;
    if (!pl.inCar && !pl.inside) test(pl, true);
    return best;
  };
  TP.honk = function (v) {
    v.honkT = 2.5;
    this.game.fx.text(v.x, v.y - 14, 'HONK!', '#e4a92a');
    this.game.audio.sfx('horn', v.x, v.y);
    if (v.driver && R.rng() < 0.5) this.game.actors.say(v.driver, R.dialog.line('driverYell', v.driver));
  };
  TP.goAround = function (v) {
    v.mode = 'chase';
    v.ai.wanderT = 2.5;
    v.wait = 0;
  };
  TP.roadRage = function (v) {
    const h = v.driver;
    h.raged = true;
    this.exitVehicle(v, h);
    this.game.actors.say(h, R.dialog.line('roadRage', h));
    h.state = 'follow';
    h.hurry = true;
    h.timer = 10;
    h.onReach = (m) => {
      m.state = 'talk';
      m.timer = 4;
      m.anger = 60;
      this.game.ui.focusOn(m);
    };
  };

  // ------------------------------------------------ arcade steering (player + chasers)
  TP.physics = function (v, dt, throttle, steerTo, brake, handbrake) {
    const m = v.model;
    const fx = Math.cos(v.angle), fy = Math.sin(v.angle);
    let fwd = v.vx * fx + v.vy * fy;
    let lat = -v.vx * fy + v.vy * fx;
    // steering: rotate towards steerTo, rate limited by speed
    if (steerTo !== null) {
      const diff = R.angDiff(v.angle, steerTo);
      const rate = 3.2 * R.clamp(Math.abs(fwd) / 70, 0.15, 1) * (handbrake ? 1.5 : 1);
      const dir = fwd < -5 ? -1 : 1;
      v.angle += R.clamp(diff, -rate * dt, rate * dt) * (dir < 0 ? 1 : 1);
    }
    const top = m.top * (this.game.player.inCar === v ? 1.15 : 1);
    if (throttle > 0) fwd += m.acc * throttle * dt * (fwd < 0 ? 2.5 : 1);
    else if (throttle < 0) fwd += m.acc * throttle * 0.7 * dt * (fwd > 0 ? 2.5 : 1);
    if (brake) fwd = R.approach(fwd, 0, 380 * dt);
    fwd = R.clamp(fwd, -top * 0.45, top);
    // drag
    fwd *= 1 - dt * (throttle ? 0.25 : 0.9);
    const grip = handbrake ? 1.4 : this.game.env.weather.rain > 0.4 ? 5 : 8.5;
    lat = R.approach(lat, 0, Math.abs(lat) * grip * dt + 20 * dt);
    const nfx = Math.cos(v.angle), nfy = Math.sin(v.angle);
    v.vx = nfx * fwd - nfy * lat;
    v.vy = nfy * fwd + nfx * lat;
    v.speed = Math.hypot(v.vx, v.vy) * (fwd < 0 ? -1 : 1);
    v.drift = Math.abs(lat) > 60;
    v.braking = brake || (throttle < 0 && fwd > 0);
    this.integrate(v, dt);
  };
  TP.integrate = function (v, dt) {
    const w = this.game.world;
    const nx = v.x + v.vx * dt, ny = v.y + v.vy * dt;
    const hit = this.worldHit(v, nx, ny);
    if (!hit) {
      v.x = nx; v.y = ny;
    } else {
      const impact = Math.hypot(v.vx, v.vy);
      // try sliding along an axis
      if (!this.worldHit(v, nx, v.y)) { v.x = nx; v.vy *= -0.2; }
      else if (!this.worldHit(v, v.x, ny)) { v.y = ny; v.vx *= -0.2; }
      else { v.vx *= -0.3; v.vy *= -0.3; }
      if (impact > 70) {
        this.damage(v, (impact - 60) * 0.18, null);
        this.game.fx.sparks(v.x + Math.cos(v.angle) * v.model.w * 0.5, v.y + Math.sin(v.angle) * v.model.w * 0.5, 6);
        this.game.audio.sfx('crash', v.x, v.y);
        if (v.driver === this.game.player) this.game.cam.shake(Math.min(6, impact / 40));
      }
    }
    // knock over small street furniture (never a crime on its own)
    const tx = (v.x / TS) | 0, ty = (v.y / TS) | 0;
    for (let yy = ty - 1; yy <= ty + 1; yy++)
      for (let xx = tx - 1; xx <= tx + 1; xx++) {
        const o = w.o(xx, yy);
        if (!o || !D.smallObj[o] && o !== D.O.CONE && o !== D.O.BUSH && o !== D.O.FLOWERS && o !== D.O.FENCE && o !== D.O.REED) continue;
        if (Math.abs(v.speed) < 25) continue;
        const ox = xx * TS + 8, oy = yy * TS + 8;
        if (R.dist(ox, oy, v.x, v.y) < v.model.w * 0.5) {
          w.setO(xx, yy, 0);
          this.game.fx.debris(ox, oy, o);
          if (o === D.O.HYDRANT) this.game.env.geyser(ox, oy);
          v.vx *= 0.85; v.vy *= 0.85;
          this.game.audio.sfx('bump', ox, oy);
        }
      }
  };
  TP.worldHit = function (v, x, y) {
    const w = this.game.world;
    const c = Math.cos(v.angle), s = Math.sin(v.angle);
    const hl = v.model.w * 0.5 - 1, hw = v.model.h * 0.5 - 1;
    const pts = [[hl, hw], [hl, -hw], [-hl, hw], [-hl, -hw], [hl, 0], [-hl, 0]];
    for (const [a, b] of pts) {
      const px = x + a * c - b * s, py = y + a * s + b * c;
      if (w.solidCar((px / TS) | 0, (py / TS) | 0)) return true;
    }
    return false;
  };

  TP.playerDrive = function (v, dt) {
    const inp = this.game.input;
    const st = inp.stick;
    const mag = Math.min(1, Math.hypot(st.x, st.y));
    let throttle = 0, steer = null;
    if (mag > 0.15) {
      const want = Math.atan2(st.y, st.x);
      const diff = Math.abs(R.angDiff(v.angle, want));
      const fwd = v.vx * Math.cos(v.angle) + v.vy * Math.sin(v.angle);
      if (diff > 2.4 && fwd < 40) {
        throttle = -mag; // reverse
        steer = want + Math.PI;
      } else {
        throttle = mag * (diff > 1.6 ? 0.4 : 1);
        steer = want;
      }
    }
    const brake = inp.held('brake');
    this.physics(v, dt, throttle, steer, brake && Math.abs(v.speed) > 30 ? false : brake, brake && Math.abs(v.speed) > 30);
    if (inp.pressed('horn')) this.honkPlayer(v);
  };
  TP.honkPlayer = function (v) {
    this.game.audio.sfx('horn', v.x, v.y);
    this.game.fx.text(v.x, v.y - 14, 'HONK!', '#e4a92a');
    // peds in front jump out of the way; drivers ahead get annoyed
    for (const h of this.game.actors.near(v.x, v.y, 60)) {
      if (h.kind === 'h' && !h.inCar && !h.dead && h.state !== 'fight') {
        this.game.actors.setFlee(h, v, 1.2);
        if (R.rng() < 0.3) this.game.actors.say(h, R.dialog.line('honkedAt', h));
      }
    }
  };

  // Steering for police / EMS / reckless drivers: arcade physics towards a target with ray avoidance.
  TP.chaseDrive = function (v, dt) {
    const game = this.game, w = game.world, ai = v.ai || (v.ai = {});
    let tx, ty;
    if (ai.target) {
      const t = ai.target.inCar || ai.target;
      tx = t.x; ty = t.y;
    } else if (ai.dest) { tx = ai.dest.x; ty = ai.dest.y; }
    else {
      // wander: try to snap back onto a lane
      ai.wanderT = (ai.wanderT || 0) - dt;
      const t = ((v.x / TS) | 0), u = ((v.y / TS) | 0);
      const f = w.flow[w.idx(t, u)];
      if (ai.wanderT <= 0 && f && !(f & F.X)) {
        for (let d = 0; d < 4; d++) if (f & R.DIRBIT[d] && Math.abs(R.angDiff(v.angle, DIRA[d])) < 1.2) {
          v.mode = 'lane';
          ai.tx = t; ai.ty = u; ai.dir = d; ai.hold = false;
          v.speed = Math.max(0, v.vx * Math.cos(v.angle) + v.vy * Math.sin(v.angle));
          v.vx = v.vy = 0;
          return;
        }
      }
      tx = v.x + Math.cos(v.angle) * 80;
      ty = v.y + Math.sin(v.angle) * 80;
      if (ai.wanderT < -6) { v.mode = 'chase'; ai.dest = null; }
    }
    let want = Math.atan2(ty - v.y, tx - v.x);
    // ray avoidance
    const look = 30 + Math.abs(v.speed) * 0.35;
    const free = (ang) => {
      for (let k = 1; k <= 3; k++) {
        const px = v.x + Math.cos(ang) * look * (k / 3), py = v.y + Math.sin(ang) * look * (k / 3);
        if (w.solidCar((px / TS) | 0, (py / TS) | 0)) return k / 3 - 0.34;
      }
      return 1;
    };
    const cands = [0, 0.5, -0.5, 1.0, -1.0, 1.6, -1.6];
    let best = want, bs = -1e9;
    for (const c of cands) {
      const a = v.angle + c;
      const score = free(a) * 2 - Math.abs(R.angDiff(a, want)) * 0.6;
      if (score > bs) { bs = score; best = a; }
    }
    const d = R.dist(v.x, v.y, tx, ty);
    let throttle = d > 50 ? 1 : d / 60;
    if (ai.stopNear && d < ai.stopNear) throttle = 0;
    // stuck recovery
    ai.stuckT = Math.abs(v.speed) < 8 && throttle > 0.2 ? (ai.stuckT || 0) + dt : 0;
    if (ai.stuckT > 1.5) { ai.reverseT = 0.9; ai.stuckT = 0; }
    if (ai.reverseT > 0) { ai.reverseT -= dt; this.physics(v, dt, -0.8, best + Math.PI, false, false); return; }
    this.physics(v, dt, throttle, best, ai.stopNear && d < ai.stopNear, false);
    if (ai.onArrive && d < (ai.stopNear || 40) + 10) { const f = ai.onArrive; ai.onArrive = null; f(v); }
  };

  TP.coast = function (v, dt) {
    v.vx *= 1 - dt * 1.8;
    v.vy *= 1 - dt * 1.8;
    v.speed = Math.hypot(v.vx, v.vy);
    if (v.speed > 2) this.integrate(v, dt);
    v.braking = false;
  };

  // ------------------------------------------------ collisions car/car, car/ped
  TP.collide = function (v, dt) {
    const game = this.game;
    const sp = Math.hypot(v.vx, v.vy) || Math.abs(v.speed);
    for (const o of this.hash.query(v.x, v.y, v.model.w)) {
      if (o === v || o.removed || o.id < v.id) continue;
      const d = R.dist(v.x, v.y, o.x, o.y);
      const minD = (v.model.h + o.model.h) * 0.5 + Math.min(v.model.w, o.model.w) * 0.12;
      if (d < minD && d > 0.01) {
        const nx = (o.x - v.x) / d, ny = (o.y - v.y) / d;
        const push = (minD - d) * 0.5;
        const heavyV = v.model.hp > 200 ? 0.3 : 1, heavyO = o.model.hp > 200 ? 0.3 : 1;
        v.x -= nx * push * heavyV; v.y -= ny * push * heavyV;
        o.x += nx * push * heavyO; o.y += ny * push * heavyO;
        const rel = Math.abs((v.vx - o.vx) * nx + (v.vy - o.vy) * ny) + Math.abs(v.speed - o.speed) * 0.3;
        if (rel > 25) {
          this.damage(v, rel * 0.1, o.driver);
          this.damage(o, rel * 0.1, v.driver);
          game.fx.sparks((v.x + o.x) / 2, (v.y + o.y) / 2, 5);
          game.audio.sfx('crash', v.x, v.y);
          // kick lane cars out of their lane
          for (const c of [v, o]) if (c.mode === 'lane' && c.driver !== game.player) { c.speed = 0; c.wait = 1; }
          if (o.mode === 'chase' || !o.driver) { o.vx += nx * rel * 0.5; o.vy += ny * rel * 0.5; }
          const pl = game.player;
          const other = v.driver === pl ? o : o.driver === pl ? v : null;
          if (other && other.driver && other.driver.kind === 'h' && !other.driver.dead) this.aggrieved(other, rel);
          if (v.driver === pl || o.driver === pl) game.cam.shake(Math.min(5, rel / 30));
        }
        if (v.mode === 'lane' && v.driver !== game.player) { v.speed *= 0.5; }
      }
    }
    // pedestrians and animals
    if (sp < 25) return;
    for (const a of game.actors.near(v.x, v.y, v.model.w * 0.55 + 4)) {
      if (a.dead || a.inCar || (a.kind === 'a' && a.flying)) continue;
      const rx = a.x - v.x, ry = a.y - v.y;
      const c = Math.cos(v.angle), s = Math.sin(v.angle);
      const along = rx * c + ry * s, lat = -rx * s + ry * c;
      if (Math.abs(along) < v.model.w * 0.5 + 2 && Math.abs(lat) < v.model.h * 0.5 + 2) {
        R.combat.runOver(v, a, sp);
      }
    }
    const pl = game.player;
    if (!pl.inCar && !pl.inside && !pl.dead && v.driver !== pl) {
      const rx = pl.x - v.x, ry = pl.y - v.y;
      const c = Math.cos(v.angle), s = Math.sin(v.angle);
      if (Math.abs(rx * c + ry * s) < v.model.w * 0.5 + 2 && Math.abs(-rx * s + ry * c) < v.model.h * 0.5 + 2) R.combat.runOver(v, pl, sp);
    }
  };
  TP.aggrieved = function (car, force) {
    const h = car.driver;
    if (!h || h.raged) return;
    if (car.driver.cop) return;
    this.game.actors.say(h, R.dialog.line(force > 80 ? 'crashBig' : 'crashSmall', h));
    if (h.tr.brave > 0.55 && R.rng() < 0.6) {
      car.mode = 'chase';
      car.ai = car.ai || {};
      setTimeout(() => { if (!car.removed && car.driver === h && !h.dead) this.roadRage(car); }, 900);
    }
  };
  TP.damage = function (v, amt, by) {
    if (v.wrecked) return;
    v.hp -= amt;
    if (v.hp < 20 && v.burning <= 0 && v.hp > 0 && R.rng() < 0.4) v.burning = 0.01;
    if (v.hp <= 0) this.explode(v, by);
  };
  TP.burn = function (v, dt) {
    v.burning += dt;
    if (R.rng() < dt * 10) this.game.fx.smoke(v.x, v.y - 4, v.burning > 3);
    if (v.burning > 6 && !v.wrecked) this.explode(v);
  };
  TP.explode = function (v, by) {
    if (v.wrecked) return;
    v.wrecked = true;
    v.hp = 0;
    v.burning = 0;
    R.combat.explosion(v.x, v.y, 44, 70, by || null, true);
    if (v.driver === this.game.player) this.exitVehicle(v, this.game.player);
    else if (v.driver) {
      const d = v.driver;
      this.exitVehicle(v, d);
      R.combat.damage(d, 200, by, 'blast');
    }
  };

  // ------------------------------------------------ enter / exit
  TP.exitVehicle = function (v, h) {
    const w = this.game.world;
    // find a free spot beside the car (left side first)
    const sides = [v.angle - Math.PI / 2, v.angle + Math.PI / 2, v.angle + Math.PI, v.angle];
    let px = v.x, py = v.y;
    for (const a of sides) {
      const x = v.x + Math.cos(a) * (v.model.h * 0.5 + 7), y = v.y + Math.sin(a) * (v.model.h * 0.5 + 7);
      if (!w.solidPed((x / TS) | 0, (y / TS) | 0)) { px = x; py = y; break; }
    }
    h.x = px; h.y = py;
    if (v.driver === h) v.driver = null;
    h.inCar = null;
    if (h !== this.game.player) {
      h.state = 'idle';
      h.timer = 0.5;
    }
    v.mode = 'chase';
    v.ai = v.ai || {};
    v.ai.target = null;
    v.ai.dest = null;
  };
  TP.nearestCar = function (x, y, r) {
    let best = null, bd = r;
    for (const v of this.list) {
      if (v.removed || v.wrecked) continue;
      const d = R.dist(x, y, v.x, v.y) - v.model.w * 0.3;
      if (d < bd) { bd = d; best = v; }
    }
    return best;
  };

  // ------------------------------------------------ spawning around the player
  TP.manage = function () {
    const game = this.game, w = game.world, pl = game.player;
    const cam = game.cam;
    let n = 0;
    for (const v of this.list) {
      const d = R.dist(v.x, v.y, pl.x, pl.y) / TS;
      const mine = v === pl.inCar || v.owner === 'player' || v.keep;
      if (d > 46 && !mine) { this.remove(v); continue; }
      if (!v.parked && v.driver && v.driver !== pl) n++;
    }
    const ptx = (pl.x / TS) | 0, pty = (pl.y / TS) | 0;
    const city = w.cityAt(ptx, pty);
    const hour = game.clock.hour();
    const tod = hour < 5 ? 0.3 : hour < 7 ? 0.6 : hour >= 7 && hour < 9 ? 1.3 : hour >= 16 && hour < 19 ? 1.3 : hour < 22 ? 1 : 0.6;
    let target = city ? (city.id === 'avalon' ? 20 : 13) : 5;
    target = Math.round(target * tod * game.settings.traffic);
    for (let k = 0; k < 3 && n < target; k++) {
      const s = w.findNear(ptx, pty, 18, 34, (x, y) => {
        const f = w.flow[w.idx(x, y)];
        return f && !(f & F.X);
      });
      if (!s) break;
      const px = s.x * TS + 8, py = s.y * TS + 8;
      if (cam.onScreen(px, py, 40)) continue;
      if (this.hash.query(px, py, 36).length) continue;
      const f = w.flow[w.idx(s.x, s.y)];
      const dirs = [0, 1, 2, 3].filter((d) => f & R.DIRBIT[d]);
      const dir = R.rng.pick(dirs);
      const sc = w.cityAt(s.x, s.y);
      let model = R.rng.weighted(sc ? D.civCars : D.ruralCars);
      if (sc && R.rng() < 0.05) model = 'bus';
      const v = this.make(model, px, py, DIRA[dir], { ai: { tx: s.x, ty: s.y, dir, turned: false } });
      this.addDriver(v, { city: sc ? sc.id : 'county', role: model === 'taxi' ? 'cabbie' : model === 'truck' ? 'trucker' : 'none' });
      if (R.rng() < 0.02 * game.settings.events) v.ai.reckless = true;
      n++;
      // ambient police chase
      if (sc && R.rng() < 0.012 * game.settings.events * game.calm() * game.calm() && !game.law.active()) this.ambientChase(v);
      else if (sc && R.rng() < 0.12 && this.list.filter((q) => q.modelId === 'police' && !q.removed).length < 2) {
        // patrol car
        v.model = D.vehicles.police; v.modelId = 'police'; v.color = '#1a1a24';
        v.driver.cop = true;
        v.driver.look = game.pop.makeLook(R.mulberry(R.rng.int(0, 1e9)), { fem: R.rng.chance(0.3), age: 35, role: 'cop', city: sc.id });
        game.actors.arm(v.driver, 'revolver');
        v.patrol = true;
      }
    }
    // parked cars in lots nearby
    if (city) {
      const parked = this.list.filter((v) => v.parked && !v.removed).length;
      if (parked < 8) {
        const s = w.findNear(ptx, pty, 14, 30, (x, y) => w.t(x, y) === T.PARKING);
        if (s) {
          const px = s.x * TS + 8, py = s.y * TS + 8;
          if (!cam.onScreen(px, py, 30) && !this.hash.query(px, py, 20).length)
            this.make(R.rng.weighted(D.civCars.filter(([m]) => m !== 'truck' && m !== 'taxi')), px, py, Math.PI / 2 * (R.rng() < 0.5 ? 1 : -1), { parked: true });
        }
      }
    }
  };

  TP.ambientChase = function (runner) {
    runner.ai.reckless = true;
    runner.model = D.vehicles.muscle; runner.modelId = 'muscle';
    const game = this.game;
    // police car spawns behind
    const back = runner.angle + Math.PI;
    const cx = runner.x + Math.cos(back) * 60, cy = runner.y + Math.sin(back) * 60;
    if (game.world.solidCar((cx / TS) | 0, (cy / TS) | 0)) return;
    const cop = this.make('police', cx, cy, runner.angle, { mode: 'chase' });
    const d = this.addDriver(cop, { cop: true, role: 'cop' });
    d.look = game.pop.makeLook(R.mulberry(R.rng.int(0, 1e9)), { fem: false, age: 40, role: 'cop', city: 'avalon' });
    cop.siren = true;
    cop.ai = { target: runner.driver, stopNear: 0 };
    runner.chasedBy = cop;
    game.ui.toast('Police pursuit in progress nearby.');
  };
})();

// ---- 07_combat.js
// RHAPSODY — combat: melee, hitscan guns, thrown molotovs/dynamite, explosions,
// knockouts vs kills, self-defence rules and NPC fighting AI.
'use strict';
(function () {
  const D = R.data, T = D.T, TS = R.TILE;
  const C = (R.combat = {});
  C.projectiles = [];

  const game = () => R.game;

  // hit test: humans are about 6px wide and stand from y-18 to y
  function hitHuman(a, x, y) {
    if (a.kind === 'h') return Math.abs(x - a.x) < 5 && y < a.y + 2 && y > a.y - 18;
    if (a.kind === 'a') return R.dist(x, y, a.x, a.y - a.def.size * 0.4) < a.def.size * 0.7 + 2;
    return false;
  }

  // ---------------------------------------------------------------- damage
  C.damage = function (target, amt, source, kind) {
    const g = game();
    if (!target || target.dead) return;
    const byPlayer = source === g.player || (source && source.driver === g.player);
    if (target === g.player) {
      if (source && source.kind === 'h') source.attackedPlayer = true;
      return g.player.hurt(amt, source, kind);
    }
    if (target.kind === 'v') return g.traffic.damage(target, amt, source);
    if (g.cheats && g.cheats.oneHit && byPlayer) amt = 999;
    target.hp -= amt;
    target.lastHitBy = source;
    if (target.kind === 'a') {
      if (kind === 'melee') { target.hp -= amt * 0.4; target.stunT = target.def.size >= 12 ? 0.08 : 0.2; } // animals have no guard against a swing
      g.fx.blood(target.x, target.y - 4, kind === 'bullet' ? 4 : 2);
      if (target.hp <= 0) C.kill(target, source);
      else {
        if (target.def.predator || target.def.angry || target.def.dog) { target.state = 'attack'; target.target = source && source.kind ? (source.inCar ? null : source) : g.player; target.timer = 10; target.anger = 1; }
        else { target.state = 'flee'; target.target = source || g.player; target.timer = 6; }
      }
      return;
    }
    // humans
    const h = target;
    if (h.inCar) return;
    g.fx.blood(h.x, h.y - 8, kind === 'melee' ? 3 : 6);
    if (byPlayer) C.onPlayerHits(h, amt, kind);
    const nonLethal = kind === 'melee' && (!source || !source.weapon || source.weapon === 'fists' || source.weapon === 'knuckles' || source.weapon === 'bat');
    if (h.hp <= 0) {
      if (nonLethal && h.down <= 0 && !h.wasKO) {
        h.hp = 0;
        h.down = 18 + R.rng() * 12;
        h.wasKO = true;
        h.state = 'down';
        g.fx.text(h.x, h.y - 24, 'K.O.', '#f2e2c0');
        g.audio.sfx('ko');
        g.actors.noise(h.x, h.y, TS * 8, 'fight', source);
        if (byPlayer) R.bus.emit('player:ko', h);
      } else C.kill(h, source, kind);
      return;
    }
    // reaction to being hit
    if (h.down > 0) return;
    if (kind === 'melee' || kind === 'bullet') {
      g.actors.noise(h.x, h.y, TS * 7, kind === 'melee' ? 'fight' : 'scream', source);
    }
    if (source && source.kind && h.state !== 'fight') {
      const brave = h.tr.brave + (h.armed ? 0.25 : 0) + (h.cop ? 1 : 0) - (kind === 'bullet' ? 0.3 : 0);
      if (brave > 0.55 || h.hostile) {
        g.actors.setFight(h, source.inCar || source);
        if (R.rng() < 0.6) g.actors.say(h, R.dialog.line('fightBack', h));
      } else if (h.hp < 45) {
        h.state = 'surrender';
        h.timer = 8;
        g.actors.say(h, R.dialog.line('beg', h));
      } else {
        g.actors.setFlee(h, source, 10);
        g.actors.say(h, R.dialog.line('hurt', h));
      }
    }
  };

  // What the law thinks of the player's violence. Self-defence is free.
  C.onPlayerHits = function (h, amt, kind) {
    const g = game();
    if (h.cop) {
      if (!h.copHit) { h.copHit = true; g.law.crime('copAssault', h.x, h.y, { victim: h }); }
      return;
    }
    const selfDefence = h.attackedPlayer || h.hostile && (h.state === 'fight' || h.tag === 'mugger' || h.tag === 'bounty');
    if (selfDefence) return;
    if (h.brawl) return; // mutual fistfight after an antagonize
    if (!h.assaulted) {
      h.assaulted = true;
      g.law.crime('assault', h.x, h.y, { victim: h });
      if (h.person) {
        h.person.opinion = Math.max(-100, h.person.opinion - 30);
        h.person.fear = Math.min(100, h.person.fear + 30);
        g.pop.remember(h.person, 'hurt', `Some goon in a fedora beat on me for no reason.`, g.pop.day);
      }
    }
  };

  C.kill = function (h, source, kind) {
    const g = game();
    if (h.dead) return;
    h.dead = true;
    h.hp = 0;
    h.down = 0;
    h.bubble = null;
    h.state = 'dead';
    h.alert = null;
    const byPlayer = source === g.player || (source && source.driver === g.player);
    if (h.kind === 'a') {
      g.fx.blood(h.x, h.y, 8);
      if (byPlayer) g.player.stats.hunted++;
      return;
    }
    g.fx.pool(h.x, h.y);
    if (h.person) {
      g.pop.kill(h.person, byPlayer ? 'player' : kind || 'violence');
      g.pop.addNews(h.person.city, `${g.pop.name(h.person)} (${h.person.age}) found dead. ${byPlayer ? 'Police are asking questions.' : ''}`);
      R.bus.emit('person:died', h.person, byPlayer);
    }
    if (byPlayer) {
      g.player.stats.kills++;
      const armedHostile = h.hostile && h.armed && h.drawn;
      const excessive = h.hostile && !h.armed && D.weapons[g.player.weapon] && D.weapons[g.player.weapon].gun;
      if (h.cop) g.law.crime('copMurder', h.x, h.y, { victim: h });
      else if (!h.attackedPlayer && !(h.hostile && (armedHostile || h.tag === 'mugger' || h.tag === 'bounty' || !excessive)) && !h.brawlOnly) g.law.crime(kind === 'car' ? 'manslaughter' : 'murder', h.x, h.y, { victim: h });
      const city = g.world.cityAt((h.x / TS) | 0, (h.y / TS) | 0);
      if (city) { city.fear = Math.min(100, city.fear + 4); city.heat += 3; }
      g.player.rep.infamy += h.cop ? 6 : 3;
    }
    g.actors.noise(h.x, h.y, TS * 9, 'scream', source);
    R.bus.emit('actor:died', h, byPlayer);
  };

  C.runOver = function (v, a, speed) {
    const g = game();
    if (a === g.player) {
      if (speed > 40) { g.player.hurt(speed * 0.25, v, 'car'); g.player.knock(v.angle, speed * 1.5); }
      return;
    }
    if (a.hitByCar && performance.now() - a.hitByCar < 700) return;
    a.hitByCar = performance.now();
    const dmg = speed * (a.kind === 'a' ? 0.6 : 0.45);
    // knock back
    const ang = Math.atan2(a.y - v.y, a.x - v.x);
    g.actors.moveActor(a, Math.cos(ang) * speed * 1.2, Math.sin(ang) * speed * 1.2, 0.12);
    if (a.kind === 'h') {
      g.fx.blood(a.x, a.y - 6, 4);
      g.audio.sfx('thud', a.x, a.y);
      const byPlayer = v.driver === g.player;
      if (byPlayer && !a.hostile && !a.cop) {
        if (dmg >= a.hp) {} // handled by kill -> manslaughter
        else if (!a.assaulted && speed > 70) { a.assaulted = true; g.law.crime('reckless', a.x, a.y, { victim: a, minor: true }); }
      }
      if (dmg >= a.hp) C.kill(a, v.driver || v, 'car');
      else {
        a.hp -= dmg;
        a.down = 3 + speed / 40;
        g.actors.say(a, R.dialog.line('hitByCar', a));
      }
    } else {
      C.damage(a, dmg, v.driver || v, 'car');
    }
    v.vx *= 0.9; v.vy *= 0.9;
  };

  // ---------------------------------------------------------------- attacks
  // Generic attack from any attacker (player or NPC)
  C.attack = function (att, weaponId, aimAng, target) {
    const g = game();
    const w = D.weapons[weaponId];
    if (!w) return;
    if (w.melee) return C.melee(att, w, aimAng);
    if (w.gun) return C.shoot(att, w, aimAng, target);
    if (w.thrown) return C.throwIt(att, weaponId, w, aimAng, target);
  };

  C.melee = function (att, w, ang) {
    const g = game();
    const ox = att.x + Math.cos(ang) * 8, oy = att.y - 6 + Math.sin(ang) * 8;
    g.audio.sfx('swing', att.x, att.y);
    let hit = false;
    const cands = g.actors.near(att.x, att.y, w.range + 10);
    if (att !== g.player && !g.player.inCar && !g.player.inside) cands.push(g.player);
    for (const t of cands) {
      if (t === att || t.dead || t.inCar) continue;
      const d = R.dist(att.x, att.y, t.x, t.y);
      if (d > w.range + (t.r || 4)) continue;
      const a = Math.atan2(t.y - att.y, t.x - att.x);
      if (Math.abs(R.angDiff(ang, a)) > 1.1 && d > 8) continue;
      let dmg = w.dmg * (att.power || 1) * (0.85 + R.rng() * 0.3);
      if (t.down > 0 && att === g.player) dmg *= 2.2;
      C.damage(t, dmg, att, 'melee');
      if (t !== g.player && t.kind === 'h' && !t.dead) g.actors.moveActor(t, Math.cos(a) * w.knock, Math.sin(a) * w.knock, 0.12);
      g.fx.hit(t.x, t.y - 10);
      g.audio.sfx(w === D.weapons.knife ? 'stab' : 'punch', t.x, t.y);
      hit = true;
      if (att === g.player) g.cam.shake(1.5);
      break;
    }
    if (!hit && att === g.player) {
      // hit cars / world
      const v = g.traffic.nearestCar(ox, oy, 14);
      if (v && !v.wrecked) {
        g.traffic.damage(v, w.dmg * 0.4, att);
        g.fx.sparks(ox, oy, 3);
        g.audio.sfx('bump', ox, oy);
        if (v.parked || (v.driver && !v.driver.dead)) {
          if (v.driver && v.driver.kind === 'h' && v.driver !== g.player) {
            v.dentCount = (v.dentCount || 0) + 1;
            if (v.dentCount === 2) g.traffic.aggrieved(v, 50);
